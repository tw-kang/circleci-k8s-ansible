additionalPrometheusRulesMap:
  alertmanager-self-monitoring:
    groups:
    - name: alertmanager-self.rules
      rules:
      - alert: AlertmanagerWebhookFailing
        annotations:
          description: AlertManager has failed to deliver {{ $value | printf "%.0f"
            }} webhook notification(s) to the Teams receiver in the last 5 minutes.
            Check Power Automate flow status and egress to *.logic.azure.com. Sustained
            failure means alerts are silent until repeat_interval (3h).
          summary: AlertManager webhook delivery failing
        expr: "increase(\n  alertmanager_notifications_failed_total{integration=\"webhook\"}[5m]\n)
          > 0"
        for: 5m
        labels:
          scope: meta
          severity: critical
  cluster-node-alerts:
    groups:
    - name: cluster-node.rules
      rules:
      - alert: ClusterNodeRunTmpfsFilling
        annotations:
          description: '{{ $labels.instance }} has held more than 4GiB in /run for
            30 minutes. /run is tmpfs, so this is unswappable RAM the node cannot
            reclaim. The known cause is journald falling back to a volatile journal
            — check `journalctl --disk-usage`, that /var/log/journal exists, and that
            /etc/systemd/journald.conf.d/10-cubrid-ci.conf is in place. Fix by running
            playbooks/apply-node-tuning.yml on the node.'
          summary: /run tmpfs > 4GiB on {{ $labels.instance }}
        expr: node_filesystem_size_bytes{job="node-exporter",mountpoint="/run"} -
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/run"} > 4 *
          1024 * 1024 * 1024
        for: 30m
        labels:
          scope: cluster
          severity: warning
  external-node-alerts:
    groups:
    - name: external-node.rules
      rules:
      - alert: ExternalNodeDown
        annotations:
          description: Prometheus has been unable to scrape node_exporter on {{ $labels.instance
            }} for 3 minutes (6 missed scrapes). Likely host down, network partition,
            or node_exporter crash.
          summary: External node {{ $labels.instance }} is DOWN
        expr: up{job="external-node-exporter"} == 0
        for: 3m
        labels:
          scope: external
          severity: critical
      - alert: ExternalNodeDiskFull
        annotations:
          description: Disk > 90% for 10m on {{ $labels.mountpoint }}
          summary: Disk > 90% on {{ $labels.instance }} ({{ $labels.mountpoint }})
        expr: "(1 - (\n  node_filesystem_avail_bytes{job=\"external-node-exporter\",fstype!~\"tmpfs|overlay\",mountpoint!~\"/boot|/boot/.+\"}\n
          \ / node_filesystem_size_bytes{job=\"external-node-exporter\",fstype!~\"tmpfs|overlay\",mountpoint!~\"/boot|/boot/.+\"}\n))
          * 100 > 90"
        for: 10m
        labels:
          scope: external
          severity: warning
  gha-ci-alerts:
    groups:
    - name: gha-ci.rules
      rules:
      - alert: GhaCiFuseClientSpinning
        annotations:
          description: The glusterfs client backing {{ $labels.mountpoint }} on {{
            $labels.instance }} has held at least 90% of one core for 6 minutes. Every
            job on that worker is now several times slower and will not recover on
            its own. Remount it — cordon, `umount -l {{ $labels.mountpoint }}`, then
            `systemctl start home-ci-shared.mount`, uncordon. `systemctl restart`
            fails while job pods hold the mount. Do not kill or pstack the old client
            (pitfall 91); abort its fuse connection.
          summary: gha-ci FUSE client spinning on {{ $labels.instance }}
        expr: rate(gha_ci_fuse_client_cpu_seconds_total[5m]) >= 0.9
        for: 6m
        labels:
          scope: gha-ci
          severity: critical
      - alert: GhaCiNodePodSlotsLow
        annotations:
          description: '{{ $labels.node }} has held more than 90% of its maxPods for
            10 minutes. New runners will not schedule there and the lane will crowd
            onto the other worker. Check for job pods that outlived their run, and
            read the lane caps in inventory/production/group_vars/arc/runner.yml.'
          summary: '{{ $labels.node }} is at {{ $value | printf "%.0f%%" }} of its
            pod ceiling'
        expr: max by (node) (count by (node, instance) (kube_pod_info{node!=""}))
          / on (node) group_left () max by (node) (kube_node_status_capacity{resource="pods"})
          > 0.9
        for: 10m
        labels:
          scope: gha-ci
          severity: warning
      - alert: GhaCiNodeOomKill
        annotations:
          description: 'The kernel OOM-killed {{ $value | printf "%.0f" }} process(es)
            on {{ $labels.instance }} in the last 10 minutes. On a worker the usual
            cause is a job pod''s /rw or /build-rw tmpfs filling: tmpfs has no swap,
            so it is not evicted. The peaks are printed by `Publish results for collect`
            in every run.'
          summary: Kernel OOM kill on {{ $labels.instance }}
        expr: increase(node_vmstat_oom_kill{job="node-exporter"}[10m]) > 0
        for: 0m
        labels:
          scope: gha-ci
          severity: warning
      - alert: GhaCiJobPodPending
        annotations:
          description: '{{ $labels.pod }} has been Pending for 10 minutes. The hook
            pins a job pod to its runner''s node with spec.nodeName, so this is that
            node refusing it — no pod slot, no memory, or an image pull that is not
            finishing.'
          summary: gha-ci job pod {{ $labels.pod }} Pending for 10m
        expr: kube_pod_status_phase{namespace="gha-ci",phase="Pending"} == 1 and on
          (namespace, pod) kube_pod_labels{label_gha_ci_cubrid_org_lane!=""}
        for: 10m
        labels:
          scope: gha-ci
          severity: warning
alertmanager:
  alertmanagerSpec:
    configSecret: alertmanager-config
    nodeSelector:
      node-role.kubernetes.io/control-plane: ''
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
    tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
  service:
    nodePort: 32002
    type: NodePort
grafana:
  adminPassword: DUMMY-vault_grafana_admin_password
  adminUser: admin
  defaultDashboardsTimezone: Asia/Seoul
  enabled: true
  initChownData:
    enabled: false
  nodeSelector:
    node-role.kubernetes.io/control-plane: ''
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: local-path
  resources:
    limits:
      cpu: 2000m
      memory: 3Gi
    requests:
      cpu: 500m
      memory: 1Gi
  service:
    nodePort: 32000
    type: NodePort
  sidecar:
    dashboards:
      enabled: true
      provider:
        allowUiUpdates: true
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
kube-state-metrics:
  metricLabelsAllowlist:
  - pods=[gha-ci.cubrid.org/lane]
  nodeSelector:
    node-role.kubernetes.io/control-plane: ''
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
