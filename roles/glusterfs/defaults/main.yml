---
glusterfs_replica_count: 2

# build-cache is addressed by these three; `glusterfs_volumes` expands them.
glusterfs_volume_name: "build-cache"
glusterfs_brick_dir: "/home/gluster/brick1"
glusterfs_mount_point: "/home/build-cache"
glusterfs_builds_dir: "{{ glusterfs_mount_point }}/builds"

# `dirs` are relative to the mount point; the workflow creates the rest.
glusterfs_volumes:
  - name: "{{ glusterfs_volume_name }}"
    brick_dir: "{{ glusterfs_brick_dir }}"
    mount_point: "{{ glusterfs_mount_point }}"
    dirs:
      - "builds"
  # `lru-limit=0`: the eviction's entry invalidations stalled every lookup on a
  # directory once the inode LRU sat at its cap (issue 72, worker-01 2026-09-18).
  - name: "gha-ci"
    brick_dir: "/home/gluster/gha-ci/brick1"
    mount_point: "/home/ci/shared"
    opts: "defaults,_netdev,lru-limit=0,invalidate-limit=64"
    dirs:
      - "runs"
      - "builds/develop"
      - "builds/pr"
      - "timings"
      - "_fork"

glusterfs_repo_url: "https://mirror.stream.centos.org/SIGs/8/storage/x86_64/gluster-10/"
glusterfs_repo_gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-SIG-Storage"

glusterfs_mount_opts: "defaults,_netdev"

# Extra client mounts of volumes listed above. The mount only.
glusterfs_extra_mounts: []

glusterfs_peer_probe_retries: 5
glusterfs_peer_probe_delay: 3

glusterfs_cleanup_cronjob_enabled: true
# Renaming it would leave the old CronJob running beside the new one after a
# rollback, and two prunes on one brick is what took the FUSE clients down.
glusterfs_cleanup_cronjob_name: "build-cache-cleanup"

# kube-system always exists, so the CronJob needs no ordering against it.
glusterfs_cleanup_namespace: "kube-system"

# 03:00 KST. The nightly batch and its children hold 00:20-02:00 (issue 74).
glusterfs_cleanup_schedule: "0 3 * * *"

# So a prune wedged on a sick client cannot hold `Forbid` over the next nights.
glusterfs_cleanup_deadline_seconds: 21600

# The node paths the cleanup pod binds. Every path below sits under one.
glusterfs_cleanup_mounts:
  - "/home/ci/shared"
  - "{{ glusterfs_mount_point }}"

# One window per class, withdrawing the single window of DECISIONS-1537.
# `runs` is also how long the UI's re-run works: it reads the run directory.
# A build is not that kind of window -- a re-run builds what has gone again.
glusterfs_cleanup_dirs:
  - { path: "/home/ci/shared/runs", days: 30 }
  - { path: "/home/ci/shared/builds/pr", days: 7 }
  - { path: "/home/ci/shared/builds/develop", days: 30 }
  - { path: "/home/ci/shared/_fork/runs", days: 15 }
  - { path: "/home/ci/shared/_fork/builds/pr", days: 3 }
  - { path: "/home/ci/shared/_fork/builds/develop", days: 15 }
  # CircleCI's own tree. Goes with the volume, and this line with it (issue 25).
  - { path: "{{ glusterfs_builds_dir }}", days: 7 }

# `<mode>.tmp.<run>` and `.old.<run>`, left by a build cancelled mid-publish.
# The build swept its own until issue 56 took the sweep out.
glusterfs_cleanup_staging:
  - { path: "/home/ci/shared/builds", days: 1 }
  - { path: "/home/ci/shared/_fork/builds", days: 1 }

glusterfs_cleanup_image: "busybox:1.36"

# Only kube_node mounts GlusterFS.
glusterfs_cleanup_node_selector:
  node-role.kubernetes.io/worker: ""

# One-off deletion (issue 72 D6), through a mount of its own so the bulk
# unlink never shares a client with the job pods.
#   ansible-playbook playbooks/cluster-only.yml --tags glusterfs_purge
glusterfs_purge_mount_point: "/mnt/gha-ci-maint"
glusterfs_purge_volume: "gha-ci"
# Their readers moved to /home/ci/seed and /home/ci/cache (issue 72 D1/D2).
glusterfs_purge_paths:
  - "{{ glusterfs_purge_mount_point }}/repos"
  - "{{ glusterfs_purge_mount_point }}/cache"

# The `tc` and `testtools` trees in every run directory: published per run
# until issue 56, read by nothing since. The shard takes both from the node
# copy, and nginx already answers 404 for the CTP one.
glusterfs_purge_run_roots:
  - "{{ glusterfs_purge_mount_point }}/runs"
  - "{{ glusterfs_purge_mount_point }}/_fork/runs"
