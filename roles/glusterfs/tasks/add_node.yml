---
# GlusterFS Add Node Tasks
# For adding a new node to existing GlusterFS cluster

- name: Get new node IP
  ansible.builtin.set_fact:
    new_node_ip: "{{ hostvars[inventory_hostname]['ansible_host'] }}"

- name: Create brick directories on new node
  ansible.builtin.file:
    path: "{{ item.brick_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Get first existing node
  ansible.builtin.set_fact:
    first_node: "{{ groups['kube_node'] | first }}"
    first_node_ip: "{{ hostvars[groups['kube_node'] | first]['ansible_host'] }}"

# Run peer probe from existing node
- name: Probe new node from first node
  ansible.builtin.command: "gluster peer probe {{ new_node_ip }}"
  delegate_to: "{{ first_node }}"
  register: peer_probe_result
  changed_when: "'success' in peer_probe_result.stdout"
  failed_when: "'failed' in peer_probe_result.stdout and 'already in peer list' not in peer_probe_result.stdout"
  retries: "{{ glusterfs_peer_probe_retries }}"
  delay: "{{ glusterfs_peer_probe_delay }}"

- name: Wait for peer connection
  ansible.builtin.pause:
    seconds: 5

- name: Add brick to each volume
  ansible.builtin.command: >
    gluster volume add-brick {{ item.name }}
    replica {{ glusterfs_replica_count | int + 1 }}
    {{ new_node_ip }}:{{ item.brick_dir }}
    force
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ first_node }}"
  register: add_brick_result
  failed_when: false
  changed_when: "'success' in add_brick_result.stdout"

- name: Display add brick result
  ansible.builtin.debug:
    var: add_brick_result.results | map(attribute='stdout_lines') | list

- name: Create mount points on new node
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"

- name: Mount GlusterFS volumes on new node
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "localhost:{{ item.name }}"
    fstype: glusterfs
    opts: "{{ glusterfs_mount_opts }}"
    state: mounted
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify mounts on new node
  ansible.builtin.command: "df -h {{ item.mount_point }}"
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  register: mount_verify
  changed_when: false

- name: Display mount status
  ansible.builtin.debug:
    msg: "{{ mount_verify.results | map(attribute='stdout') | list }}"
