---
# GlusterFS Reset/Cleanup Tasks
# Completely remove GlusterFS from all nodes

- name: Force unmount GlusterFS volumes (lazy)
  ansible.builtin.command: "umount -l {{ item.mount_point }}"
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  ignore_errors: true
  changed_when: false

- name: Force unmount GlusterFS volumes (force)
  ansible.builtin.command: "umount -f {{ item.mount_point }}"
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  ignore_errors: true
  changed_when: false

- name: Remove from fstab
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    state: absent
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  ignore_errors: true

# Stop and delete volumes (first node only)
- name: Stop and delete GlusterFS volumes
  when: inventory_hostname == groups['kube_node'][0]
  block:
    - name: Stop volumes
      ansible.builtin.command: "gluster volume stop {{ item.name }} force"
      loop: "{{ glusterfs_volumes }}"
      loop_control:
        label: "{{ item.name }}"
      register: volume_stop
      failed_when: false
      changed_when: "'success' in volume_stop.stdout"

    - name: Delete volumes
      ansible.builtin.command: "gluster volume delete {{ item.name }}"
      loop: "{{ glusterfs_volumes }}"
      loop_control:
        label: "{{ item.name }}"
      register: volume_delete
      failed_when: false
      changed_when: "'success' in volume_delete.stdout"

    - name: Detach all peers
      ansible.builtin.command: "gluster peer detach {{ hostvars[item]['ansible_host'] }} force"
      loop: "{{ groups['kube_node'][1:] }}"
      register: peer_detach
      failed_when: false
      changed_when: "'success' in peer_detach.stdout"

- name: Stop glusterd service
  ansible.builtin.systemd:
    name: glusterd
    state: stopped
    enabled: no
  ignore_errors: true

- name: Remove GlusterFS packages
  ansible.builtin.dnf:
    name:
      - glusterfs-server
      - glusterfs-fuse
      - glusterfs-cli
      - glusterfs
    state: absent
  ignore_errors: true

- name: Remove brick directories
  ansible.builtin.file:
    path: "{{ item.brick_dir }}"
    state: absent
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true

- name: Remove parent gluster directory
  ansible.builtin.file:
    path: "/home/gluster"
    state: absent
  ignore_errors: true

- name: Remove mount point directories
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: absent
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  ignore_errors: true

- name: Remove GlusterFS metadata
  ansible.builtin.file:
    path: "/var/lib/glusterd"
    state: absent
  ignore_errors: true

- name: Remove GlusterFS logs
  ansible.builtin.file:
    path: "/var/log/glusterfs"
    state: absent
  ignore_errors: true

- name: Remove GlusterFS repo file
  ansible.builtin.file:
    path: /etc/yum.repos.d/CentOS-Gluster-10.repo
    state: absent
  ignore_errors: true

- name: Display cleanup status
  ansible.builtin.debug:
    msg: "GlusterFS cleanup completed on {{ inventory_hostname }}"
