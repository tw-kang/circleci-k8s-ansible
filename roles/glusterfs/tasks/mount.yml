---
# GlusterFS Mount Tasks

- name: Check if mount points exist
  ansible.builtin.stat:
    path: "{{ item.mount_point }}"
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  register: mount_point_stat

- name: Create mount point directories
  ansible.builtin.file:
    path: "{{ item.item.mount_point }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ mount_point_stat.results }}"
  loop_control:
    label: "{{ item.item.mount_point }}"
  when: not item.stat.exists

- name: Mount GlusterFS volumes
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "localhost:{{ item.name }}"
    fstype: glusterfs
    opts: "{{ glusterfs_mount_opts }}"
    state: mounted
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create top-level directories
  ansible.builtin.file:
    path: "{{ item.0.mount_point }}/{{ item.1 }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ glusterfs_volumes | subelements('dirs') }}"
  loop_control:
    label: "{{ item.0.mount_point }}/{{ item.1 }}"
  run_once: true

- name: Verify mounts
  ansible.builtin.command: "df -h {{ item.mount_point }}"
  loop: "{{ glusterfs_volumes }}"
  loop_control:
    label: "{{ item.mount_point }}"
  register: mount_verify
  changed_when: false

- name: Display mount status
  ansible.builtin.debug:
    msg: "{{ mount_verify.results | map(attribute='stdout') | list }}"
