---
# CircleCI Container Runner setup tasks
- name: Check system architecture for CircleCI runner
  command: uname -m
  register: runner_arch_check
  changed_when: false
  tags:
    - circleci-arch

- name: Check container runtime socket
  stat:
    path: "{{ item }}"
  register: socket_check
  loop:
    - /var/run/containerd/containerd.sock
    - /var/run/docker.sock
  tags:
    - circleci-arch

- name: Set architecture-specific configurations
  set_fact:
    circleci_arch_label: "{{ 'arm64' if runner_arch_check.stdout == 'aarch64' else 'amd64' }}"
    container_socket_path: "{{ socket_check.results | selectattr('stat.exists') | map(attribute='item') | first | default('/var/run/docker.sock') }}"
  tags:
    - circleci-arch

- name: Display CircleCI runner architecture configuration
  debug:
    msg: |
      CircleCI Runner Configuration:
      - System Architecture: {{ runner_arch_check.stdout }}
      - Kubernetes Architecture Label: {{ circleci_arch_label }}
      - Container Socket: {{ container_socket_path }}
  tags:
    - circleci-arch

- name: Create CircleCI namespace
  k8s:
    name: circleci
    api_version: v1
    kind: Namespace
    state: present
  tags:
    - circleci-namespace

- name: Create CircleCI runner configuration directory
  file:
    path: "{{ paths.circleci_config }}"
    state: directory
    mode: '0755'
  tags:
    - circleci-config

- name: Create CircleCI runner secret
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: circleci-runner-token
        namespace: circleci
      type: Opaque
      data:
        token: "{{ circleci.runner.token | b64encode }}"
  tags:
    - circleci-secret

- name: Create CircleCI runner ServiceAccount
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: circleci-runner
        namespace: circleci
  tags:
    - circleci-rbac

- name: Create CircleCI runner ClusterRole
  k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: circleci-runner
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/log", "pods/exec"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["secrets", "configmaps"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["apps"]
          resources: ["deployments", "replicasets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  tags:
    - circleci-rbac

- name: Create CircleCI runner ClusterRoleBinding
  k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: circleci-runner
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: circleci-runner
      subjects:
        - kind: ServiceAccount
          name: circleci-runner
          namespace: circleci
  tags:
    - circleci-rbac

- name: Create CircleCI runner ConfigMap
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleci-runner-config
        namespace: circleci
      data:
        agent.yaml: |
          api:
            auth_token: ${CIRCLECI_API_TOKEN}
          runner:
            name: "k8s-runner-{{ ansible_hostname }}"
            command_prefix: ["sudo", "-niHu", "circleci", "--"]
            working_directory: /tmp/circleci-runner
            cleanup_working_directory: true
          logging:
            level: INFO
          kubernetes:
            namespace: circleci
            service_account: circleci-runner
            gc_threshold: "10m"
            max_run_time: "5h"
            resource_class: "{{ circleci.runner.resource_class }}"
            image: "{{ circleci.runner.image }}"
            # Resource limits for runner containers
            resources:
              limits:
                cpu: "2"
                memory: "4Gi"
              requests:
                cpu: "100m"
                memory: "512Mi"
  tags:
    - circleci-config

- name: Create CircleCI runner Deployment
  k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: circleci-runner
        namespace: circleci
        labels:
          app: circleci-runner
      spec:
        replicas: "{{ circleci.runner.replicas }}"
        selector:
          matchLabels:
            app: circleci-runner
        template:
          metadata:
            labels:
              app: circleci-runner
          spec:
            serviceAccountName: circleci-runner
            containers:
              - name: circleci-runner
                image: circleci/runner:launch-agent
                env:
                  - name: CIRCLECI_API_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: circleci-runner-token
                        key: token
                  - name: CIRCLECI_RUNNER_API_URL
                    value: "https://runner.circleci.com"
                  - name: CIRCLECI_RESOURCE_CLASS
                    value: "{{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}"
                  - name: LAUNCH_AGENT_RUNNER_MODE
                    value: "kubernetes"
                volumeMounts:
                  - name: runner-config
                    mountPath: /opt/circleci/agent.yaml
                    subPath: agent.yaml
                    readOnly: true
                  - name: container-sock
                    mountPath: "{{ '/var/run/containerd/containerd.sock' if container_socket_path == '/var/run/containerd/containerd.sock' else '/var/run/docker.sock' }}"
                    readOnly: true
                resources:
                  limits:
                    cpu: "500m"
                    memory: "1Gi"
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                securityContext:
                  runAsUser: 0
                  privileged: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: false
                  capabilities:
                    drop:
                      - ALL
            volumes:
              - name: runner-config
                configMap:
                  name: circleci-runner-config
              - name: container-sock
                hostPath:
                  path: "{{ container_socket_path }}"
                  type: Socket
            nodeSelector:
              kubernetes.io/arch: "{{ circleci_arch_label }}"
            tolerations:
              - operator: Exists
                effect: NoSchedule
  register: circleci_deployment_result
  failed_when: circleci_deployment_result.failed and 'already exists' not in circleci_deployment_result.msg | default('')
  tags:
    - circleci-deployment

- name: Wait for CircleCI runner deployment to be ready
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: circleci-runner
    namespace: circleci
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  register: circleci_wait_result
  failed_when: 
    - circleci_wait_result.failed
    - "'timed out' in circleci_wait_result.msg | default('')"
  tags:
    - circleci-deployment

- name: Create CircleCI runner monitoring Service (optional)
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: circleci-runner-metrics
        namespace: circleci
        labels:
          app: circleci-runner
      spec:
        selector:
          app: circleci-runner
        ports:
          - name: metrics
            port: 9090
            targetPort: 9090
            protocol: TCP
        type: ClusterIP
  tags:
    - circleci-service

- name: Display CircleCI runner status
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: circleci-runner
    namespace: circleci
  register: runner_status
  tags:
    - circleci-status

- name: Show CircleCI runner deployment status
  debug:
    msg: |
      CircleCI Runner Deployment Status:
      - Replicas: {{ runner_status.resources[0].status.replicas | default(0) }}
      - Ready Replicas: {{ runner_status.resources[0].status.readyReplicas | default(0) }}
      - Available Replicas: {{ runner_status.resources[0].status.availableReplicas | default(0) }}
      - Resource Class: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
  tags:
    - circleci-status 