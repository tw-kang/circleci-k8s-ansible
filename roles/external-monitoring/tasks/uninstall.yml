---
- name: Check if node_exporter unit file exists
  ansible.builtin.stat:
    path: /etc/systemd/system/node_exporter.service
  register: ne_unit_file

- name: Stop and disable node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    state: stopped
    enabled: false
    daemon_reload: true
  when: ne_unit_file.stat.exists

- name: Remove systemd unit file
  ansible.builtin.file:
    path: /etc/systemd/system/node_exporter.service
    state: absent

- name: Remove node_exporter binary
  ansible.builtin.file:
    path: "{{ node_exporter_bin_dir }}/node_exporter"
    state: absent

- name: Check if node_exporter user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ node_exporter_user }}"
  register: ne_user_check
  failed_when: false

- name: Remove node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    state: absent
    remove: false
  when: ne_user_check.ansible_facts is defined

- name: Check if node_exporter group exists
  ansible.builtin.getent:
    database: group
    key: "{{ node_exporter_group }}"
  register: ne_group_check
  failed_when: false

- name: Remove node_exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    state: absent
  when: ne_group_check.ansible_facts is defined

- name: Reload systemd after unit removal
  ansible.builtin.systemd:
    daemon_reload: true
