---
- name: Assert SHA256 is defined for this node_exporter version
  ansible.builtin.assert:
    that: node_exporter_version in node_exporter_sha256_map
    fail_msg: >-
      No SHA256 recorded for node_exporter {{ node_exporter_version }}.
      Add it to node_exporter_sha256_map in monitoring-external.yml.

- name: Create node_exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Ensure textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: "0755"

## The controller fetches and extracts once; every host gets the binary by
## copy, which compares checksums and transfers nothing when they match.
## Downloading per host never converged: cleanup deleted the tarball, and
## systemd-tmpfiles clears /tmp at 10 days, so both inputs were always gone.
##
## check_mode: false on the three controller tasks — a rehearsal writes no
## host state, but it must fill the cache, or the unarchive below has no
## source. It also makes the PR gate verify the tarball SHA256 of a version
## bump, which until now only surfaced after the merge.
- name: Ensure controller cache directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false

- name: Fetch node_exporter tarball on controller (with SHA256 verification)
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url_mirror | default('', true) or node_exporter_download_url }}"
    dest: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256_map[node_exporter_version] }}"
    mode: "0644"
    validate_certs: true
    timeout: 60
  retries: 3
  delay: 10
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false

- name: Extract node_exporter tarball on controller
  ansible.builtin.unarchive:
    src: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "{{ node_exporter_cache_dir }}/"
    remote_src: true
    creates: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false

## restart is here, not only on the unit template: the template carries no
## version, so a version bump left the old process running until reboot.
- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_bin_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
  notify:
    - restorecon node_exporter
    - restart node_exporter

- name: Apply SELinux context
  ansible.builtin.import_tasks: selinux.yml

- name: Deploy systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Apply firewalld rules
  ansible.builtin.import_tasks: firewall.yml

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
