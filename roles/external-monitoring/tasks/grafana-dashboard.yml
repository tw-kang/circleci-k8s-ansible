---
# Grafana sub-chart's gnetId mechanism produces an empty ConfigMap, so
# the dashboard JSON is vendored under files/ and applied here directly.
# Bump: re-download grafana.com/api/dashboards/1860/revisions/<N>/download
# and replace files/node-exporter-full-rev37.json.

- name: Apply Grafana dashboard ConfigMap from vendored JSON
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboard-node-exporter-full
        namespace: "{{ kube_prometheus_stack_namespace }}"
        labels:
          grafana_dashboard: "1"
          app.kubernetes.io/managed-by: ansible
      data:
        node-exporter-full.json: "{{ lookup('ansible.builtin.file', role_path ~ '/files/node-exporter-full-rev37.json') }}"
