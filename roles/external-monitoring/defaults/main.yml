---
# external-monitoring role defaults. Three sub-tasks dispatch via
# tasks_from:, each runs against a different host class:
#   node-exporter (external_nodes) / scrape-config (localhost) /
#   adapter (kube_control_plane[0])
# Variable prefixes (node_exporter_ / external_scrape_ / am_teams_adapter_)
# keep namespaces grep-able.

# --- node_exporter (tasks/node-exporter.yml) ---
node_exporter_version: "1.8.2"
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_bin_dir: /usr/local/bin
node_exporter_listen_address: "0.0.0.0:9100"
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
node_exporter_force_reinstall: false

node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
node_exporter_download_url_mirror: ""  # internal HTTP mirror; overrides download_url when set

node_exporter_sha256: "{{ node_exporter_sha256_map[node_exporter_version] }}"

# Discovered via kubectl at play time (Prometheus pod hostIPs, not the
# Ansible-detected NIC). See deploy-external-monitoring.yml.
node_exporter_prometheus_source_ips: []

node_exporter_manage_firewalld: true   # false on hosts without firewalld
node_exporter_uninstall_only: false    # rollback drill switch

node_exporter_collectors_enabled:
  - systemd
  - processes
node_exporter_collectors_disabled:
  - arp

# --- scrape-config (tasks/scrape-config.yml) ---
external_scrape_environment: "production"
external_scrape_managed_by: "ansible"
external_scrape_node_type: "external"
external_scrape_port: 9100

# Per-host fallbacks when an inventory row omits the field. Hosts hitting
# these still alert but without a personal @mention.
external_scrape_owner_email_default: ""
external_scrape_test_purpose_default: "unassigned"

# --- alertmanager → Teams adapter (tasks/adapter.yml) ---
am_teams_adapter_namespace: monitoring
am_teams_adapter_name: alertmanager-teams-adapter
am_teams_adapter_image: python:3.12-slim
am_teams_adapter_listen_port: 8080
am_teams_adapter_replicas: 1
am_teams_adapter_target_timeout: "15"

am_teams_adapter_resources:
  requests: {cpu: "20m",  memory: "32Mi"}
  limits:   {cpu: "200m", memory: "128Mi"}

# Power Automate URL is a bearer secret (sig= query param). Injected via
# env-from-secret so kubectl describe / -o yaml does not leak it.
am_teams_adapter_target_url: "{{ vault_teams_webhook_url }}"
