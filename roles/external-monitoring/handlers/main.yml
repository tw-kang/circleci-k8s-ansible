---
- name: restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: restorecon node_exporter
  ansible.builtin.command: "restorecon -v {{ node_exporter_bin_dir }}/node_exporter"
  register: _restorecon_handler
  changed_when: "'Relabeled' in (_restorecon_handler.stdout | default(''))"
  failed_when: false
