---
# Kubernetes worker setup tasks
- name: Check if node is already joined to cluster
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: node_joined

- name: Generate new join command from master
  shell: |
    export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH"
    kubeadm token create --print-join-command
  register: fresh_join_command
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  when: not node_joined.stat.exists
  tags:
    - join-cluster

- name: Join worker node to cluster
  command: "{{ fresh_join_command.stdout }}"
  when: not node_joined.stat.exists
  register: join_result
  tags:
    - join-cluster

- name: Display worker node join completion
  debug:
    msg: "Worker node join completed: {{ ansible_hostname }}"
  when: join_result.rc == 0
  tags:
    - join-cluster

- name: Wait for master API server to be available
  wait_for:
    host: "{{ hostvars[groups['k8s_masters'][0]]['ansible_default_ipv4']['address'] }}"
    port: 6443
    timeout: 90
    delay: 5
  tags:
    - k8s-join

- name: Label worker node
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ ansible_hostname }}"
        labels:
          node-role.kubernetes.io/worker: ""
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  tags:
    - node-labeling

- name: Apply taints to worker node (if any)
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ ansible_hostname }}"
      spec:
        taints: "{{ k8s_worker.taints }}"
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  when: k8s_worker.taints | length > 0
  tags:
    - node-tainting

# No cleanup needed as join command is generated dynamically 