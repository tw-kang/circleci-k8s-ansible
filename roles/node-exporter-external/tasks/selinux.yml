---
- name: Check SELinux enforcement state
  ansible.builtin.command: getenforce
  register: selinux_state
  changed_when: false
  failed_when: false

- name: Restore SELinux context on node_exporter binary
  ansible.builtin.command: "restorecon -v {{ node_exporter_bin_dir }}/node_exporter"
  when: selinux_state.stdout in ['Enforcing', 'Permissive']
  register: restorecon_result
  changed_when: "'Relabeled' in (restorecon_result.stdout | default(''))"

- name: Fallback — add semanage fcontext bin_t if restorecon failed
  ansible.builtin.command: >-
    semanage fcontext -a -t bin_t "{{ node_exporter_bin_dir }}/node_exporter"
  when:
    - selinux_state.stdout == 'Enforcing'
    - restorecon_result.rc is defined
    - restorecon_result.rc != 0
  register: semanage_result
  changed_when: semanage_result.rc == 0
  failed_when: false

- name: Apply semanage fcontext change via restorecon
  ansible.builtin.command: "restorecon -v {{ node_exporter_bin_dir }}/node_exporter"
  when:
    - semanage_result is not skipped
    - semanage_result.rc is defined
    - semanage_result.rc == 0
  changed_when: true
