---
# Role plumbing only — deployment values live in
# inventory/production/group_vars/arc/runner.yml.
#
# ⚠ Every variable this role reads MUST carry the `arc_` prefix. Group `arc`
#   and group `circleci` land on the same host and `circleci` wins an
#   alphabetical merge, so an unprefixed name is silently replaced with the
#   CircleCI value — no error, wrong runner. See README.md.

arc_chart_ref: "oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set"

# One controller per lane, in the lane's own namespace (decision 27). The
# chart grants the listener role inside `.namespace` whatever
# `flags.watchSingleNamespace` says, so a cluster-wide controller in `default`
# keeps the production listener there instead.
# ⚠ Moving off the cluster-wide controller has a mandatory order and a
#   finalizer trap. Read "컨트롤러 lane 분리" in README.md first.
arc_controller_manage: false
arc_controller_release: "arc-controller"
arc_controller_service_account: "arc-controller-gha-rs-controller"
arc_controller_chart_ref: "oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller"
arc_controller_chart_version: "0.14.2"

# ⚠ `release` is the same on both lanes on purpose. The helm release name IS
#   the runner label and the workflow says `runs-on: cubrid-arc`. The
#   namespace separates them.
arc_production_lane:
  name: "production"
  namespace: "{{ arc_namespace }}"
  release: "{{ arc_release }}"
  github_url: "{{ arc_github_url }}"
  min_runners: "{{ arc_min_runners }}"
  max_runners: "{{ arc_max_runners }}"
  storage_root: "{{ arc_storage_root }}"
  config_path: "{{ arc_config_path }}"
  credential_prefix: "vault_arc"
  # Empty: this lane mounts the root itself, so the mirror is already inside.
  mirror_hostpath: ""

arc_fork_lane:
  name: "fork"
  namespace: "{{ arc_fork_namespace }}"
  release: "{{ arc_release }}"
  github_url: "{{ arc_fork_github_url }}"
  min_runners: "{{ arc_min_runners }}"
  max_runners: "{{ arc_fork_max_runners }}"
  storage_root: "{{ arc_fork_storage_root }}"
  config_path: "{{ arc_fork_config_path }}"
  credential_prefix: "vault_arc_fork"
  # This lane mounts a subdirectory of the root, so the mirror falls outside
  # it. A relative symlink cannot reach it — `..` stops at the bind-mount root
  # (verified 2026-08-24). Re-mount it in place instead, readOnly.
  mirror_hostpath: "{{ arc_storage_root }}/repos"

arc_artifact_server_enabled: true
arc_artifact_server_name: "gha-artifacts"
arc_artifact_server_namespace: "{{ arc_namespace }}"
# ⚠ This is the workflow's CI_ROOT. Summary links are ARTIFACT_URL_BASE + a
#   path relative to CI_ROOT, so the two only ever move together.
arc_artifact_server_root: "{{ arc_storage_root }}"
arc_artifact_server_image: "nginx:1.27-alpine"
arc_artifact_server_container_port: 8080
