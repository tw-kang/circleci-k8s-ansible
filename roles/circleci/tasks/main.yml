---
# CircleCI Container Runner setup tasks using official Helm chart
# Based on: https://circleci.com/docs/container-runner-installation/
#
# PREREQUISITES:
# - Helm must be installed via Kubespray by setting helm_enabled: true 
#   in group_vars/k8s_cluster/addons.yml before running cluster setup
# - Kubernetes cluster must be ready and accessible

- name: Display CircleCI runner setup information
  debug:
    msg: "Setting up CircleCI Runner: {{ runner.namespace }}/{{ runner.resource_class }}"

- name: Install CircleCI runner using official Helm chart
  include_tasks: helm-install.yml
  tags:
    - circleci-helm
    - circleci-install

