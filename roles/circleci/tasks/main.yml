---
# CircleCI Container Runner setup using official Helm chart

# Guard: staging_token is defined only in the production inventory. Failing
# here (before any helm change) keeps a deploy from the stale staging
# inventory from overwriting the live release with wrong limits
# (see docs/backlog.md).
- name: Require staging_token (stale-staging-inventory guard)
  assert:
    that: staging_token is defined
    fail_msg: "staging_token undefined — deploying from the stale staging inventory? (docs/backlog.md)"
  tags: [always]

- name: Verify Helm is available
  command: helm version --short
  register: helm_check
  failed_when: false
  changed_when: false

- name: Fail if Helm is not installed
  fail:
    msg: "Helm is not installed. Please ensure helm_enabled: true is set in group_vars/k8s_cluster/addons.yml"
  when: helm_check.rc != 0

- name: Add CircleCI Helm repository
  kubernetes.core.helm_repository:
    name: container-agent
    repo_url: https://packagecloud.io/circleci/container-agent/helm
    state: present
    force_update: true

- name: Check if CircleCI namespace exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ circleci_namespace }}"
  register: namespace_check
  failed_when: false

- name: Create CircleCI namespace if it doesn't exist
  kubernetes.core.k8s:
    name: "{{ circleci_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  when: namespace_check.resources | length == 0

- name: Create CircleCI config directory
  file:
    path: "{{ circleci_config_path }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Create CircleCI values.yaml from template
  template:
    src: circleci-values.yaml.j2
    dest: "{{ circleci_config_path }}/values.yaml"
    mode: '0644'
    backup: yes

- name: Deploy CircleCI container runner
  kubernetes.core.helm:
    name: container-agent
    chart_ref: container-agent/container-agent
    release_namespace: "{{ circleci_namespace }}"
    create_namespace: false
    values_files:
      - "{{ circleci_config_path }}/values.yaml"
    state: present
    wait: false

# Staging canary lane: a dedicated release so canary-lane rollouts never touch
# the cubrid/ramdisk lane (CUBRIDQA-1474 stage 1 / ADR-0007 precursor).
- name: Create CircleCI staging values.yaml from template
  template:
    src: circleci-staging-values.yaml.j2
    dest: "{{ circleci_config_path }}/staging-values.yaml"
    mode: '0644'
    backup: yes
  tags: [staging_agent]

- name: Deploy CircleCI staging container runner
  kubernetes.core.helm:
    name: container-agent-staging
    chart_ref: container-agent/container-agent
    release_namespace: "{{ circleci_namespace }}"
    create_namespace: false
    values_files:
      - "{{ circleci_config_path }}/staging-values.yaml"
    state: present
    wait: false
  tags: [staging_agent]
