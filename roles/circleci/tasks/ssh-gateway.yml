---
# CircleCI SSH Rerun Feature with Envoy Gateway
# Based on: https://circleci.com/docs/container-runner-installation/#enable-rerun-job-with-ssh-optional---open-preview

- name: Check if SSH rerun feature is enabled
  debug:
    msg: |
      SSH rerun feature status: {{ runner.ssh_enabled | default(false) | ternary('Enabled', 'Disabled') }}
      
      To use SSH rerun feature, configure the following:
      In group_vars/all.yml:
      circleci:
        runner:
          ssh_enabled: true
  tags:
    - circleci-ssh
    - ssh-check

- name: Install Gateway API CRDs and Envoy Gateway
  block:
    # - name: Check if Gateway API CRDs are installed
    #   kubernetes.core.k8s_info:
    #     api_version: apiextensions.k8s.io/v1
    #     kind: CustomResourceDefinition
    #     name: gateways.gateway.networking.k8s.io
    #   register: gateway_api_check
    #   failed_when: false
    
    - name: Check if Gateway API CRDs are installed (kubectl)
      shell: kubectl get crd gateways.gateway.networking.k8s.io 2>/dev/null
      register: gateway_api_check
      failed_when: false
      changed_when: false
      
    - name: Create envoy-gateway-system namespace
      kubernetes.core.k8s:
        name: envoy-gateway-system
        api_version: v1
        kind: Namespace
        state: present
      when: gateway_api_check.rc != 0
      
    - name: Get latest Envoy Gateway version
      uri:
        url: https://api.github.com/repos/envoyproxy/gateway/releases/latest
        return_content: true
      register: envoy_release
      when: gateway_api_check.rc != 0
      
    - name: Set Envoy Gateway version
      set_fact:
        envoy_gateway_version: "{{ envoy_release.json.tag_name }}"
      when: 
        - gateway_api_check.rc != 0
        - envoy_release.json.tag_name is defined
        
    - name: Install Envoy Gateway using Helm
      kubernetes.core.helm:
        name: eg
        chart_ref: oci://docker.io/envoyproxy/gateway-helm
        release_namespace: envoy-gateway-system
        create_namespace: true
        state: present
        wait: true
        wait_timeout: 120
        version: "{{ envoy_gateway_version | default('v1.0.2') }}"
      register: envoy_install_result
      when: gateway_api_check.rc != 0
      
    - name: Wait for Envoy Gateway to be ready
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: envoy-gateway
        namespace: envoy-gateway-system
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
        wait_sleep: 10
      register: envoy_deployment
    
    - name: Display Envoy Gateway installation status
      debug:
        msg: |
          Envoy Gateway installation completed!
          
          Installation information:
          - Namespace: envoy-gateway-system
          - Version: {{ envoy_gateway_version | default('v1.0.2') }}
          - Status: {{ envoy_install_result.status.status if envoy_install_result.status is defined else 'Installed' }}
          
          Verification commands:
          - kubectl get pods -n envoy-gateway-system
          - kubectl get gateway -A
      when: gateway_api_check.rc != 0
      
  when: runner.ssh_enabled | default(false)
  tags:
    - circleci-ssh
    - envoy-gateway

- name: Create Gateway for CircleCI SSH access
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: circleci-ssh-gateway
        namespace: "{{ runner.namespace }}"
      spec:
        gatewayClassName: envoy-gateway
        listeners:
          - name: ssh
            port: 2222
            protocol: TCP
            allowedRoutes:
              namespaces:
                from: Same
  when: runner.ssh_enabled | default(false)
  tags:
    - circleci-ssh
    - ssh-gateway

- name: Create TCPRoute for SSH traffic
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1alpha2
      kind: TCPRoute
      metadata:
        name: circleci-ssh-route
        namespace: "{{ runner.namespace }}"
      spec:
        parentRefs:
          - name: circleci-ssh-gateway
            sectionName: ssh
        rules:
          - backendRefs:
              - name: container-agent
                port: 22
  when: runner.ssh_enabled | default(false)
  tags:
    - circleci-ssh
    - ssh-route

# Gateway status is checked using kubectl command below

- name: Check Gateway status (kubectl)
  shell: |
    kubectl get gateway circleci-ssh-gateway -n {{ runner.namespace }} -o json 2>/dev/null || echo '{"metadata":{"name":"unknown"},"status":{}}'
  register: gateway_status_raw
  when: runner.ssh_enabled | default(false)
  failed_when: false
  changed_when: false
  tags:
    - circleci-ssh
    - ssh-verification

# - name: Get Gateway external IP/hostname
#   kubernetes.core.k8s_info:
#     api_version: v1
#     kind: Service
#     namespace: envoy-gateway-system
#     label_selectors:
#       - gateway.envoyproxy.io/owning-gateway-namespace=circleci
#       - gateway.envoyproxy.io/owning-gateway-name=circleci-ssh-gateway
#   register: gateway_service
#   when: runner.ssh_enabled | default(false)
#   tags:
#     - circleci-ssh
#     - ssh-verification

- name: Get Gateway service info (kubectl)
  shell: |
    kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-namespace={{ runner.namespace }} -o json 2>/dev/null || echo '{"items":[]}'
  register: gateway_service_raw
  when: runner.ssh_enabled | default(false)
  failed_when: false
  changed_when: false
  tags:
    - circleci-ssh
    - ssh-verification

- name: Display SSH rerun configuration information
  debug:
    msg:
      - "🔐 CircleCI SSH rerun feature has been configured!"
      - ""
      - "Gateway status:"
      - "- Check command: kubectl get gateway circleci-ssh-gateway -n {{ runner.namespace }}"
      - "- Service check: kubectl get svc -n envoy-gateway-system"
      - ""
      - "External access information:"
      - "- SSH port: 2222"
      - "- Check external IP with: kubectl get svc -n envoy-gateway-system"
      - ""
      - "Usage:"
      - "1. Run job with 'Rerun with SSH' in CircleCI web console"
      - "2. Use the SSH connection command when displayed"
      - "3. Connection example: ssh -p 2222 circleci@<external-IP>"
      - ""
      - "Important notes:"
      - "- SSH session is maintained for up to 2 hours"
      - "- Automatically terminated after 10 minutes if not connected"
      - "- The runner cannot process other jobs while session is active"
      - ""
      - "Troubleshooting:"
      - "- Check Gateway status: kubectl get gateway circleci-ssh-gateway -n {{ runner.namespace }}"
      - "- Check TCPRoute: kubectl get tcproute circleci-ssh-route -n {{ runner.namespace }}"
      - "- Envoy Gateway logs: kubectl logs -n envoy-gateway-system -l app.kubernetes.io/name=envoy-gateway"
  when: runner.ssh_enabled | default(false)
  tags:
    - circleci-ssh
    - ssh-verification

- name: Display SSH feature disabled message
  debug:
    msg: |
      ℹ️  SSH rerun feature is disabled.
      
      To enable it, configure the following in group_vars/all.yml:
      
      circleci:
        runner:
          ssh_enabled: true
          
      Then re-run the playbook:
      ansible-playbook playbooks/deploy-circleci.yml --tags circleci-ssh
  when: not (runner.ssh_enabled | default(false))
  tags:
    - circleci-ssh 