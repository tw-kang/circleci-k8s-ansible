---
# Build the in-memory `external_scrape_static_configs` fact consumed by
# the kube-prometheus-stack Prometheus values to populate
# `additionalScrapeConfigs[0].static_configs`.
#
# Each external host emits its own static_config so per-host metadata
# (owner_email, test_purpose) declared on the inventory row becomes a
# label on every metric scraped from that host. Alerts inherit those
# labels and carry them through AlertManager into the adapter, where
# the adapter converts owner_email into a Teams @mention.
#
# The `distribution` label (centos7 / rocky8) is preserved on each
# per-host static_config so dashboards filtering on distribution
# continue to work.
#
# This role only constructs structure with `loop` + minimal Jinja so
# it does not depend on the from_yaml / map / flatten filter chain.
# Some controller environments have a broken Ansible filter loader
# (see project memory note), and `set_fact` + dict-literal works on
# the safest subset.

- name: Initialize per-host scrape entry list
  ansible.builtin.set_fact:
    _external_scrape_entries: []

- name: Append CentOS 7 host entries
  ansible.builtin.set_fact:
    _external_scrape_entries: >-
      {{ _external_scrape_entries + [{
        'targets': [hostvars[item]['ansible_host'] + ':' + (external_scrape_port | string)],
        'labels': {
          'distribution': 'centos7',
          'node_type': external_scrape_node_type,
          'environment': external_scrape_environment,
          'managed_by': external_scrape_managed_by,
          'owner_email': hostvars[item].get('owner_email', external_scrape_owner_email_default),
          'test_purpose': hostvars[item].get('test_purpose', external_scrape_test_purpose_default)
        }
      }] }}
  loop: "{{ groups['external_centos7'] | default([]) }}"

- name: Append Rocky 8 host entries
  ansible.builtin.set_fact:
    _external_scrape_entries: >-
      {{ _external_scrape_entries + [{
        'targets': [hostvars[item]['ansible_host'] + ':' + (external_scrape_port | string)],
        'labels': {
          'distribution': 'rocky8',
          'node_type': external_scrape_node_type,
          'environment': external_scrape_environment,
          'managed_by': external_scrape_managed_by,
          'owner_email': hostvars[item].get('owner_email', external_scrape_owner_email_default),
          'test_purpose': hostvars[item].get('test_purpose', external_scrape_test_purpose_default)
        }
      }] }}
  loop: "{{ groups['external_rocky8'] | default([]) }}"

- name: Publish external_scrape_static_configs fact
  ansible.builtin.set_fact:
    external_scrape_static_configs: "{{ _external_scrape_entries }}"

- name: Show per-host scrape target count
  ansible.builtin.debug:
    msg: >-
      External scrape targets: {{ _external_scrape_entries | length }}
      ({{ groups['external_centos7'] | default([]) | length }} CentOS7 +
      {{ groups['external_rocky8'] | default([]) | length }} Rocky8)
      — labels per-host include owner_email + test_purpose
