---
# CUBRIDQA-1515: no /var/log/journal existed, so journald kept the journal in
# /run (tmpfs) and held 4GiB of RAM. The default RuntimeMaxUse is 10% of the
# tmpfs (~25GiB here), so capping it is what prevents a repeat — raising
# system_memory_reserved would just get refilled.

journald_storage: persistent
journald_system_max_use: 4G
journald_runtime_max_use: 256M

journald_dropin_path: /etc/systemd/journald.conf.d/10-cubrid-ci.conf

# CUBRIDQA-1301: a PR whose shell tests failed en masse produced enough core
# dumps that systemd-coredump processing OOM-killed the host and took kubelet
# down. Cores now land in the process working directory — inside the pod — so
# they disappear with it instead of accumulating on the node.
#
# core_pattern must stay relative. An absolute path whose directory is missing
# makes the kernel drop cores silently, which is what the workers were doing.

coredump_storage: none
coredump_core_pattern: core

coredump_dropin_path: /etc/systemd/coredump.conf.d/disable.conf

# CUBRIDQA-1501 issue 17: the gha-ci FUSE client spins on one core and stalls
# every job on that worker. It happened on 2026-09-16, 09-18 and 09-21 and a
# person noticed each time, hours late. Client CPU is the only leading
# indicator that held up (issue 72 pitfall 90), and node_exporter publishes no
# per-process CPU, so a timer writes it to the textfile collector instead.

gha_ci_fuse_mountpoint: /home/gha-ci
gha_ci_fuse_volume: gha-ci
gha_ci_fuse_metrics_script: /usr/local/sbin/gha-ci-fuse-metrics.sh
gha_ci_fuse_metrics_interval: 30s

# `node_exporter_textfile_dir` is not defaulted here on purpose. The same path
# is the daemonset's --collector.textfile.directory, so it has one home:
# inventory/production/group_vars/k8s_cluster/monitoring.yml, which both this
# role's play and deploy-monitoring.yml see.
