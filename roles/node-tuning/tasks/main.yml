---
- name: Create the persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  # Creating this is what moves the journal off tmpfs; the drop-in only bounds it.
  notify: Restart systemd-journald

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: "{{ journald_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the journald drop-in
  ansible.builtin.template:
    src: journald-dropin.conf.j2
    dest: "{{ journald_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  # No validate: systemd-analyze verify only accepts unit files, not
  # journald.conf drop-ins. A bad file surfaces as the journald restart failing.
  notify: Restart systemd-journald

- name: Flush handlers so the reading below is post-restart
  ansible.builtin.meta: flush_handlers

- name: Read journald memory usage
  ansible.builtin.command:
    cmd: systemctl show systemd-journald -p MemoryCurrent --value
  changed_when: false
  check_mode: false
  register: journald_memory

- name: Report journald memory usage
  ansible.builtin.debug:
    msg: >-
      systemd-journald MemoryCurrent =
      {{ (journald_memory.stdout | int / 1048576) | round(1) }} MiB
      {{ '(check mode: value BEFORE the change)'
         if ansible_check_mode
         else '(was ~4040 MiB before this role)' }}
