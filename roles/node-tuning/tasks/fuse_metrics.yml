---
- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    ## node_exporter reads this as uid 65534. 0750 makes it invisible.
    mode: "0755"

- name: Install the gha-ci FUSE metrics collector
  ansible.builtin.template:
    src: gha-ci-fuse-metrics.sh.j2
    dest: "{{ gha_ci_fuse_metrics_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the collector unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - gha-ci-fuse-metrics.service
    - gha-ci-fuse-metrics.timer

- name: Enable the collector timer
  ansible.builtin.systemd_service:
    name: gha-ci-fuse-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  ## --check writes no unit, so systemd finds none and serial: 1 ends the
  ## dry run on the first host.
  when: not ansible_check_mode
