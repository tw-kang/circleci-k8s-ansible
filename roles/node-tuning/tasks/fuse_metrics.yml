---
# CUBRIDQA-1501 issue 17. Nothing here touches kubelet, so it carries none of
# pitfall 92's constraint — it can run while jobs are on the node.

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the gha-ci FUSE metrics collector
  ansible.builtin.template:
    src: gha-ci-fuse-metrics.sh.j2
    dest: "{{ gha_ci_fuse_metrics_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the collector unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - gha-ci-fuse-metrics.service
    - gha-ci-fuse-metrics.timer

- name: Enable the collector timer
  ansible.builtin.systemd_service:
    name: gha-ci-fuse-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
