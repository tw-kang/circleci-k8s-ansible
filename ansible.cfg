[defaults]
# Basic Configuration
inventory = inventory/production/hosts.yml
roles_path = roles:3rdparty/kubspray/roles
library = library:3rdparty/kubspray/library
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True
vault_password_file = .vault-password

# SSH Configuration - Centralized configuration
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey
pipelining = True

# Connection and Performance
forks = 10
poll_interval = 5
timeout = 30
fact_caching = memory
fact_caching_timeout = 86400

# Logging
log_path = /tmp/ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# Privilege Escalation
become = True
become_method = sudo
become_ask_pass = False

# Collection paths for kubernetes modules
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

[inventory]
enable_plugins = yaml, ini, auto

[ssh_connection]
retries = 3
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey
pipelining = True
control_path_dir = /tmp/.ansible-cp

[persistent_connection]
connect_timeout = 30
command_timeout = 30 