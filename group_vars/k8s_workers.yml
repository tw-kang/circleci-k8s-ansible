# Variables specific to Kubernetes worker nodes
---
# Worker node configuration
k8s_worker:
  # Node labels
  labels:
    node-type: "worker"
    workload: "general"
  
  # Node taints (if any)
  taints: []

# Additional packages specific to worker nodes only  
# Base packages are inherited from group_vars/all.yml automatically
packages_additional:
  # Worker-specific monitoring and testing tools
  worker_tools:
    - stress-ng        # CPU/메모리 부하 테스트
    - iotop           # I/O 모니터링
    - htop            # 프로세스 모니터링 (추가)
    - sysstat         # 시스템 성능 통계
    - perf            # 성능 프로파일링
  
  # Kubernetes networking tools
  kubernetes_tools:
    - kubernetes-cni

# Resource limits for worker nodes
resources:
  # Reserve resources for system processes
  system_reserved:
    cpu: "100m"
    memory: "512Mi"
    ephemeral_storage: "1Gi"
  
  # Reserve resources for Kubernetes components
  kube_reserved:
    cpu: "100m"
    memory: "512Mi"
    ephemeral_storage: "1Gi"

# Storage configuration
storage:
  # Local storage provisioner
  local_storage_enabled: false
  local_storage_path: "/opt/local-storage" 