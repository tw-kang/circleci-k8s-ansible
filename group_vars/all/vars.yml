# Common variables for all nodes
---
# Ansible connection configuration
ansible_python_interpreter: /usr/bin/python3

# SSH Configuration
ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
# SSH connection arguments, retries, and timeout are configured in ansible.cfg

# Kubernetes configuration
kubernetes:
  version: "1.28.15"
  cni_plugin: "calico"  # Default for production x86_64 environment
  pod_network_cidr: "10.244.0.0/16"
  service_network_cidr: "10.96.0.0/12"
  cluster_name: "circleci-k8s-cluster"
  # For ARM64 environments, automatically switches to Flannel

# Architecture-specific overrides
# Force use of Flannel CNI in ARM64 environments
kubernetes_cni_override: "flannel"  # Only used for ARM64

# Container runtime configuration
container_runtime:
  name: "containerd"
  version: "1.7.27"  # Updated for ARM64 compatibility
  # For ARM64 systems, containerd will be installed from GitHub releases
  # For x86_64 systems, containerd will be installed from Docker repository

# System configuration
system:
  timezone: "Asia/Seoul"
  ntp_servers:
    - "pool.ntp.org"
    - "time.bora.net"
    - "time.kornet.net"
  os_family: "RedHat"
  os_version: "8"
  package_manager: "dnf"
  # Architecture detection: will be set automatically (aarch64 or x86_64)
  # This affects containerd installation method

# Network configuration
network:
  firewall_enabled: false  # Set to true if you want to configure firewall rules
  # For Rocky Linux 8, firewalld is the default firewall
  
# CircleCI Runner configuration (Helm Chart method)
circleci:
  runner:
    namespace: "cubrid-test"  # CircleCI namespace
    resource_class: "large-test"  # Resource class
    token: "{{ vault_circleci_token }}"  # Token encrypted with Ansible Vault
    image: "cimg/base:stable"  # Default runner image
    replicas: 3  # Number of runner replicas (increased for testing)
    ssh_enabled: false  # Enable SSH rerun feature (requires Envoy Gateway)
    # Minimum resource specifications for testing
    resources:
      requests:
        cpu: "100m"      # Minimum CPU request
        memory: "256Mi"  # Minimum memory request
      limits:
        cpu: "500m"      # CPU limit
        memory: "1Gi"    # Memory limit
  runner_enabled: true

# Package management configuration
packages:
  # Base system packages (installed on all nodes)
  base_system:
    - dnf-utils
    - device-mapper-persistent-data
    - lvm2
    - curl
    - wget
    - vim
    - git
    - net-tools
    - bind-utils
    - iptables-services
    - firewalld
    - chrony
    - htop
  
  # Python packages (installed on all nodes)
  python_system:
    - python3-pip
    - python3-setuptools
  
  # Python libraries via pip (installed on all nodes)
  python_libs:
    - kubernetes
    - PyYAML
    - jsonpatch
  
  # Kubernetes packages (installed on all nodes)
  kubernetes_base:
    - "kubelet-{{ kubernetes.version }}"
    - "kubeadm-{{ kubernetes.version }}"
    - "kubectl-{{ kubernetes.version }}"

# Directory paths
paths:
  k8s_manifests: "/opt/kubernetes/manifests"
  circleci_config: "/opt/circleci" 