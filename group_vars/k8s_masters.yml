# Variables specific to Kubernetes master nodes
---
# Master node configuration
k8s_master:
  # Allow master node to schedule pods (remove taint)
  allow_scheduling: true
  
  # API server configuration
  api_server:
    bind_port: 6443
    advertise_address: "{{ hostvars['k8s-master-01']['ansible_host'] | default(ansible_default_ipv4.address) }}"
  
  # etcd configuration
  etcd:
    data_dir: "/var/lib/etcd"
    
  # Control plane endpoint
  control_plane_endpoint: "{{ hostvars['k8s-master-01']['ansible_host'] | default(ansible_default_ipv4.address) }}:6443"

# Additional packages specific to master nodes only
# Base packages are inherited from group_vars/all.yml automatically
packages_additional:
  # Management and development tools for master nodes
  master_tools:
    - jq        # JSON 처리
    - yq        # YAML 처리  
    - tree      # 디렉토리 구조 표시
    - unzip     # 압축 해제
    - wget2     # 향상된 다운로드 도구
  
  # Kubernetes client tools
  kubernetes_tools:
    - kubernetes-cni

# Helm configuration (for installing applications)
helm:
  enabled: true
  version: "3.13.0"

# Ingress controller configuration
ingress:
  enabled: true
  controller: "nginx"  # nginx or traefik
  
# Monitoring configuration
monitoring:
  enabled: false  # Set to true if you want to install monitoring stack
  prometheus: false
  grafana: false 