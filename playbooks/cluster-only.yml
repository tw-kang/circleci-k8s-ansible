---
# Kubernetes cluster setup using Kubespray
- name: Display cluster setup information
  hosts: k8kube_control_plane[0]
  gather_facts: false
  tasks:
    - name: Display setup information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                  Kubernetes Cluster Installation            ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Configuration Info:
          ├─ Cluster: {{ cluster_name }}
          ├─ Network Plugin: {{ kube_network_plugin }}
          └─ Container Runtime: {{ container_manager }}

# Import Kubespray cluster playbook
- import_playbook: ../3rdparty/kubespray/cluster.yml

# Post-installation verification
- name: Verify Kubernetes cluster
  hosts: kube_control_plane
  gather_facts: false
  
  tasks:
    - name: Get cluster status
      k8s_info:
        api_version: v1
        kind: Node
      register: node_status
      run_once: true
      tags:
        - verification
      
    - name: Display setup completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                      Cluster Completed                      ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_name }}
          Node Count: {{ node_status.resources | length }}
          Network Plugin: {{ kube_network_plugin }}
          
          Verification Commands:
          ├─ kubectl get nodes
          ├─ kubectl get pods -A
          └─ kubectl get pods -n kube-system
          
      run_once: true
      tags:
        - verification 