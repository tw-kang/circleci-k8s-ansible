---
# Main playbook with automatic rollback capability
- name: Kubernetes Cluster Setup with Rollback Protection
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    auto_rollback_on_failure: "{{ auto_rollback_on_failure | default(true) }}"
    backup_system_state: "{{ backup_system_state | default(true) }}"
    installation_checkpoint: "none"
    
  pre_tasks:
    - name: Create installation state directory
      file:
        path: /tmp/k8s-install-state
        state: directory
        mode: '0755'
      when: backup_system_state
      
    - name: Backup current system state
      block:
        - name: Check existing services
          systemd:
            name: "{{ item }}"
          register: service_states
          loop:
            - kubelet
            - containerd
            - docker
          failed_when: false
          
        - name: Save service states
          copy:
            content: "{{ service_states | to_nice_json }}"
            dest: /tmp/k8s-install-state/services-before.json
            mode: '0644'
            
        - name: Check existing packages
          command: rpm -qa | grep -E "(kubelet|kubeadm|kubectl|containerd|docker)"
          register: packages_before
          failed_when: false
          
        - name: Save package states  
          copy:
            content: "{{ packages_before.stdout }}"
            dest: /tmp/k8s-install-state/packages-before.txt
            mode: '0644'
            
      when: backup_system_state
      tags:
        - backup
    
    - name: Validate required variables
      assert:
        that:
          - circleci.runner.namespace is defined
          - circleci.runner.resource_class is defined
          - circleci.runner.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/all.yml"
    
    - name: Display cluster information
      debug:
        msg: |
          Setting up Kubernetes cluster with rollback protection:
          - Auto Rollback: {{ auto_rollback_on_failure }}
          - Backup State: {{ backup_system_state }}
          - Cluster Name: {{ kubernetes.cluster_name }}
          - Kubernetes Version: {{ kubernetes.version }}

  tasks:
    # Checkpoint 1: Common Setup
    - name: Phase 1 - Common Kubernetes Setup
      block:
        - name: Set checkpoint
          set_fact:
            installation_checkpoint: "common-setup"
            
        - name: Setup common Kubernetes components
          include_role:
            name: kubernetes-common
          tags:
            - common
            - kubernetes
            
        - name: Mark common setup complete
          copy:
            content: "common-setup-{{ ansible_date_time.epoch }}"
            dest: /tmp/k8s-install-state/checkpoint-common
            mode: '0644'
            
      rescue:
        - name: Common setup failed - initiating rollback
          debug:
            msg: "Common setup failed. Starting rollback process..."
            
        - name: Execute automatic rollback
          include: rollback.yml
          vars:
            rollback_level: "services-only"
          when: auto_rollback_on_failure
          
        - name: Fail with rollback message
          fail:
            msg: |
              Common Kubernetes setup failed!
              {% if auto_rollback_on_failure %}
              Automatic rollback has been executed.
              {% else %}
              To rollback manually, run: ansible-playbook playbooks/rollback.yml -e rollback_level=services-only
              {% endif %}

# Master Node Setup with Rollback
- name: Phase 2 - Kubernetes Master Setup
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    auto_rollback_on_failure: "{{ auto_rollback_on_failure | default(true) }}"
  
  tasks:
    - name: Master node setup with rollback protection
      block:
        - name: Set checkpoint
          set_fact:
            installation_checkpoint: "master-setup"
            
        - name: Setup Kubernetes master
          include_role:
            name: kubernetes-master
          tags:
            - master
            - kubernetes
            
        - name: Mark master setup complete
          copy:
            content: "master-setup-{{ ansible_date_time.epoch }}"
            dest: /tmp/k8s-install-state/checkpoint-master
            mode: '0644'
            
        - name: Verify master node is ready
          k8s_info:
            api_version: v1
            kind: Node
            name: "{{ ansible_hostname }}"
            wait: true
            wait_condition:
              type: Ready
              status: "True"
            wait_timeout: 300
          register: master_ready_check
          
      rescue:
        - name: Master setup failed - initiating rollback
          debug:
            msg: "Master setup failed. Starting rollback process..."
            
        - name: Execute automatic rollback
          include: rollback.yml
          vars:
            rollback_level: "partial"
          when: auto_rollback_on_failure
          delegate_to: localhost
          run_once: true
          
        - name: Fail with rollback message
          fail:
            msg: |
              Kubernetes Master setup failed!
              {% if auto_rollback_on_failure %}
              Automatic rollback has been executed.
              {% else %}
              To rollback manually, run: ansible-playbook playbooks/rollback.yml -e rollback_level=partial
              {% endif %}

# Worker Nodes Setup with Rollback
- name: Phase 3 - Kubernetes Worker Setup
  hosts: k8s_workers
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    auto_rollback_on_failure: "{{ auto_rollback_on_failure | default(true) }}"
    
  tasks:
    - name: Worker nodes setup with rollback protection
      block:
        - name: Set checkpoint
          set_fact:
            installation_checkpoint: "worker-setup"
            
        - name: Setup Kubernetes worker
          include_role:
            name: kubernetes-worker
          tags:
            - worker
            - kubernetes
            
        - name: Mark worker setup complete
          copy:
            content: "worker-setup-{{ ansible_date_time.epoch }}"
            dest: /tmp/k8s-install-state/checkpoint-worker
            mode: '0644'
            
      rescue:
        - name: Worker setup failed - rollback not required
          debug:
            msg: |
              Worker setup failed, but cluster is still functional.
              You can retry worker setup later or add nodes manually.
          
        - name: Continue without workers
          meta: clear_host_errors

# CircleCI Runner Setup with Rollback
- name: Phase 4 - CircleCI Runner Setup
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    auto_rollback_on_failure: "{{ auto_rollback_on_failure | default(true) }}"
    
  tasks:
    - name: CircleCI runner setup with rollback protection
      block:
        - name: Set checkpoint
          set_fact:
            installation_checkpoint: "circleci-setup"
            
        - name: Setup CircleCI container runner
          include_role:
            name: circleci-runner
          when: circleci_runner_enabled | default(true)
          tags:
            - circleci
            - runner
            
        - name: Mark CircleCI setup complete
          copy:
            content: "circleci-setup-{{ ansible_date_time.epoch }}"
            dest: /tmp/k8s-install-state/checkpoint-circleci
            mode: '0644'
            
        - name: Verify CircleCI runners
          k8s_info:
            api_version: apps/v1
            kind: Deployment
            name: circleci-runner
            namespace: circleci
            wait: true
            wait_condition:
              type: Available
              status: "True"
            wait_timeout: 300
          register: circleci_ready_check
          when: circleci_runner_enabled | default(true)
          
      rescue:
        - name: CircleCI setup failed - continuing without runners
          debug:
            msg: |
              CircleCI Runner setup failed, but Kubernetes cluster is functional.
              You can setup CircleCI runners later using:
              ansible-playbook playbooks/circleci-runner.yml
          
        - name: Continue without CircleCI
          meta: clear_host_errors

# Final Verification
- name: Phase 5 - Final Verification and Cleanup
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    
  tasks:
    - name: Final cluster verification
      block:
        - name: Get final cluster status
          k8s_info:
            api_version: v1
            kind: Node
          register: final_node_status
          
        - name: Get CircleCI status
          k8s_info:
            api_version: apps/v1
            kind: Deployment
            name: circleci-runner
            namespace: circleci
          register: final_circleci_status
          failed_when: false
          
        - name: Create installation success report
          copy:
            content: |
              # Kubernetes Installation Success Report
              Date: {{ ansible_date_time.iso8601 }}
              
              ## Cluster Status
              - Total Nodes: {{ final_node_status.resources | length }}
              - Ready Nodes: {{ final_node_status.resources | length }}
              
              ## CircleCI Status
              {% if final_circleci_status.resources %}
              - CircleCI Runners: {{ final_circleci_status.resources[0].status.replicas | default(0) }} deployed
              - Ready Replicas: {{ final_circleci_status.resources[0].status.readyReplicas | default(0) }}
              {% else %}
              - CircleCI Runners: Not deployed
              {% endif %}
              
              ## Access Information
              - Cluster API: {{ k8s_master.api_server.advertise_address }}:{{ k8s_master.api_server.bind_port }}
              - Resource Class: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
              
              ## Next Steps
              1. Access cluster: export KUBECONFIG=/etc/kubernetes/admin.conf
              2. Test: kubectl get nodes
              3. Monitor: kubectl get pods -A
              4. CircleCI: Configure your project to use the self-hosted runners
              
            dest: "/tmp/k8s-installation-success-{{ ansible_date_time.epoch }}.md"
            mode: '0644'
            
        - name: Display success message
          debug:
            msg: |
              🎉 Kubernetes Cluster Installation Completed Successfully!
              
              Cluster Summary:
              - Nodes: {{ final_node_status.resources | length }}
              {% if final_circleci_status.resources %}
              - CircleCI Runners: {{ final_circleci_status.resources[0].status.readyReplicas | default(0) }}/{{ final_circleci_status.resources[0].status.replicas | default(0) }}
              {% endif %}
              
              Installation report saved to: /tmp/k8s-installation-success-{{ ansible_date_time.epoch }}.md
              
        - name: Clean up installation state (optional)
          file:
            path: /tmp/k8s-install-state
            state: absent
          when: not backup_system_state
          
      always:
        - name: Installation complete
          debug:
            msg: "Installation process finished - check logs for any issues" 