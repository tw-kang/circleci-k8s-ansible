---
# Rollback playbook for Kubernetes cluster installation
- name: Kubernetes Cluster Rollback
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    rollback_level: "{{ rollback_level | default('full') }}"  # full, partial, services-only
    
  pre_tasks:
    - name: Display rollback information
      debug:
        msg: |
          Starting Kubernetes cluster rollback...
          - Rollback Level: {{ rollback_level }}
          - Target Hosts: {{ ansible_play_hosts | join(', ') }}
          - Timestamp: {{ ansible_date_time.iso8601 }}
          
          WARNING: This will remove Kubernetes components!
          
    - name: Confirm rollback execution
      pause:
        prompt: "Are you sure you want to proceed with rollback? Type 'yes' to continue"
      register: rollback_confirmation
      when: rollback_level == "full"
      
    - name: Validate rollback confirmation
      fail:
        msg: "Rollback cancelled by user"
      when: 
        - rollback_level == "full"
        - rollback_confirmation.user_input != "yes"
        
  tasks:
    # Step 1: Stop and reset Kubernetes services
    - name: Reset Kubernetes cluster (if initialized)
      block:
        - name: Check if kubeadm is available
          command: which kubeadm
          register: kubeadm_check
          failed_when: false
          changed_when: false
          
        - name: Reset kubeadm cluster
          command: kubeadm reset --force
          when: kubeadm_check.rc == 0
          register: kubeadm_reset_result
          
        - name: Remove Kubernetes configuration directories
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/kubernetes
            - /var/lib/kubelet
            - /var/lib/etcd
            - /etc/cni/net.d
            - ~/.kube
            - /root/.kube
            
        - name: Remove Kubernetes data directories
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /var/lib/kubernetes
            - /opt/kubernetes
            - /opt/cni/bin
            
      when: rollback_level in ['full', 'partial']
      tags:
        - kubernetes-reset
        
    # Step 2: Stop and remove services
    - name: Stop Kubernetes services
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - kubelet
        - containerd
      failed_when: false
      when: rollback_level in ['full', 'services-only']
      tags:
        - services-stop
        
    # Step 3: Remove Kubernetes packages
    - name: Remove Kubernetes packages
      block:
        - name: Unlock Kubernetes packages
          command: dnf versionlock delete kubelet kubeadm kubectl
          failed_when: false
          
        - name: Remove Kubernetes packages
          dnf:
            name:
              - kubelet
              - kubeadm 
              - kubectl
              - kubernetes-cni
              - cri-tools
            state: absent
            autoremove: yes
            
        - name: Remove Kubernetes repository
          file:
            path: /etc/yum.repos.d/kubernetes.repo
            state: absent
            
      when: rollback_level == 'full'
      tags:
        - packages-remove
        
    # Step 4: containerd rollback
    - name: Rollback containerd installation
      block:
        - name: Check system architecture for rollback
          command: uname -m
          register: rollback_arch
          changed_when: false
          
        - name: Stop containerd service
          systemd:
            name: containerd
            state: stopped
            enabled: no
          failed_when: false
          
        - name: Remove containerd configuration
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/containerd
            - /etc/systemd/system/containerd.service
            - /var/lib/containerd
            
        - name: Remove containerd binaries (ARM64)
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/local/bin/containerd
            - /usr/local/bin/containerd-shim
            - /usr/local/bin/containerd-shim-runc-v1
            - /usr/local/bin/containerd-shim-runc-v2
            - /usr/local/bin/ctr
            - /usr/local/sbin/runc
          when: rollback_arch.stdout == "aarch64"
          
        - name: Remove containerd package (x86_64)
          dnf:
            name: containerd.io
            state: absent
          when: rollback_arch.stdout == "x86_64"
          
        - name: Remove Docker repository
          file:
            path: /etc/yum.repos.d/docker-ce.repo
            state: absent
          when: rollback_arch.stdout == "x86_64"
          
      when: rollback_level == 'full'
      tags:
        - containerd-rollback
        
    # Step 5: Network and system rollback
    - name: Rollback system configurations
      block:
        - name: Remove kernel modules configuration
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/modules-load.d/k8s.conf
            - /etc/sysctl.d/k8s.conf
            
        - name: Remove iptables rules
          command: "{{ item }}"
          loop:
            - iptables -F
            - iptables -t nat -F
            - iptables -t mangle -F
            - iptables -X
          failed_when: false
          
        - name: Reload sysctl to remove Kubernetes settings
          command: sysctl --system
          
        - name: Re-enable swap (if it was disabled)
          command: swapon -a
          failed_when: false
          
      when: rollback_level == 'full'
      tags:
        - system-rollback
        
    # Step 6: Clean up temporary files
    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/kubeadm-join-command
        - /tmp/k8s-cluster-info.md
        - /tmp/containerd-*.tar.gz
        - /tmp/cni-plugins-*.tgz
        - /tmp/get_helm.sh
      tags:
        - cleanup
        
    # Step 7: Restart affected services
    - name: Restart network services
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - NetworkManager
        - firewalld
      failed_when: false
      when: rollback_level in ['full', 'partial']
      tags:
        - network-restart
        
  post_tasks:
    - name: Display rollback completion
      debug:
        msg: |
          Kubernetes Rollback Completed!
          
          Rollback Summary:
          - Level: {{ rollback_level }}
          - Kubernetes services: {{ 'Removed' if rollback_level in ['full', 'services-only'] else 'Kept' }}
          - Packages: {{ 'Removed' if rollback_level == 'full' else 'Kept' }}
          - Configuration: {{ 'Removed' if rollback_level in ['full', 'partial'] else 'Kept' }}
          
          System Status:
          - The system has been rolled back to pre-Kubernetes state
          - You may need to reboot the system for complete cleanup
          - Check /var/log/messages for any remaining issues
          
          Next Steps:
          1. Reboot the system: sudo reboot
          2. Verify cleanup: ps aux | grep -E "(kube|contain)"
          3. Check for remaining files: ls -la /etc/ | grep -E "(kube|contain)"
          4. Re-run installation if needed
          
    - name: Save rollback log
      copy:
        content: |
          # Kubernetes Rollback Log
          Date: {{ ansible_date_time.iso8601 }}
          Rollback Level: {{ rollback_level }}
          Hosts: {{ ansible_play_hosts | join(', ') }}
          
          ## Actions Performed:
          {% if rollback_level in ['full', 'partial'] %}
          - Kubernetes cluster reset (kubeadm reset)
          - Configuration directories removed
          - Data directories cleaned
          {% endif %}
          {% if rollback_level in ['full', 'services-only'] %}
          - Services stopped and disabled
          {% endif %}
          {% if rollback_level == 'full' %}
          - Packages removed
          - containerd uninstalled
          - System configuration reverted
          {% endif %}
          
          ## Manual Steps Required:
          1. Reboot system for complete cleanup
          2. Verify no remaining processes
          3. Check for configuration remnants
        dest: "/tmp/rollback-{{ ansible_date_time.epoch }}.log"
        mode: '0644'
      tags:
        - logging 