---
# Reset/Destroy Kubernetes cluster using Kubespray
- name: Display cluster reset warning
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if kubespray artifacts exist
      ansible.builtin.stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact

    - name: Display reset warning
      ansible.builtin.debug:
        msg: |2

          ╔══════════════════════════════════════════════════════════════╗
          ║                   CLUSTER RESET WARNING                     ║
          ╚══════════════════════════════════════════════════════════════╝

          This operation will COMPLETELY DESTROY the Kubernetes cluster:
          ├─ All Kubernetes components will be removed
          ├─ All container data will be deleted
          ├─ All cluster configurations will be cleared
          └─ All persistent volumes may be lost

          WARNING: THIS ACTION IS IRREVERSIBLE

          Note: Kubespray will prompt for confirmation during execution.

          Kubectl artifacts: {{ 'Available' if kubectl_artifact.stat.exists else 'Not found - cluster may already be destroyed' }}

# Reset GlusterFS before Kubespray reset
- name: Reset GlusterFS cluster
  hosts: kube_node
  become: true
  gather_facts: false
  tasks:
    - name: Reset GlusterFS
      ansible.builtin.include_role:
        name: glusterfs
        tasks_from: reset.yml
      tags:
        - glusterfs
        - glusterfs_reset
      ignore_errors: true

# Import Kubespray reset playbook (includes built-in confirmation)
- name: Reset Kubernetes cluster
  import_playbook: ../3rdparty/kubespray/reset.yml

# Post-reset verification and cleanup
- name: Verify Cluster Reset and Clean Node Data Directories
  hosts: kube_control_plane:kube_node
  become: true
  gather_facts: false

  tasks:
    - name: Remove containerd data source directory
      ansible.builtin.file:
        path: /home/containerd-data
        state: absent
      tags:
        - cleanup
        - containerd

    - name: Remove kubelet data source directory
      ansible.builtin.file:
        path: /home/kubelet-data
        state: absent
      tags:
        - cleanup
        - kubelet

    - name: Check if kubelet service exists
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
      register: kubelet_status
      failed_when: false
      tags:
        - verification

    - name: Check for remaining Kubernetes processes
      ansible.builtin.shell: "ps aux | grep -E 'kube|etcd|containerd' | grep -v grep || true"
      register: remaining_processes
      tags:
        - verification

    - name: Check for remaining Kubernetes directories
      ansible.builtin.find:
        paths:
          - /etc/kubernetes
          - /var/lib/kubelet
          - /var/lib/etcd
          - /opt/cni
        file_type: directory
      register: remaining_dirs
      failed_when: false
      tags:
        - verification

    - name: Check if containerd data directory was removed
      ansible.builtin.stat:
        path: /home/containerd-data
      register: containerd_data_dir_status
      tags:
        - verification
        - containerd

    - name: Check if kubelet data directory was removed
      ansible.builtin.stat:
        path: /home/kubelet-data
      register: kubelet_data_dir_status
      tags:
        - verification
        - kubelet

# Cleanup kubespray artifacts after reset
- name: Cleanup kubespray artifacts
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Remove kubespray artifacts directory
      ansible.builtin.file:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts"
        state: absent
      tags:
        - cleanup
        - artifacts

    - name: Check if artifacts were removed
      ansible.builtin.stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts"
      register: artifacts_status
      tags:
        - verification

    - name: Display reset completion
      ansible.builtin.debug:
        msg: |2

          ╔══════════════════════════════════════════════════════════════╗
          ║                    Cluster Reset Completed                  ║
          ╚══════════════════════════════════════════════════════════════╝

          Reset Summary:
          ├─ Kubelet service: Checked on all nodes
          ├─ Kubernetes processes: Checked for cleanup
          ├─ Kubernetes directories: Verified removal
          ├─ Containerd data directory: {{ 'Removed' if not containerd_data_dir_status.stat.exists else 'Still present' }}
          ├─ Kubelet data directory: {{ 'Removed' if not kubelet_data_dir_status.stat.exists else 'Still present' }}
          ├─ GlusterFS: Cleaned up (volume, bricks, packages)
          └─ Kubespray artifacts: {{ 'Removed' if not artifacts_status.stat.exists else 'Still present' }}

          Cluster reset operation completed successfully.

          Next steps:
          ├─ Reboot nodes to ensure clean state
          ├─ Verify network interfaces are clean
          ├─ Check firewall rules if needed
          └─ Ready for fresh cluster deployment

      run_once: true
      tags:
        - verification
