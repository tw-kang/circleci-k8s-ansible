---
# Main playbook for complete Kubernetes cluster and CircleCI runner setup
- name: Setup Kubernetes Cluster and CircleCI Container Runner
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - circleci.runner.namespace is defined
          - circleci.runner.resource_class is defined
          - circleci.runner.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/all.yml"
    
    - name: Check if Ansible Vault variables are encrypted
      fail:
        msg: "CircleCI token should be encrypted with ansible-vault"
      when: 
        - circleci.runner.token is defined
        - not circleci.runner.token.startswith('$ANSIBLE_VAULT')
        - circleci.runner.token != "{{ vault_circleci_token }}"
      
    - name: Display cluster information
      debug:
        msg: |
          Setting up Kubernetes cluster with the following configuration:
          - Cluster Name: {{ kubernetes.cluster_name }}
          - Kubernetes Version: {{ kubernetes.version }}
          - Pod Network CIDR: {{ kubernetes.pod_network_cidr }}
          - Service Network CIDR: {{ kubernetes.service_network_cidr }}
          - CNI Plugin: {{ kubernetes.cni_plugin }}
          - CircleCI Resource Class: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}

  tasks:
    - name: Setup common Kubernetes components
      include_role:
        name: kubernetes-common
      tags:
        - common
        - kubernetes

# Master node specific setup
- name: Setup Kubernetes Master Node
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Setup Kubernetes master
      include_role:
        name: kubernetes-master
      tags:
        - master
        - kubernetes

# Worker nodes setup
- name: Setup Kubernetes Worker Nodes
  hosts: k8s_workers
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Setup Kubernetes worker
      include_role:
        name: kubernetes-worker
      tags:
        - worker
        - kubernetes

# CircleCI Runner setup (only on master for now)
- name: Setup CircleCI Container Runner
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Setup CircleCI container runner
      include_role:
        name: circleci-runner
      when: circleci_runner_enabled | default(true)
      tags:
        - circleci
        - runner

# Post-installation tasks
- name: Post-installation verification
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Wait for all nodes to be ready
      k8s_info:
        api_version: v1
        kind: Node
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 600
      register: node_status
      
    - name: Display cluster status
      debug:
        msg: |
          Kubernetes Cluster Setup Complete!
          
          Cluster Information:
          - Total Nodes: {{ node_status.resources | length }}
          - Ready Nodes: {{ node_status.resources | selectattr('status.conditions', 'defined') | selectattr('status.conditions', 'selectattr', 'type', 'equalto', 'Ready') | selectattr('status.conditions', 'selectattr', 'status', 'equalto', 'True') | list | length }}
          
          Access your cluster:
          - kubectl get nodes
          - kubectl get pods -A
          - kubectl get pods -n circleci (for CircleCI runners)
          
          Next steps:
          1. Configure your CircleCI project to use resource class: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
          2. Update your .circleci/config.yml to use the self-hosted runners
          3. Monitor runner status: kubectl get pods -n circleci
          
      tags:
        - verification 