---
# Deploy the full in-cluster monitoring stack:
#   Play A — render external_scrape_static_configs on localhost
#   Play B — bring up the AlertManager → Teams adapter
#   Play C — Helm upgrade kube-prometheus-stack
#
# Play B MUST run before Play C: AlertManager flips its webhook to the
# in-cluster Service during the Helm upgrade, and any alert fired before
# the adapter is reachable gets buffered and retried only after
# repeat_interval (1h critical / 3h warning).
#
# Self-contained — invoke standalone for a Helm-only cycle, or via
# deploy-monitoring-full.yml together with deploy-external-monitoring.yml
# for a full rebuild including node_exporter on the external fleet.

- name: Build external scrape static_configs
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: external-monitoring
        tasks_from: scrape-config

- name: Deploy AlertManager → Teams webhook adapter
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false

  tasks:
    - name: Validate target URL is a Power Automate Workflow URL
      ansible.builtin.assert:
        that:
          - vault_teams_webhook_url is defined
          - vault_teams_webhook_url is match('^https://[a-z0-9.-]+\.(logic\.azure\.com|api\.powerplatform\.com).*/workflows/[0-9a-f-]+/triggers/manual/paths/invoke')
        fail_msg: >-
          vault_teams_webhook_url must be a Power Automate TeamsWebhook
          trigger URL — either the legacy logic.azure.com or the new
          api.powerplatform.com endpoint, ending in
          /workflows/<id>/triggers/manual/paths/invoke?...
          The current value does not match that shape — typical causes:
          unedited placeholder, empty string, an in-tenant Teams chat
          URL pasted by mistake, or a non-Workflow webhook. Edit
          inventory/production/group_vars/all/vault.yml with
          `ansible-vault edit` before running this playbook.

    - name: Bring up adapter
      ansible.builtin.import_role:
        name: alertmanager-teams-adapter

- name: Deploy Monitoring Stack
  hosts: kube_control_plane[0]
  become: true
  gather_facts: true

  pre_tasks:
    ## Guard against split invocation: Play A populates the fact
    ## referenced from monitoring_prometheus_values. Skipping it (--tags,
    ## --start-at-task, or splitting the file into two ansible-playbook
    ## runs) would otherwise fail mid-Helm-render with a less obvious
    ## "Undefined variable" message.
    - name: Verify Play A populated external_scrape_static_configs
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['external_scrape_static_configs'] is defined
        fail_msg: >-
          external_scrape_static_configs is not in scope on localhost.
          Play A (Build external scrape static_configs) must run before
          this play — invoke the full deploy-monitoring.yml end-to-end
          or call deploy-monitoring-full.yml for the complete pipeline.
      ## set_fact is skipped under --check, so this assert would always
      ## fail in dry-run mode even though the real run produces the fact.
      when: not ansible_check_mode

    - name: Verify kubespray artifacts exist
      ansible.builtin.stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      delegate_to: localhost
      failed_when: not kubectl_artifact.stat.exists

    - name: Verify Kubernetes cluster is reachable
      ansible.builtin.shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: cluster_nodes_count
      failed_when: cluster_nodes_count.stdout | int == 0
      changed_when: false
      delegate_to: localhost

  tasks:
    - name: Create monitoring namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kube_prometheus_stack_namespace }}"
            labels:
              name: "{{ kube_prometheus_stack_namespace }}"
              app.kubernetes.io/name: monitoring

    - name: Add prometheus-community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        state: present

    - name: Deploy kube-prometheus-stack
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ kube_prometheus_stack_namespace }}"
        create_namespace: true
        values: "{{ kube_prometheus_stack_values }}"
        chart_version: "{{ kube_prometheus_stack_chart_version | default(omit) }}"
        wait: true
        timeout: 900s
        state: present
      register: helm_deployment
      ## values dict carries vault_teams_webhook_url + vault_grafana_admin_password.
      ## no_log keeps those out of stdout / CI captures on failure.
      no_log: true
      tags:
        - monitoring

  post_tasks:
    ## helm `wait: true` only covers chart-direct resources. The
    ## prometheus-operator creates the actual Prometheus/AlertManager
    ## pods asynchronously via CRDs, so we wait on them explicitly.
    - name: Wait for monitoring components to be Ready
      ansible.builtin.command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name={{ item }} -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      loop:
        - prometheus
        - grafana
        - alertmanager
      changed_when: false
      delegate_to: localhost
      tags: [verification]

    - name: Get node IPs for NodePort hints
      ansible.builtin.command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes -o jsonpath='{.items[*].status.addresses[?(@.type==\"InternalIP\")].address}'"
      register: cluster_nodes_ips
      changed_when: false
      delegate_to: localhost

    - name: Import community Grafana dashboards
      ansible.builtin.import_role:
        name: external-monitoring
        tasks_from: grafana-dashboard

    - name: Deployment summary
      ansible.builtin.debug:
        msg: >-
          Monitoring stack ready in ns/{{ kube_prometheus_stack_namespace }}.
          NodePorts (pick any node IP from: {{ cluster_nodes_ips.stdout }}) —
          Grafana:{{ kube_prometheus_stack_values.grafana.service.nodePort }},
          Prometheus:{{ kube_prometheus_stack_values.prometheus.service.nodePort }},
          AlertManager:{{ kube_prometheus_stack_values.alertmanager.service.nodePort }}.
          Grafana admin password: kubectl -n {{ kube_prometheus_stack_namespace }}
          get secret kube-prometheus-stack-grafana
          -o jsonpath='{.data.admin-password}' | base64 -d
