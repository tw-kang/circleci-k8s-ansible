---
# Prometheus and Grafana Monitoring Stack Deployment
# This playbook deploys kube-prometheus-stack to an existing Kubernetes cluster
# Based on: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

- name: Deploy Monitoring Stack
  hosts: kube_control_plane[0]
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Verify kubespray artifacts exist
      stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      delegate_to: localhost
      
    - name: Fail if kubespray artifacts not found
      fail:
        msg: "Kubespray kubectl artifacts not found. Please run cluster deployment first."
      when: not kubectl_artifact.stat.exists
      delegate_to: localhost
    
    - name: Validate monitoring configuration
      assert:
        that:
          - kube_prometheus_stack_enabled is defined
          - kube_prometheus_stack_enabled | bool
          - kube_prometheus_stack_namespace is defined
          - kube_prometheus_stack_values is defined
        fail_msg: "Monitoring configuration variables are required. Please check group_vars/k8s_cluster/addons.yml."
    
    - name: Verify Kubernetes cluster is accessible using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: cluster_nodes_count
      failed_when: cluster_nodes_count.stdout | int == 0
      changed_when: false
      delegate_to: localhost
      
    - name: Display deployment information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Monitoring Stack Deployment               ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster nodes: {{ cluster_nodes_count.stdout.strip() }}
          Namespace: {{ kube_prometheus_stack_namespace }}
          Chart version: {{ kube_prometheus_stack_chart_version }}
          
          Components: Prometheus, Grafana, AlertManager, Node Exporter

  tasks:
    - name: Create monitoring namespace
      k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kube_prometheus_stack_namespace }}"
            labels:
              name: "{{ kube_prometheus_stack_namespace }}"
              app.kubernetes.io/name: monitoring

    - name: Check if kube-prometheus-stack is already deployed
      k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: prometheus-kube-prometheus-stack-prometheus
        namespace: "{{ kube_prometheus_stack_namespace }}"
      register: existing_prometheus
      failed_when: false
      
    - name: Display existing stack status
      debug:
        msg: |
          Existing monitoring stack: {{ 'Found' if existing_prometheus.resources | length > 0 else 'Not found' }}
          {% if existing_prometheus.resources | length > 0 %}
          Proceeding with update or redeployment.
          {% else %}
          Proceeding with new deployment.
          {% endif %}

    - name: Add prometheus-community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        state: present

    - name: Deploy kube-prometheus-stack
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ kube_prometheus_stack_namespace }}"
        create_namespace: true
        values: "{{ kube_prometheus_stack_values }}"
        chart_version: "{{ kube_prometheus_stack_chart_version }}"
        wait: true
        timeout: 900s
        state: present
      register: helm_deployment
      tags:
        - monitoring

  post_tasks:
    - name: Wait for Prometheus StatefulSet to be ready
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name=prometheus -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      register: prometheus_status
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Wait for Grafana Deployment to be ready
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name=grafana -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      register: grafana_status
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Wait for AlertManager to be ready
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name=alertmanager -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      register: alertmanager_status
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Verify all monitoring pods are running
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -n {{ kube_prometheus_stack_namespace }} --no-headers | grep -v Running | wc -l"
      register: non_running_pods
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Get monitoring pods status
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -n {{ kube_prometheus_stack_namespace }} --no-headers | wc -l"
      register: monitoring_pods_count
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Get running pods count
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -n {{ kube_prometheus_stack_namespace }} --no-headers | grep Running | wc -l"
      register: running_pods_count
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Fail if any pods are not running
      fail:
        msg: "{{ non_running_pods.stdout.strip() }} pods are not in Running state. Please check pod status."
      when: non_running_pods.stdout | int > 0
      tags:
        - verification

    - name: Get node IPs for NodePort access
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes -o jsonpath='{.items[*].status.addresses[?(@.type==\"InternalIP\")].address}'"
      register: cluster_nodes_ips
      changed_when: false
      delegate_to: localhost
      tags:
        - verification

    - name: Display deployment completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║              Monitoring Stack Deployment Complete           ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Namespace: {{ kube_prometheus_stack_namespace }}
          Total pods: {{ monitoring_pods_count.stdout.strip() }}
          Running pods: {{ running_pods_count.stdout.strip() }}
          
          Component Status:
          ├─ Prometheus: Ready
          ├─ Grafana: Ready  
          └─ AlertManager: Ready
          
          NodePort Access Methods:
          
          Grafana (NodePort: {{ kube_prometheus_stack_values.grafana.service.nodePort }}):
          {% for node_ip in cluster_nodes_ips.stdout.split() %}
          URL: http://{{ node_ip }}:{{ kube_prometheus_stack_values.grafana.service.nodePort }}
          {% endfor %}
          Username: admin
          Password: {{ kube_prometheus_stack_values.grafana.adminPassword | default('prom-operator') }}
          
          Prometheus (NodePort: {{ kube_prometheus_stack_values.prometheus.service.nodePort }}):
          {% for node_ip in cluster_nodes_ips.stdout.split() %}
          URL: http://{{ node_ip }}:{{ kube_prometheus_stack_values.prometheus.service.nodePort }}
          {% endfor %}
          
          AlertManager (NodePort: {{ kube_prometheus_stack_values.alertmanager.service.nodePort }}):
          {% for node_ip in cluster_nodes_ips.stdout.split() %}
          URL: http://{{ node_ip }}:{{ kube_prometheus_stack_values.alertmanager.service.nodePort }}
          {% endfor %}
          
          Alternative Port-Forward Access (using kubespray artifacts):
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh port-forward -n {{ kube_prometheus_stack_namespace }} service/kube-prometheus-stack-prometheus 9090:9090
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh port-forward -n {{ kube_prometheus_stack_namespace }} service/kube-prometheus-stack-grafana 3000:80
          └─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh port-forward -n {{ kube_prometheus_stack_namespace }} service/kube-prometheus-stack-alertmanager 9093:9093
          
          Verification Commands (using kubespray artifacts):
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -n {{ kube_prometheus_stack_namespace }}
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pvc -n {{ kube_prometheus_stack_namespace }}
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get services -n {{ kube_prometheus_stack_namespace }}
          └─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get services -n {{ kube_prometheus_stack_namespace }} | grep NodePort
      tags:
        - verification 