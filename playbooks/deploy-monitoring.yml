---
# Prometheus and Grafana Monitoring Stack Deployment
# This playbook deploys kube-prometheus-stack to an existing Kubernetes cluster
# Based on: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# DEPENDENCY: monitoring-prometheus.yml references
# hostvars['localhost']['external_scrape_static_configs'], which is built
# by roles/external-scrape-config. Invoke via deploy-monitoring-full.yml;
# standalone invocation fails fast at the assert below.

- name: Deploy Monitoring Stack
  hosts: kube_control_plane[0]
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Assert external scrape config has been published
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['external_scrape_static_configs'] is defined
        fail_msg: >-
          external_scrape_static_configs is not in scope on localhost —
          monitoring-prometheus.yml references it via hostvars['localhost'][...]
          and the Helm values render would fail mid-deploy with an
          Undefined variable error.

          Invoke via the wrapper instead:
            ansible-playbook -i inventory/production/hosts.ini
                             -i inventory/production/external-nodes.ini
                             playbooks/deploy-monitoring-full.yml
      delegate_to: localhost

    - name: Verify kubespray artifacts exist
      stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      delegate_to: localhost
      
    - name: Fail if kubespray artifacts not found
      fail:
        msg: "Kubespray kubectl artifacts not found. Please run cluster deployment first."
      when: not kubectl_artifact.stat.exists
      delegate_to: localhost
    
    - name: Validate monitoring configuration
      assert:
        that:
          - kube_prometheus_stack_enabled is defined
          - kube_prometheus_stack_enabled | bool
          - kube_prometheus_stack_namespace is defined
          - kube_prometheus_stack_values is defined
        fail_msg: "Monitoring configuration variables are required. Please check group_vars/k8s_cluster/addons.yml."
    
    - name: Verify Kubernetes cluster is accessible using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: cluster_nodes_count
      failed_when: cluster_nodes_count.stdout | int == 0
      changed_when: false
      delegate_to: localhost
      
    - name: Display deployment context
      debug:
        msg: >-
          Deploying kube-prometheus-stack to ns={{ kube_prometheus_stack_namespace }}
          (cluster nodes: {{ cluster_nodes_count.stdout.strip() }},
          chart version: {{ kube_prometheus_stack_chart_version | default('latest') }}).

  tasks:
    - name: Create monitoring namespace
      k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kube_prometheus_stack_namespace }}"
            labels:
              name: "{{ kube_prometheus_stack_namespace }}"
              app.kubernetes.io/name: monitoring

    - name: Check if kube-prometheus-stack is already deployed
      k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: prometheus-kube-prometheus-stack-prometheus
        namespace: "{{ kube_prometheus_stack_namespace }}"
      register: existing_prometheus
      failed_when: false
      
    - name: Display existing stack status
      debug:
        msg: |
          Existing monitoring stack: {{ 'Found' if existing_prometheus.resources | length > 0 else 'Not found' }}
          {% if existing_prometheus.resources | length > 0 %}
          Proceeding with update or redeployment.
          {% else %}
          Proceeding with new deployment.
          {% endif %}

    - name: Add prometheus-community Helm repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        state: present

    - name: Deploy kube-prometheus-stack
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ kube_prometheus_stack_namespace }}"
        create_namespace: true
        values: "{{ kube_prometheus_stack_values }}"
        chart_version: "{{ kube_prometheus_stack_chart_version | default(omit) }}"
        wait: true
        timeout: 900s
        state: present
      register: helm_deployment
      ## values dict contains vault_teams_webhook_url (bearer secret with sig= params)
      ## and vault_grafana_admin_password. On task failure Ansible would otherwise
      ## echo the entire values payload to stdout / log paths / CI captures.
      no_log: true
      tags:
        - monitoring

  post_tasks:
    ## kubectl wait blocks until each Ready condition flips or timeout —
    ## a non-zero exit fails the play, so no extra "is it running?" check
    ## is needed afterwards.
    - name: Wait for Prometheus to be Ready
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name=prometheus -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      changed_when: false
      delegate_to: localhost
      tags: [verification]

    - name: Wait for Grafana to be Ready
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name=grafana -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      changed_when: false
      delegate_to: localhost
      tags: [verification]

    - name: Wait for AlertManager to be Ready
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh wait --for=condition=Ready pod -l app.kubernetes.io/name=alertmanager -n {{ kube_prometheus_stack_namespace }} --timeout=300s"
      changed_when: false
      delegate_to: localhost
      tags: [verification]

    - name: Get node IPs for NodePort hints
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes -o jsonpath='{.items[*].status.addresses[?(@.type==\"InternalIP\")].address}'"
      register: cluster_nodes_ips
      changed_when: false
      delegate_to: localhost
      tags: [verification]

    - name: Deployment summary
      debug:
        msg: >-
          Monitoring stack ready in ns/{{ kube_prometheus_stack_namespace }}.
          NodePorts (pick any node IP from: {{ cluster_nodes_ips.stdout }}) —
          Grafana:{{ kube_prometheus_stack_values.grafana.service.nodePort }},
          Prometheus:{{ kube_prometheus_stack_values.prometheus.service.nodePort }},
          AlertManager:{{ kube_prometheus_stack_values.alertmanager.service.nodePort }}.
          Grafana admin password: kubectl -n {{ kube_prometheus_stack_namespace }}
          get secret kube-prometheus-stack-grafana
          -o jsonpath='{.data.admin-password}' | base64 -d
      tags: [verification]