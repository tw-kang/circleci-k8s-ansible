---
# Playbook for adding nodes to existing cluster and deploying CircleCI runner
- name: Add Node to Cluster and Deploy CircleCI Runner
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Validate CircleCI configuration
      assert:
        that:
          - circleci.runner.namespace is defined
          - circleci.runner.resource_class is defined
          - circleci.runner.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/all.yml."
    
    - name: Verify master node is accessible
      k8s_info:
        api_version: v1
        kind: Node
      register: existing_nodes
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      run_once: true
      
    - name: Display node addition information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                  Node Addition + CircleCI Started                   ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Node to add: {{ ansible_hostname }}
          CircleCI: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}

  roles:
    - role: kubernetes-common
      tags:
        - common
        - kubernetes

# Add worker nodes to existing cluster
- name: Add Worker Nodes to Cluster
  hosts: k8s_workers
  become: yes
  gather_facts: yes
  
  roles:
    - role: kubernetes-worker
      tags:
        - worker
        - kubernetes

# Add master nodes to existing cluster (for HA setup)
- name: Add Master Nodes to Cluster
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check if this is a new master node
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeconfig_check
      
    - name: Setup additional master node
      include_role:
        name: kubernetes-master
      when: not kubeconfig_check.stat.exists
      tags:
        - master
        - kubernetes

# Deploy CircleCI Runner (run on first master only)
- name: Deploy CircleCI Container Runner
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  run_once: true
  
  tasks:
    - name: Deploy CircleCI container runner
      include_role:
        name: circleci-runner
      when: circleci.runner_enabled | default(true)
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      tags:
        - circleci
        - runner

# Post-addition verification (run on first master only)
- name: Verify Node Addition and CircleCI Deployment
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  run_once: true
  
  tasks:
    - name: Wait for all nodes to be ready
      k8s_info:
        api_version: v1
        kind: Node
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 180
        wait_sleep: 5
      register: node_status
      tags:
        - verification
      
    - name: Verify CircleCI runner is still operational
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: circleci-runner
        namespace: circleci
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
        wait_sleep: 5
      register: runner_deployment
      tags:
        - verification
      
    - name: Get CircleCI runner pods
      k8s_info:
        api_version: v1
        kind: Pod
        namespace: circleci
        label_selectors:
          - app=circleci-runner
      register: runner_pods
      run_once: true
      tags:
        - verification
      
    - name: Display completion message
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                Node Addition + CircleCI Completed                     ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ kubernetes.cluster_name }}
          Total Node Count: {{ node_status.resources | length if node_status is defined else 'Checking' }}
          CircleCI: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
          
          Verification Commands:
          ├─ kubectl get nodes
          ├─ kubectl get pods -A
          ├─ kubectl get pods -n circleci
          └─ kubectl describe node {{ ansible_hostname }}
          
      tags:
        - verification 