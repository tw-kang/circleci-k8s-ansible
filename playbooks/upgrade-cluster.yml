---
# Upgrade Kubernetes cluster using Kubespray
- name: Display cluster upgrade information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify kubespray artifacts exist
      stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      
    - name: Display upgrade information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                Starting Kubernetes Cluster Upgrade          ║
          ╚══════════════════════════════════════════════════════════════╝
                    
          Warning: This will upgrade your cluster components.
          Please ensure you have proper backups before proceeding.
          
          Note: Kubespray handles the complete upgrade process.
          
          Kubectl artifacts: {{ 'Available' if kubectl_artifact.stat.exists else 'Not found - run cluster deployment first' }}

# Import Kubespray upgrade playbook (includes comprehensive upgrade logic)
- name: Upgrade Kubernetes cluster
  import_playbook: ../3rdparty/kubespray/upgrade-cluster.yml

# Post-upgrade verification
- name: Verify Cluster Upgrade
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Get total node count using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: total_nodes
      changed_when: false
      tags:
        - verification
      
    - name: Get ready node count using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | grep -c Ready"
      register: ready_nodes
      changed_when: false
      tags:
        - verification
      
    - name: Get system pods count using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -n kube-system -l k8s-app --no-headers | wc -l"
      register: system_pods_count
      changed_when: false
      tags:
        - verification
      
    - name: Display upgrade completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Cluster Upgrade Completed                 ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ hostvars[groups['k8s_cluster'][0]]['cluster_name'] }}
          Total nodes: {{ total_nodes.stdout.strip() }}
          Ready nodes: {{ ready_nodes.stdout.strip() }}
          System pods: {{ system_pods_count.stdout.strip() }}
          
          Verification commands (using kubespray artifacts):
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes -o wide
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh version
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -A
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get componentstatuses
          └─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh cluster-info
          
          Post-upgrade checklist:
          ├─ Verify application pods are running
          ├─ Test application connectivity
          ├─ Check persistent volumes
          ├─ Validate cluster networking
          └─ Update client kubectl version
          
      tags:
        - verification 