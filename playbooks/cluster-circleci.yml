---
# Playbook for complete Kubernetes cluster and CircleCI runner setup
- name: Setup Kubernetes Cluster with CircleCI Runner
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Validate CircleCI configuration
      assert:
        that:
          - circleci.runner.namespace is defined
          - circleci.runner.resource_class is defined
          - circleci.runner.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/all.yml."
    
    - name: Check if Ansible Vault variables are encrypted
      fail:
        msg: "CircleCI token must be encrypted with ansible-vault."
      when: 
        - circleci.runner.token is defined
        - not circleci.runner.token.startswith('$ANSIBLE_VAULT')
        - circleci.runner.token != "{{ vault_circleci_token }}"
      
    - name: Display setup information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                Kubernetes + CircleCI Installation Started               ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Configuration Info:
          ├─ Cluster: {{ kubernetes.cluster_name }}
          ├─ K8s Version: {{ kubernetes.version }}
          ├─ CNI: {{ kubernetes.cni_plugin }}
          └─ CircleCI: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}

  roles:
    - role: kubernetes-common
      tags:
        - common
        - kubernetes

# Master node specific setup - must complete before workers
- name: Setup Kubernetes Master Node
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  serial: 1  # Ensure master is set up completely first
  
  roles:
    - role: kubernetes-master
      tags:
        - master
        - kubernetes

# Wait for master to be fully ready before setting up workers
- name: Wait for master node readiness
  hosts: k8s_masters
  become: yes
  gather_facts: no
  
  tasks:
    - name: Wait for master API server to be available
      wait_for:
        port: 6443
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 120
        delay: 5
      tags:
        - master
        - kubernetes

# Worker nodes setup - only after master is ready
- name: Setup Kubernetes Worker Nodes
  hosts: k8s_workers
  become: yes
  gather_facts: yes
  
  roles:
    - role: kubernetes-worker
      tags:
        - worker
        - kubernetes

# CircleCI Runner setup
- name: Setup CircleCI Container Runner
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Deploy CircleCI container runner
      include_role:
        name: circleci-runner
      when: circleci.runner_enabled | default(true)
      tags:
        - circleci
        - runner

# Post-installation verification
- name: Verify Complete Setup
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  
  tasks:
    
    - name: Wait for all nodes to be ready
      k8s_info:
        api_version: v1
        kind: Node
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 180
        wait_sleep: 5
      register: node_status
      tags:
        - verification
      
    - name: Verify CircleCI runner deployment
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: circleci-runner
        namespace: circleci
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
        wait_sleep: 5
      register: runner_deployment
      tags:
        - verification
      
    - name: Get CircleCI runner pods
      k8s_info:
        api_version: v1
        kind: Pod
        namespace: circleci
        label_selectors:
          - app=circleci-runner
      register: runner_pods
      tags:
        - verification
      
    - name: Display setup completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                      Installation Completed                                 ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ kubernetes.cluster_name }}
          Node Count: {{ node_status.resources | length if node_status is defined else 'Checking' }}
          CircleCI: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
          
          Verification Commands:
          ├─ kubectl get nodes
          ├─ kubectl get pods -A
          └─ kubectl get pods -n circleci
          
      tags:
        - verification 