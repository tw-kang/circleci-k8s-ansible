---
# Remove nodes from Kubernetes cluster using Kubespray
- name: Display node removal information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display node removal information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                    Starting Node Removal                    ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_name }}
          
          Warning: This will permanently remove the specified nodes!
          
          Usage: Specify nodes with --extra-vars "node=worker-1,worker-2"
          Note: Kubespray will validate nodes and prompt for confirmation.

# Import Kubespray remove-node playbook (includes node validation and confirmation)
- import_playbook: ../3rdparty/kubespray/remove-node.yml

# Post-removal verification
- name: Verify Node Removal
  hosts: kube_control_plane
  gather_facts: false
  
  tasks:
    - name: Wait for cluster to stabilize
      pause:
        seconds: 30
      tags:
        - verification
      
    - name: Get remaining nodes
      k8s_info:
        api_version: v1
        kind: Node
      register: remaining_nodes
      run_once: true
      tags:
        - verification
      
    - name: Display removal completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Node Removal Completed                    ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_name }}
          Remaining nodes: {{ remaining_nodes.resources | length }}
          
          Verification commands:
          ├─ kubectl get nodes
          ├─ kubectl get pods -A
          └─ kubectl get nodes -o wide
          
          Next steps:
          ├─ Remove nodes from inventory file
          ├─ Verify cluster networking
          └─ Check workload distribution
          
      run_once: true
      tags:
        - verification 