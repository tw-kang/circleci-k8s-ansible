---
# Remove nodes from Kubernetes cluster using Kubespray
- name: Display node removal information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify kubespray artifacts exist
      stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      
    - name: Display node removal information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                    Starting Node Removal                    ║
          ╚══════════════════════════════════════════════════════════════╝
                   
          Warning: This will permanently remove the specified nodes!
          
          Usage: Specify nodes with --extra-vars "node=worker-1,worker-2"
          Note: Kubespray will validate nodes and prompt for confirmation.
          
          Kubectl artifacts: {{ 'Available' if kubectl_artifact.stat.exists else 'Not found - run cluster deployment first' }}

# Import Kubespray remove-node playbook (includes node validation and confirmation)
- import_playbook: ../3rdparty/kubespray/remove-node.yml

# Cleanup data directories on removed nodes
- name: Cleanup data directories on removed nodes
  hosts: "{{ node | default('') }}"
  become: true
  gather_facts: false
  ignore_unreachable: true
  
  tasks:
    - name: Unmount containerd bind mount
      ansible.posix.mount:
        path: "/var/lib/containerd"
        state: unmounted
      tags:
        - cleanup
        - containerd
      ignore_errors: true

    - name: Unmount kubelet bind mount
      ansible.posix.mount:
        path: "/var/lib/kubelet"
        state: unmounted
      tags:
        - cleanup
        - kubelet
      ignore_errors: true

    - name: Remove containerd data source directory from removed nodes
      file:
        path: /home/containerd-data
        state: absent
      tags:
        - cleanup
        - containerd
      ignore_errors: true

    - name: Remove kubelet data source directory from removed nodes
      file:
        path: /home/kubelet-data
        state: absent
      tags:
        - cleanup
        - kubelet
      ignore_errors: true

    - name: Remove tc-repo directory from removed nodes
      file:
        path: /home/tc-repo
        state: absent
      tags:
        - cleanup
        - tc-repo
      ignore_errors: true
      
    - name: Check if directories were removed
      stat:
        path: "{{ item }}"
      register: cleanup_status
      with_items:
        - /home/containerd-data
        - /home/kubelet-data
        - /home/tc-repo
      tags:
        - verification
        - cleanup
      ignore_errors: true

# Post-removal verification
- name: Verify Node Removal
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Wait for cluster to stabilize
      pause:
        seconds: 30
      tags:
        - verification
      
    - name: Get remaining node count using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: remaining_nodes_count
      changed_when: false
      tags:
        - verification
      
    - name: Display removal completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Node Removal Completed                    ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ hostvars[groups['k8s_cluster'][0]]['cluster_name'] }}
          Remaining nodes: {{ remaining_nodes_count.stdout.strip() }}
          
          Verification commands (using kubespray artifacts):
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -A
          └─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes -o wide
          
          Next steps:
          ├─ Remove nodes from inventory file
          ├─ Verify cluster networking
          ├─ Check workload distribution
          └─ Verify all directories were cleaned up on removed nodes:
            ├─ /home/containerd-data
            ├─ /home/kubelet-data
            └─ /home/tc-repo
          
      tags:
        - verification 