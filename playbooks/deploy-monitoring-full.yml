---
# Full pipeline wrapper for external-node monitoring integration.
# Enforces correct execution order:
#   1. Install/update node_exporter on external fleet
#   2. Render scrape target list in-memory (no file artifact)
#   3. Helm upgrade kube-prometheus-stack with extended config
#      (AlertManager Teams webhook URL flows directly Vault → Helm values;
#       no intermediate k8s Secret needed because send-side delivery uses
#       a webhook URL, not a credential file mount)
#
# Usage:
#   ansible-playbook \
#     -i inventory/production/hosts.ini \
#     -i inventory/production/external-nodes.ini \
#     playbooks/deploy-monitoring-full.yml
#
# Canary Phase 1 (single pilot host):
#   ... --limit "<pilot-host>,kube_control_plane,localhost" -e external_serial=1
#
# Running deploy-monitoring.yml standalone (without this wrapper) will fail
# with Undefined variable for external_scrape_static_configs — intentional.

- import_playbook: deploy-external-monitoring.yml

- name: Pre-task A — build external scrape static_configs in-memory
  hosts: localhost
  gather_facts: false
  tasks:
    ## Build the structure with `loop` + minimal Jinja so this play does
    ## not depend on the from_yaml / map / flatten filter chain. (Some
    ## controller environments have a broken filter loader; see the
    ## ansible.cfg `library` lookup gotcha noted in the deploy spec.)
    - name: Initialize per-distribution endpoint lists
      ansible.builtin.set_fact:
        _centos7_endpoints: []
        _rocky8_endpoints: []

    - name: Append CentOS 7 endpoints (host:port)
      ansible.builtin.set_fact:
        _centos7_endpoints: "{{ _centos7_endpoints + [hostvars[item]['ansible_host'] + ':' + (node_exporter_scrape_port | default(9100) | string)] }}"
      loop: "{{ groups['external_centos7'] | default([]) }}"

    - name: Append Rocky 8 endpoints (host:port)
      ansible.builtin.set_fact:
        _rocky8_endpoints: "{{ _rocky8_endpoints + [hostvars[item]['ansible_host'] + ':' + (node_exporter_scrape_port | default(9100) | string)] }}"
      loop: "{{ groups['external_rocky8'] | default([]) }}"

    - name: Build static_configs list (skip empty groups to avoid null Prometheus targets)
      ansible.builtin.set_fact:
        external_scrape_static_configs: >-
          {{
            ([{'targets': _centos7_endpoints,
               'labels': {'distribution': 'centos7', 'node_type': 'external', 'environment': 'production', 'managed_by': 'ansible'}}]
             if (_centos7_endpoints | length > 0) else [])
            +
            ([{'targets': _rocky8_endpoints,
               'labels': {'distribution': 'rocky8', 'node_type': 'external', 'environment': 'production', 'managed_by': 'ansible'}}]
             if (_rocky8_endpoints | length > 0) else [])
          }}

    - name: Show scrape target count
      ansible.builtin.debug:
        msg: >-
          External scrape targets: {{ _centos7_endpoints | length + _rocky8_endpoints | length }}
          ({{ _centos7_endpoints | length }} CentOS7 +
          {{ _rocky8_endpoints | length }} Rocky8)

# Adapter must exist BEFORE the Helm upgrade flips AlertManager's webhook
# URL to the in-cluster Service, otherwise the first batch of alerts gets
# dropped and re-tried only after `repeat_interval` (3h).
- import_playbook: deploy-alertmanager-adapter.yml

- import_playbook: deploy-monitoring.yml

- name: Post-task — clean up orphaned alertmanager-smtp Secret
  hosts: kube_control_plane[0]
  gather_facts: false
  tasks:
    ## Idempotent cleanup of the SMTP password Secret left behind by the
    ## previous email-based AlertManager configuration. With the Teams
    ## webhook migration, AlertManager no longer mounts this Secret, so
    ## leaving it in-cluster is dead-state with stale credentials.
    ## --ignore-not-found semantics: state=absent on a missing object is
    ## a no-op, so this task is safe on fresh clusters and on re-runs.
    - name: Delete alertmanager-smtp Secret if present
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: alertmanager-smtp
        namespace: monitoring
