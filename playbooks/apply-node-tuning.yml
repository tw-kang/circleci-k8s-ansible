---
# Node-level OS tuning that kubespray does not own. Currently journald sizing
# (CUBRIDQA-1515). Touches no Kubernetes object.
#
#   ansible-playbook -i inventory/production/hosts.ini playbooks/apply-node-tuning.yml \
#     --check --diff --limit k8s-worker-01

- name: Apply node-level OS tuning
  hosts: k8s_cluster
  become: true
  gather_facts: true
  # A journald restart briefly interrupts log collection — one node at a time.
  serial: 1
  tasks:
    - name: Apply node-tuning role
      ansible.builtin.import_role:
        name: node-tuning
