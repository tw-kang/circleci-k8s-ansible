---
# Playbook for Kubernetes cluster setup only
- name: Setup Kubernetes Cluster
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  pre_tasks:      
    - name: Display cluster information
      debug:
        msg: |
          Setting up Kubernetes cluster with the following configuration:
          - Cluster Name: {{ kubernetes.cluster_name }}
          - Kubernetes Version: {{ kubernetes.version }}
          - Pod Network CIDR: {{ kubernetes.pod_network_cidr }}
          - Service Network CIDR: {{ kubernetes.service_network_cidr }}
          - CNI Plugin: {{ kubernetes.cni_plugin }}
          - Container Runtime: {{ container_runtime.name }}

  tasks:
    - name: Setup common Kubernetes components
      include_role:
        name: kubernetes-common
      tags:
        - common
        - kubernetes

# Master node specific setup
- name: Setup Kubernetes Master Node
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Setup Kubernetes master
      include_role:
        name: kubernetes-master
      tags:
        - master
        - kubernetes

# Worker nodes setup
- name: Setup Kubernetes Worker Nodes
  hosts: k8s_workers
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Setup Kubernetes worker
      include_role:
        name: kubernetes-worker
      tags:
        - worker
        - kubernetes

# Post-installation verification
- name: Verify Kubernetes cluster
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: Wait for all nodes to be ready
      k8s_info:
        api_version: v1
        kind: Node
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 600
      register: node_status
      
    - name: Get cluster info
      k8s_info:
        api_version: v1
        kind: ComponentStatus
      register: component_status
      failed_when: false  # ComponentStatus is deprecated, allow failure
      
    - name: Display cluster status
      debug:
        msg: |
          Kubernetes Cluster Setup Complete!
          
          Cluster Information:
          - Cluster Name: {{ kubernetes.cluster_name }}
          - Total Nodes: {{ node_status.resources | length }}
          - Ready Nodes: {{ node_status.resources | selectattr('status.conditions', 'defined') | selectattr('status.conditions', 'selectattr', 'type', 'equalto', 'Ready') | selectattr('status.conditions', 'selectattr', 'status', 'equalto', 'True') | list | length }}
          
          Node Details:
          {% for node in node_status.resources %}
          - {{ node.metadata.name }}: {{ node.status.nodeInfo.kubeletVersion }}
          {% endfor %}
          
          Access your cluster:
          - export KUBECONFIG=/etc/kubernetes/admin.conf
          - kubectl get nodes
          - kubectl get pods -A
          - kubectl cluster-info
          
          Next steps:
          1. Test cluster functionality: kubectl run test-pod --image=nginx --rm -it
          2. Install additional components as needed
          3. Configure storage classes if required
          4. Set up monitoring and logging (optional)
          
      tags:
        - verification
        
    - name: Save cluster access information
      copy:
        content: |
          # Kubernetes Cluster Access Information
          
          ## Cluster Details
          - Cluster Name: {{ kubernetes.cluster_name }}
          - Master Node: {{ ansible_default_ipv4.address }}:{{ k8s_master.api_server.bind_port }}
          - CNI Plugin: {{ kubernetes.cni_plugin }}
          
          ## Access Commands
          ```bash
          # Copy kubeconfig to your local machine
          scp root@{{ ansible_default_ipv4.address }}:/etc/kubernetes/admin.conf ~/.kube/config
          
          # Or set KUBECONFIG on the master node
          export KUBECONFIG=/etc/kubernetes/admin.conf
          
          # Basic cluster commands
          kubectl get nodes
          kubectl get pods -A
          kubectl cluster-info
          ```
          
          ## Worker Node Join Command
          The join command is saved in: ./kubeadm-join-command
          
          ## Troubleshooting
          ```bash
          # Check cluster status
          kubectl get componentstatuses
          
          # Check node status
          kubectl describe nodes
          
          # Check pod logs
          kubectl logs -n kube-system <pod-name>
          
          # Check kubelet logs
          journalctl -u kubelet
          ```
          
        dest: "/tmp/k8s-cluster-info.md"
        mode: '0644'
      tags:
        - verification 