---
# CircleCI Container Runner Deployment Only
# This playbook deploys CircleCI Container Runner to an existing Kubernetes cluster
- name: Deploy CircleCI Container Runner
  hosts: kube_control_plane[0]
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Validate CircleCI configuration
      assert:
        that:
          - runner.namespace is defined
          - runner.resource_class is defined
          - runner.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/circleci/runner.yml."
    
    - name: Check if Ansible Vault variables are encrypted
      fail:
        msg: "CircleCI token must be encrypted with ansible-vault."
      when: 
        - runner.token is defined
        - not runner.token.startswith('$ANSIBLE_VAULT')
        - runner.token != "{{ vault_circleci_token }}"
        
    - name: Verify Kubernetes cluster is accessible
      k8s_info:
        api_version: v1
        kind: Node
      register: cluster_nodes
      failed_when: cluster_nodes.resources | length == 0
      
    - name: Display deployment information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                  CircleCI Runner Deployment                 ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster nodes: {{ cluster_nodes.resources | length }}
          Resource class: {{ runner.namespace }}/{{ runner.resource_class }}
          Replicas: {{ runner.replicas }}

  tasks:
    - name: Check if CircleCI runner is already deployed
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: container-agent
        namespace: "{{ runner.namespace }}"
      register: existing_runner
      failed_when: false
      
    - name: Display existing runner status
      debug:
        msg: |
          Existing CircleCI Runner status:
          {% if existing_runner.resources | length > 0 %}
          - Status: Already deployed
          - Current replicas: {{ existing_runner.resources[0].spec.replicas }}
          - Available replicas: {{ existing_runner.resources[0].status.availableReplicas | default(0) }}
          - Proceeding with update or redeployment.
          {% else %}
          - Status: Not deployed
          - Proceeding with new deployment.
          {% endif %}
    
    - name: Deploy CircleCI container runner
      include_role:
        name: circleci
      tags:
        - circleci
        - runner

  post_tasks:
    - name: Verify CircleCI runner deployment
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: container-agent
        namespace: "{{ runner.namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
        wait_sleep: 5
      register: runner_deployment
      tags:
        - verification
      
    - name: Get CircleCI runner pods
      k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ runner.namespace }}"
        label_selectors:
          - app.kubernetes.io/name=container-agent
      register: runner_pods
      tags:
        - verification
      
    - name: Get CircleCI runner service
      k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ runner.namespace }}"
        name: container-agent
      register: runner_service
      failed_when: false
      tags:
        - verification
      
    - name: Display deployment completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                CircleCI Runner Deployment Complete           ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Resource class: {{ runner.namespace }}/{{ runner.resource_class }}
          Running pods: {{ runner_pods.resources | length if runner_pods is defined else 'Checking' }}
          
          Verification commands:
          ├─ kubectl get pods -n {{ runner.namespace }}
          ├─ kubectl logs -n {{ runner.namespace }} -l app.kubernetes.io/name=container-agent
          └─ kubectl describe deployment container-agent -n {{ runner.namespace }}
          
      tags:
        - verification

