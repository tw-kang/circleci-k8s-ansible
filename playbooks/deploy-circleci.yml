---
# CircleCI Container Runner Deployment Only
# This playbook deploys CircleCI Container Runner to an existing Kubernetes cluster
- name: Deploy CircleCI Container Runner
  hosts: circleci
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Verify kubespray artifacts exist
      stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      delegate_to: localhost
      
    - name: Fail if kubespray artifacts not found
      fail:
        msg: "Kubespray kubectl artifacts not found. Please run cluster deployment first."
      when: not kubectl_artifact.stat.exists
      delegate_to: localhost
    
    - name: Validate CircleCI configuration
      assert:
        that:
          - job.namespace is defined
          - job.resource_class is defined
          - job.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/circleci/runner.yml."
    
    - name: Check if CircleCI token is encrypted
      fail:
        msg: "CircleCI token must be encrypted with ansible-vault."
      when: 
        - job.token is defined
        - not job.token.startswith('$ANSIBLE_VAULT')
        - job.token != "{{ vault_circleci_token }}"
        
    - name: Verify Kubernetes cluster accessibility using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: cluster_nodes_count
      failed_when: cluster_nodes_count.stdout | int == 0
      changed_when: false
      delegate_to: localhost
      
    - name: Display deployment information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                  CircleCI Runner Deployment                 ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_nodes_count.stdout.strip() }} nodes
          Resource class: {{ job.namespace }}/{{ job.resource_class }}
          Target replicas: {{ agent.replicas }}
          Max concurrent tasks: {{ agent.maxConcurrentTasks }}

  tasks:
    - name: Deploy CircleCI container runner
      include_role:
        name: circleci

  post_tasks:    
    - name: Verify final deployment status using kubespray artifacts
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get deployment container-agent -n {{ job.namespace }} -o jsonpath='{.status.readyReplicas}/{.spec.replicas}'"
      register: final_deployment_status
      changed_when: false
      delegate_to: localhost
      
    - name: Display deployment completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                CircleCI Runner Deployment Complete           ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Resource class: {{ job.namespace }}/{{ job.resource_class }}
          Ready replicas: {{ final_deployment_status.stdout }}
          Job resources requested: {{ job.spec.resources.requests.cpu }} CPU, {{ job.spec.resources.requests.memory }} RAM
          Job resources limits: {{ job.spec.resources.limits.cpu }} CPU, {{ job.spec.resources.limits.memory }} RAM
          
          Next Steps:
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -n {{ job.namespace }}
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh logs -n {{ job.namespace }} -l app=container-agent
          └─ Verify runner connection in CircleCI web console 