---
# Playbook for deploying CircleCI Container Runner to existing cluster
- name: Deploy CircleCI Container Runner to Existing Cluster
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Validate CircleCI configuration
      assert:
        that:
          - circleci.runner.namespace is defined
          - circleci.runner.resource_class is defined
          - circleci.runner.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/all.yml."
    
    - name: Check if Ansible Vault variables are encrypted
      fail:
        msg: "CircleCI token must be encrypted with ansible-vault."
      when: 
        - circleci.runner.token is defined
        - not circleci.runner.token.startswith('$ANSIBLE_VAULT')
        - circleci.runner.token != "{{ vault_circleci_token }}"
        
    - name: Verify Kubernetes cluster is accessible
      k8s_info:
        api_version: v1
        kind: Node
      register: cluster_nodes
      failed_when: cluster_nodes.resources | length == 0
      
    - name: Display deployment information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                  CircleCI Runner Deployment                 ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster nodes: {{ cluster_nodes.resources | length }}
          Resource class: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
          Replicas: {{ circleci.runner.replicas }}

  tasks:
    - name: Check if CircleCI runner is already deployed
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: circleci-runner
        namespace: circleci
      register: existing_runner
      failed_when: false
      
    - name: Display existing runner status
      debug:
        msg: |
          Existing CircleCI Runner status:
          {% if existing_runner.resources | length > 0 %}
          - Status: Already deployed
          - Current replicas: {{ existing_runner.resources[0].spec.replicas }}
          - Available replicas: {{ existing_runner.resources[0].status.availableReplicas | default(0) }}
          - Proceeding with update or redeployment.
          {% else %}
          - Status: Not deployed
          - Proceeding with new deployment.
          {% endif %}
    
    - name: Deploy CircleCI container runner
      include_role:
        name: circleci-runner
      tags:
        - circleci
        - runner

  post_tasks:
    - name: Verify CircleCI runner deployment
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: circleci-runner
        namespace: circleci
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
        wait_sleep: 5
      register: runner_deployment
      tags:
        - verification
      
    - name: Get CircleCI runner pods
      k8s_info:
        api_version: v1
        kind: Pod
        namespace: circleci
        label_selectors:
          - app=circleci-runner
      register: runner_pods
      tags:
        - verification
      
    - name: Get CircleCI runner service
      k8s_info:
        api_version: v1
        kind: Service
        namespace: circleci
        name: circleci-runner
      register: runner_service
      failed_when: false
      tags:
        - verification
      
    - name: Display deployment completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                CircleCI Runner Deployment Complete           ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Resource class: {{ circleci.runner.namespace }}/{{ circleci.runner.resource_class }}
          Running pods: {{ runner_pods.resources | length if runner_pods is defined else 'Checking' }}
          
          Verification commands:
          ├─ kubectl get pods -n circleci
          ├─ kubectl logs -n circleci -l app=circleci-runner
          └─ kubectl describe deployment circleci-runner -n circleci
          
      tags:
        - verification

