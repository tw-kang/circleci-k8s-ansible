---
# CircleCI Container Runner Deployment Only
# This playbook deploys CircleCI Container Runner to an existing Kubernetes cluster
- name: Deploy CircleCI Container Runner
  hosts: circleci
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Validate CircleCI configuration
      assert:
        that:
          - circleci.namespace is defined
          - circleci.resource_class is defined
          - circleci.token is defined
        fail_msg: "CircleCI configuration variables are required. Please check group_vars/circleci/runner.yml."
    
    - name: Check if CircleCI token is encrypted
      fail:
        msg: "CircleCI token must be encrypted with ansible-vault."
      when: 
        - circleci.token is defined
        - not circleci.token.startswith('$ANSIBLE_VAULT')
        - circleci.token != "{{ vault_circleci_token }}"
        
    - name: Verify Kubernetes cluster accessibility
      k8s_info:
        api_version: v1
        kind: Node
      register: cluster_nodes
      failed_when: cluster_nodes.resources | length == 0
      
    - name: Display deployment information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                  CircleCI Runner Deployment                 ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_nodes.resources | length }} nodes
          Resource class: {{ circleci.namespace }}/{{ circleci.resource_class }}
          Target replicas: {{ concurrency.replicas }}
          Max concurrent tasks: {{ concurrency.maxConcurrentTasks }}

  tasks:
    - name: Deploy CircleCI container runner
      include_role:
        name: circleci

  post_tasks:    
    - name: Verify final deployment status
      k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: container-agent
        namespace: "{{ circleci.namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 30
      register: final_deployment
      
    - name: Display deployment completion
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                CircleCI Runner Deployment Complete           ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Resource class: {{ circleci.namespace }}/{{ circleci.resource_class }}
          Ready replicas: {{ final_deployment.resources[0].status.readyReplicas | default(0) }}/{{ final_deployment.resources[0].spec.replicas }}
          Agent resources: {{ resources.agent.requests.cpu }} CPU, {{ resources.agent.requests.memory }} RAM
          Job resources: {{ resources.job.requests.cpu }} CPU, {{ resources.job.requests.memory }} RAM
          
          Next Steps:
          ├─ kubectl get pods -n {{ circleci.namespace }} (run on master node)
          ├─ kubectl logs -n {{ circleci.namespace }} -l app=container-agent (run on master node)
          └─ Verify runner connection in CircleCI web console 