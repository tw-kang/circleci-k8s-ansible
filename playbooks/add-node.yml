---
# Add nodes to existing Kubernetes cluster using Kubespray
- name: Display node addition information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify kubespray artifacts exist
      stat:
        path: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh"
      register: kubectl_artifact
      
    - name: Display node addition information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                    Starting Node Addition                   ║
          ╚══════════════════════════════════════════════════════════════╝

          Note: Ensure new nodes are added to inventory before running.
          Kubespray handles node validation and preparation.
          
          Kubectl artifacts: {{ 'Available' if kubectl_artifact.stat.exists else 'Not found - run cluster deployment first' }}

- name: Configure data directory bind mounts
  hosts: all
  become: true

  tasks:
    - name: Create containerd data source directory
      file:
        path: "/home/containerd-data"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create kubelet data source directory
      file:
        path: "/home/kubelet-data"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create github repository source directory
      file:
        path: "/home/tc-repo"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure /var/lib/containerd directory exists
      file:
        path: /var/lib/containerd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure /var/lib/kubelet directory exists
      file:
        path: /var/lib/kubelet
        state: directory
        owner: root
        group: root
        mode: '0755'
    


    - name: Configure containerd bind mount and register in fstab
      ansible.posix.mount:
        path: "/var/lib/containerd"
        src: "/home/containerd-data"
        fstype: none
        opts: bind
        state: mounted
        dump: 0
        passno: 0

    - name: Configure kubelet bind mount and register in fstab
      ansible.posix.mount:
        path: "/var/lib/kubelet"
        src: "/home/kubelet-data"
        fstype: none
        opts: bind
        state: mounted
        dump: 0
        passno: 0

# Import Kubespray scale playbook for adding nodes (includes validation and setup)
- import_playbook: ../3rdparty/kubespray/scale.yml

# Post-addition verification
- name: Verify Node Addition
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Test kubectl connectivity using kubespray artifacts
      command: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers"
      register: kubectl_test
      changed_when: false
      tags:
        - verification
        
    - name: Get node count using kubespray artifacts
      shell: "{{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes --no-headers | wc -l"
      register: node_count
      changed_when: false
      tags:
        - verification
      
    - name: Display completion message
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Node Addition Completed                   ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ hostvars[groups['k8s_cluster'][0]]['cluster_name'] }}
          Total node count: {{ node_count.stdout.strip() }}
          
          Verification commands (using kubespray artifacts):
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes
          ├─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get pods -A
          └─ {{ ansible_inventory_sources[0] | dirname }}/artifacts/kubectl.sh get nodes -o wide
          
          Next steps:
          ├─ Verify new nodes are labeled correctly
          ├─ Check pod scheduling on new nodes
          └─ Test cluster networking
          
      tags:
        - verification 