---
# Add nodes to existing Kubernetes cluster using Kubespray
- name: Display node addition information
  hosts: kube_control_plane[0]
  gather_facts: false
  tasks:
    - name: Display node addition information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                    Starting Node Addition                   ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_name }}
          Network Plugin: {{ kube_network_plugin }}
          
          Note: Ensure new nodes are added to inventory before running.
          Kubespray handles node validation and preparation.

# Import Kubespray scale playbook for adding nodes (includes validation and setup)
- import_playbook: ../3rdparty/kubespray/scale.yml

# Post-addition verification
- name: Verify Node Addition
  hosts: kube_control_plane
  gather_facts: false
  
  tasks:
    - name: Get node status
      k8s_info:
        api_version: v1
        kind: Node
      register: node_status
      run_once: true
      tags:
        - verification
      
    - name: Display completion message
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Node Addition Completed                   ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ cluster_name }}
          Total node count: {{ node_status.resources | length }}
          
          Verification commands:
          ├─ kubectl get nodes
          ├─ kubectl get pods -A
          └─ kubectl get nodes -o wide
          
          Next steps:
          ├─ Verify new nodes are labeled correctly
          ├─ Check pod scheduling on new nodes
          └─ Test cluster networking
          
      run_once: true
      tags:
        - verification 