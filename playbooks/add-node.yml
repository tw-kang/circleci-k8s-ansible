---
# Playbook for adding nodes to existing Kubernetes cluster
- name: Add Node to Existing Kubernetes Cluster
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Verify master node is accessible
      k8s_info:
        api_version: v1
        kind: Node
      register: existing_nodes
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      run_once: true
      
    - name: Display node addition information
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                    Starting Node Addition                    ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Node to add: {{ ansible_hostname }}
          Cluster: {{ kubernetes.cluster_name }}

  roles:
    - role: kubernetes-common
      tags:
        - common
        - kubernetes

# Add worker nodes to existing cluster
- name: Add Worker Nodes to Cluster
  hosts: k8s_workers
  become: yes
  gather_facts: yes
  
  roles:
    - role: kubernetes-worker
      tags:
        - worker
        - kubernetes

# Add master nodes to existing cluster (for HA setup)
- name: Add Master Nodes to Cluster
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check if this is a new master node
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeconfig_check
      
    - name: Setup additional master node
      include_role:
        name: kubernetes-master
      when: not kubeconfig_check.stat.exists
      tags:
        - master
        - kubernetes

# Post-addition verification
- name: Verify Node Addition
  hosts: k8s_masters
  become: yes
  gather_facts: yes
  
  tasks:
    
    - name: Wait for all nodes to be ready
      k8s_info:
        api_version: v1
        kind: Node
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 180
        wait_sleep: 5
      register: node_status
      tags:
        - verification
      
    - name: Display completion message
      debug:
        msg: |
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                   Node Addition Completed                    ║
          ╚══════════════════════════════════════════════════════════════╝
          
          Cluster: {{ kubernetes.cluster_name }}
          Total node count: {{ node_status.resources | length if node_status is defined else 'Checking' }}
          
          Verification commands:
          ├─ kubectl get nodes
          ├─ kubectl get pods -A
          └─ kubectl describe node {{ ansible_hostname }}
          
      run_once: true
      tags:
        - verification 