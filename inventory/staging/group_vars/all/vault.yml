# This file should be encrypted with ansible-vault
# Use: ansible-vault encrypt inventory/staging/group_vars/all/vault.yml
# Edit: ansible-vault edit inventory/staging/group_vars/all/vault.yml

---
# CircleCI Runner Token (Replace with your actual token)
# Get this token from: https://app.circleci.com/settings/organization/your-org/runner
vault_circleci_token: "<CIRCLECI_RUNNER_TOKEN>"

vault_grafana_admin_password: "<GRAFANA_ADMIN_PASSWORD>"

# Power Automate Workflow trigger URL (required by deploy-monitoring.yml pre_task assert)
# vault_teams_webhook_url: "<POWER_AUTOMATE_WORKFLOW_TRIGGER_URL>"
