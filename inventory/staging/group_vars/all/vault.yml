# This file should be encrypted with ansible-vault
# Use: ansible-vault encrypt inventory/staging/group_vars/vault.yml
# Edit: ansible-vault edit inventory/staging/group_vars/vault.yml

---
# CircleCI Runner Token (Replace with your actual token)
# Get this token from: https://app.circleci.com/settings/organization/your-org/runner
vault_circleci_token: "<CIRCLECI_RUNNER_TOKEN>"

vault_grafana_admin_password: "<GRAFANA_ADMIN_PASSWORD>"
# Additional sensitive variables can be added here
# vault_database_password: "your-database-password"
# vault_api_key: "your-api-key" 
