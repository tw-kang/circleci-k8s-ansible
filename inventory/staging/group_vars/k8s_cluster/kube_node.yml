# Reservation for worker node kubernetes components
# Medium-spec server (32 vCPU, 64GiB RAM) - Reserve ~10% for k8s components
kube_memory_reserved: 6554Mi   # ~6.4GB (10% of 64GB)
kube_cpu_reserved: 3200m       # 3.2 vCPU (10% of 32 vCPU)
kube_ephemeral_storage_reserved: 15Gi  # Sufficient for k8s logs, tmp files
kube_pid_reserved: "1000"      # Higher PID limit for k8s processes

# Reservation for worker node host system  
# Reserve ~5% for system processes (OS, SSH, monitoring, etc.)
system_memory_reserved: 3277Mi  # ~3.2GB (5% of 64GB)
system_cpu_reserved: 1600m     # 1.6 vCPU (5% of 32 vCPU)
system_ephemeral_storage_reserved: 5Gi  # System logs, cache, tmp
system_pid_reserved: "500"     # System process PID reservation

# Summary for 192.168.1.48 (32 vCPU, 64GiB RAM, 4T SSD):
# - System reserved: 1.6 vCPU, 3.2GB, 5GB storage, 500 PIDs (5%)
# - Kubernetes reserved: 3.2 vCPU, 6.4GB, 15GB storage, 1000 PIDs (10%) 
# - Available for workloads: 27.2 vCPU, 54.4GB, remaining storage (85%)
