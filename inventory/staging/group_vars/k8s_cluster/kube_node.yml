# Worker node resource reservations for staging environment
# Individual node configurations are managed in host_vars/
# Each worker node has different specs requiring custom settings

# Note: All resource reservation values are defined per-host in host_vars/
# to accommodate different hardware specifications across worker nodes

# Kubernetes component reservations (typically 10% of node resources)
# kube_memory_reserved: set per host
# kube_cpu_reserved: set per host
# kube_ephemeral_storage_reserved: set per host
# kube_pid_reserved: set per host

# System component reservations (typically 5% of node resources)
# system_memory_reserved: set per host
# system_cpu_reserved: set per host
# system_ephemeral_storage_reserved: set per host
# system_pid_reserved: set per host
