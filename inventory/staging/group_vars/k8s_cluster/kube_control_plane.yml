# Reservation for control plane kubernetes components
# High-spec server (64 vCPU, 128GiB RAM) - Reserve ~10% for k8s components
kube_memory_reserved: 13107Mi  # ~12.8GB (10% of 128GB)
kube_cpu_reserved: 6400m       # 6.4 vCPU (10% of 64 vCPU)
kube_ephemeral_storage_reserved: 25Gi  # Sufficient for k8s logs, tmp files
kube_pid_reserved: "2000"      # Higher PID limit for k8s processes

# Reservation for control plane host system  
# Reserve ~5% for system processes (OS, SSH, monitoring, etc.)
system_memory_reserved: 6554Mi  # ~6.4GB (5% of 128GB)
system_cpu_reserved: 3200m     # 3.2 vCPU (5% of 64 vCPU)
system_ephemeral_storage_reserved: 10Gi  # System logs, cache, tmp
system_pid_reserved: "1000"    # System process PID reservation

# Summary for 192.168.2.8 (64 vCPU, 128GiB RAM, 3.6T SSD):
# - System reserved: 3.2 vCPU, 6.4GB, 10GB storage, 1000 PIDs (5%)
# - Kubernetes reserved: 6.4 vCPU, 12.8GB, 25GB storage, 2000 PIDs (10%) 
# - Available for workloads: 54.4 vCPU, 108.8GB, remaining storage (85%)
