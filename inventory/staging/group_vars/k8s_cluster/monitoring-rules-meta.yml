---
# Self-monitoring PrometheusRules — alarms about the alarming
# pipeline itself. Consumed by monitoring.yml as
# kube_prometheus_stack_values.additionalPrometheusRulesMap.alertmanager-self-monitoring.
#
# Why a separate file: meta-alerts have a different operational
# audience (the on-call who would otherwise miss every alert if the
# pipeline is down). Keeping them visually separate from data-plane
# rules makes it obvious which rules monitor *the monitoring*.
monitoring_rules_meta:
  groups:
    - name: alertmanager-self.rules
      rules:
        ## With route.repeat_interval=3h, a failing webhook means up to
        ## 3h of alert blindness — this meta-alert is the canary that
        ## surfaces such failures. Detection: increase() on the
        ## failed-notifications counter; for=5m guards against transient
        ## single-batch retry blips.
        - alert: AlertmanagerWebhookFailing
          expr: >-
            increase(
              alertmanager_notifications_failed_total{integration="webhook"}[5m]
            ) > 0
          for: 5m
          labels:
            severity: critical
            scope: meta
          annotations:
            summary: "AlertManager webhook delivery failing"
            description: >-
              AlertManager has failed to deliver
              {{ '{{ $value | printf "%.0f" }}' }} webhook notification(s)
              to the Teams receiver in the last 5 minutes.
              Check Power Automate flow status and egress to *.logic.azure.com.
              Sustained failure means alerts are silent until repeat_interval (3h).
