---
# AlertManager sub-chart values, consumed by monitoring.yml as
# kube_prometheus_stack_values.alertmanager.
#
# Two distinct concerns colocated here because the Helm chart wires
# them under the same `alertmanager` key:
#   - alertmanagerSpec : pod scheduling, storage, resources
#   - config           : route + receivers + inhibit_rules (alerting policy)
#
# All actionable alerts flow through the in-cluster
# alertmanager-teams-adapter Service (NOT the bearer-secret Power
# Automate Workflow URL directly) — the adapter translates the native
# AlertManager payload into the Adaptive Card "attachments" envelope
# expected by the TeamsWebhook trigger. This keeps the sig= token off
# the alertmanager-...generated Secret.
monitoring_alertmanager_values:
  service:
    type: NodePort
    nodePort: 32002

  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    ## Storage + resources centralised in monitoring-resources.yml
    ## (observed 2026-04: 87Mi RAM, 1m CPU on master-01).
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "{{ monitoring_storage.alertmanager }}"
    resources: "{{ monitoring_resources.alertmanager }}"

  ## AlertManager configuration: severity-aware Teams routing.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: teams-default
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 5m
      ## Top-level repeat_interval matches the critical-severity sub-route
      ## (1h) — anything that does not match an explicit sub-route is
      ## treated as critical-equivalent to avoid silent drops.
      repeat_interval: 1h
      ## Severity-aware routing — only operator-actionable alerts reach
      ## the Teams channel. First matching sub-route wins.
      ##
      ## Reminder cadence after firing:
      ##   - critical : 1h  (immediate operator attention required)
      ##   - warning  : 3h  (degraded but not down)
      ##   - info / none / Watchdog / InfoInhibitor : never (suppressed)
      ##
      ## Watchdog is AlertManager's deadman heartbeat (always firing by
      ## design) — surfacing it on Teams provides no signal; pair it with
      ## an external deadman service (Dead Man's Snitch / healthchecks.io)
      ## if you need pipeline-liveness monitoring. InfoInhibitor is the
      ## chart-shipped meta-alert whose only purpose is to drive the
      ## inhibit_rules below; it should never reach a human.
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
        - matchers:
            - severity = "info"
          receiver: "null"
        - matchers:
            - severity = "none"
          receiver: "null"
        - matchers:
            - severity = "warning"
          receiver: teams-default
          repeat_interval: 3h
        - matchers:
            - severity = "critical"
          receiver: teams-default
          repeat_interval: 1h
    receivers:
      ## Sink receiver for inhibitor / suppression alerts. Required even
      ## as a placeholder because operator config validation fails with
      ## `undefined receiver "null"` if any route references it.
      - name: "null"
      - name: teams-default
        webhook_configs:
          ## In-cluster adapter Service (alertmanager-teams-adapter).
          ## See roles/alertmanager-teams-adapter for the translation
          ## logic; the adapter holds the bearer-secret Workflow URL
          ## in its own Secret (not in the chart values).
          - url: "http://alertmanager-teams-adapter.monitoring.svc.cluster.local:8080/"
            send_resolved: true
    ## Mirror the chart-default InfoInhibitor → severity=info inhibit pair
    ## so info-level chatter is double-suppressed (route diverts the
    ## InfoInhibitor alert itself, AND its presence inhibits other info
    ## alerts in the same namespace from firing as Teams cards in the
    ## first place).
    inhibit_rules:
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal:
          - namespace
