# Variables specific to Kubernetes worker nodes
---
# Worker node configuration
k8s_worker:
  # Node labels
  labels:
    node-type: "worker"
    workload: "general"
  
  # Node taints (if any)
  taints: []

# Additional packages specific to worker nodes only  
# Base packages are inherited from group_vars/all.yml automatically
packages_additional:
  # Worker-specific monitoring and testing tools
  worker_tools:
    - stress-ng        # CPU/memory load testing
    - iotop           # I/O monitoring
    - htop            # Process monitoring (additional)
    - sysstat         # System performance statistics
    - perf            # Performance profiling
  
  # Kubernetes networking tools
  kubernetes_tools:
  - kubernetes-cni

# Resource limits for worker nodes
resources:
  # Reserve resources for system processes
  # Staging Worker: 6 vCPU, 4GiB RAM
  system_reserved:
    cpu: "600m"          # 0.6 cores for system processes
    memory: "409Mi"      # ~0.4GiB for system processes
    ephemeral_storage: "1Gi"
  
  # Reserve resources for Kubernetes components
  kube_reserved:
    cpu: "1200m"         # 1.2 cores for K8s worker components
    memory: "819Mi"      # ~0.8GiB for K8s worker components
    ephemeral_storage: "1Gi"

# Storage configuration
storage:
  # Local storage provisioner
  local_storage_enabled: false
  local_storage_path: "/opt/local-storage" 