# Staging external-host inventory stub.
#
# Same tier structure as production (external_host + external_vm), both
# groups intentionally empty until staging onboards external hosts.
# Keeping the file present (rather than missing) lets scrape-config.yml's
# `groups['external_nodes'] | default([])` lookup evaluate cleanly and
# Prometheus boots with an empty static_configs list.
#
# To onboard a staging external host:
#   1. Add it under the matching tier group below using production's
#      attribute set:
#        <hostname> ansible_host=<IP> distribution=<centos7|rocky8> \
#            ansible_python_interpreter=/usr/bin/python(3) \
#            test_purpose=<short-tag> owner_email=<UPN>
#   2. Add the controller's id_ed25519.pub to root@authorized_keys on
#      the target host (publickey-only authentication).
#   3. Re-run deploy-monitoring-full.yml against the staging inventory.

[external_host]

[external_vm]

[external_nodes:children]
external_host
external_vm

# publickey-only authentication for both tiers.
[external_nodes:vars]
ansible_user=root
