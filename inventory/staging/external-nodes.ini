# Staging external-host inventory stub.
#
# Staging currently has no external hosts under monitoring — the
# external_nodes group is intentionally empty. Keeping the file present
# (rather than missing) lets scrape-config.yml's
# `groups['external_nodes'] | default([])` lookup evaluate cleanly
# and produces an empty additionalScrapeConfigs[0].static_configs.
# Prometheus boots, the scrape job stays idle until a host is added.
#
# To onboard a staging external host, add it under the matching
# distribution group below following the production pattern:
#   <hostname> ansible_host=<IP> ansible_user=root \
#       owner_email=<UPN>@cubrid.com test_purpose=<tag>
# Then re-run deploy-monitoring-full.yml against the staging inventory.

[external_centos7]

[external_rocky8]

[external_nodes:children]
external_centos7
external_rocky8

# Match production's interpreter pinning so hosts added later work on
# both ansible-core 2.16 and 2.19+ controllers without surprises.
[external_centos7:vars]
ansible_python_interpreter=/usr/bin/python

[external_rocky8:vars]
ansible_python_interpreter=/usr/bin/python3
