# Production inventory for kubernetes cluster deployment
# This inventory describes a single control plane node configuration
# See https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# for tips on building your inventory

# Configure 'ip' variable to bind kubernetes services on a different ip than the default iface
# We should set etcd_member_name for etcd cluster. The node that are not etcd members do not need to set the value,
# or can set the empty string value.
[kube_control_plane]
k8s-master-01 ansible_host=192.168.1.48 ansible_user=root

[etcd:children]
kube_control_plane

[kube_node]
k8s-worker-01 ansible_host=192.168.2.15 ansible_user=root
k8s-worker-02 ansible_host=192.168.2.16 ansible_user=root

[k8s_cluster:children]
kube_control_plane
kube_node

# ARC group - control plane nodes that deploy and manage the GitHub Actions
# runner scale sets: helm and kubectl run from the master, the runner and job
# pods land on workers.
# ⚠ The master is in this group, [k8s_cluster] and [kube_control_plane], so
# group_vars/arc/ loads beside kubespray's group_vars. Every ARC variable is
# prefixed `arc_` for that reason - see inventory/production/group_vars/arc/runner.yml.
[arc:children]
kube_control_plane
