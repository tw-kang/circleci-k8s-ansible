# Worker node reservations (production).
# production and staging point at the SAME physical nodes — keep these values
# in sync with inventory/staging/group_vars/kube_node/kube_node.yml.

node_labels:
  node-role.kubernetes.io/worker: ""

# Worker node (192 vCPU, 503GiB RAM, 7.68T SSD)

# Pinned so it does not drift with the kubespray default.
# 200 since CUBRIDQA-1501 issue 68: worker-02 reached 150/150 on 2026-09-18 and
# a plan pod stayed Pending, which failed a required check. kube_network_node_prefix
# /24 allows 254, and the 1-vCPU job request below allows 170 jobs per worker,
# so 200 pods (= 100 jobs) is the binding ceiling on purpose.
kubelet_max_pods: 200

# Cap the pids cgroup per pod. -1 (the kubespray default) lets one runaway pod
# take the node's task table, which is the CUBRIDQA-1515 failure shape.
# 16384 is six times the measured peak: 2,593 threads in a gha-ci job container
# over the seven days to 2026-09-18 (cAdvisor container_threads, build and
# sql/medium both on GHA by then).
kubelet_pod_pids_limit: 16384

# CUBRIDQA-1515: kube.slice tasks = 268 + 11.5 x pods (measured).
# 200 pods needs 2568; the kubespray default of 1000 killed the node at ~64.
kube_pid_reserved: "4096"
kube_memory_reserved: 16384Mi
kube_cpu_reserved: 2000m
kube_ephemeral_storage_reserved: 100Gi

# Stays at 8192Mi: roles/node-tuning caps the journal, which is what kept
# system.slice at its limit. Revisit once memory.failcnt stops climbing.
system_memory_reserved: 8192Mi
system_cpu_reserved: 2000m
system_ephemeral_storage_reserved: 100Gi

# Available for workloads: 188 vCPU, 479GiB RAM, 7.48TiB storage
