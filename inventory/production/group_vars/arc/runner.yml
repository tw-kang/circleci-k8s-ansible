# ARC (GitHub Actions Runner Controller) runner configuration — CUBRIDQA-1537
---
# ⚠ Every name here MUST start with `arc_`. Group `arc` and group `circleci`
#   both resolve to `kube_control_plane` and `circleci` wins an alphabetical
#   merge, so an unprefixed name is silently replaced by the CircleCI value —
#   no error, wrong runner.

arc_chart_version: "0.14.2"

# The role runs helm on the two controller releases from here on
# (CUBRIDQA-1501 issue 68). Until now it rendered controller-values.yaml and
# left the release to a hand-typed upgrade, so the control-plane nodeSelector
# the template grew would never have reached the cluster.
# Safe because the rendered file already matches the running release: on
# 2026-09-18 `helm get values arc-controller -n gha-ci` and `-n default`
# returned exactly `flags.watchSingleNamespace` + `serviceAccount`, so the
# first managed upgrade adds the two placement keys and nothing else.
# ⚠ Read "컨트롤러 lane 분리" in roles/arc/README.md before moving a controller
#   between namespaces. This flag does not change that order.
arc_controller_manage: true

# ⚠ arc_release is the helm release name, the scale set name AND the runner
#   label (`runs-on: cubrid-arc`). Change it and every job queues forever.
arc_namespace: "gha-ci"
arc_release: "cubrid-arc"
arc_github_url: "https://github.com/CUBRID/cubrid"
arc_min_runners: 0
# Lane ceilings — decision 62 (2026-09-12). The ceiling is a setting, not the
# hardware: a worker runs ~36 pods of its own while the CircleCI ccita pods are
# still here, one job costs one runner pod plus one job pod, and kubelet
# maxPods is 150.
#
# ⚠ maxPods is 200 since CUBRIDQA-1501 issue 68 (2026-09-18), so the 114-pod
#   ceiling below is history and 116 no longer overruns it. The lane numbers
#   themselves do not move here: issue 13 re-measures all three in the CircleCI
#   shutdown window and changes them in one helm pass.
#
#   lane                    ~9/30   after 9/30
#   cubrid-arc                100      100
#   cubrid-arc-build            -        8
#   cubrid-arc-light            4        6
#   fork cubrid-arc            10       10
#   fork cubrid-arc-light       2        2
#   runners in total          116      126
#
# 100 = two concurrent runs x 50. The two spare that made this 102 were plan's
# and collect's, and the light lane takes those. Do not go below 96 — a second
# run's shards then wait a full 28-minute cycle.
#
# 116 is two over the ~9/30 pod ceiling of 114. Only the moment the fork lane
# also fills does a worker hold two Pending job pods, which costs wall clock
# and not data (CUBRIDQA-1521 ran to completion with 52 Pending).
#
# The after-9/30 column is provisional. CUBRIDQA-1501 issue 13 re-measures it
# in the CircleCI shutdown window and changes all three lanes in one helm pass.
arc_max_runners: 100
# 20 since CUBRIDQA-1501 issue 68 (2026-09-18), up from 4, which was measured
# to be saturated: over the seven days to 2026-09-18 the lane ran 4 jobs at
# once at both its peak and its p99, which is the cap itself. The average the
# old note sized this on (~0.8 runners) was never the binding number.
#
# What binds is the burst. The nightly batch fires one run per merged commit
# at 15:20Z, and every one of them starts with a plan, so ten commits means
# ten plans at the same instant. 20 covers that with room.
#
# Raising it does not cost the main lane, because the two peaks do not
# overlap: a run's shards cannot start until its plan has finished. Measured
# 2026-09-18 15:4xZ, mid-batch — 98 shards running in the main lane, 0 jobs in
# the light lane.
#
# ⚠ Needs kubelet_max_pods 200, which is the same change set. At 100 + 20 + 12
#   the four lanes fill a worker to exactly 150 pods, the cap that failed on
#   2026-09-18. Apply the kubelet step before deploy-arc.yml, not after.
#
# The main lane and the build lane are NOT re-sized here — issue 13 re-measures
# those in the CircleCI shutdown window, when the ccita pods stop holding up to
# 200GiB of memory requests on a worker.
arc_light_max_runners: 20
arc_storage_root: "/home/gha-ci"
# /home/ci on the worker's own disk (CUBRIDQA-1501 issue 72). `shared` is the
# second client of the gha-ci volume (roles/glusterfs glusterfs_extra_mounts),
# `seed` the node copy the DaemonSet refreshes, `cache` the node ccache.
# ⚠ Paired with gha-ci.yml: CI_ROOT, the overlay lowerdirs, BUILD_MIRROR and
#   CCACHE_DIR read these paths. Move them together or not at all.
arc_shared_root: "/home/ci/shared"
arc_seed_root: "/home/ci/seed"
arc_cache_root: "/home/ci/cache"
arc_config_path: "/opt/arc/config"

# The limits are the production CircleCI job pod's. The CPU request is not.
# ⚠ limits are mandatory. Without them the pod is Burstable and one runaway
#   shard can eat a whole worker, which is wall clock for every shard on it.
#
# The CPU request is 1 since CUBRIDQA-1501 issue 68, down from CircleCI's 2.
# Requests are what the scheduler counts, and at 2 a worker's 188 allocatable
# vCPU ran out at 89 jobs — below the 100 the 200-pod kubelet ceiling allows.
# At 1 it runs out at 170, so the pod count binds again. Measured worker CPU
# peaks at 48%, so the second vCPU was never backed by demand (decision 62).
arc_job_resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    cpu: "8"
    memory: "64Gi"

# ⚠ Ceilings, not reservations. tmpfs has no swap and is charged to the
#   container memory cgroup, so overflow is a node OOM, not an eviction.
#   Measured peaks: VALIDATION-1526-fork.md.
arc_tmpfs_testcases: "32Gi"
arc_tmpfs_build: "16Gi"

# overlay lowerdir. Read-only, already on the node (2.6GB).
arc_tc_seed: "/home/tc-repo/cubrid-testcases-private-ex"

# ⚠ Keep in step with the `on:` triggers in gha-ci.yml — the runner rejects
#   every event outside this list. repository_dispatch is deliberately absent.
arc_hook_mode: "enforce"
arc_allowed_events:
  - "pull_request"
  - "issue_comment"
  - "push"
  - "workflow_dispatch"

# fork lane, behind `--tags arc_fork` (decision 21: no third inventory).
# ⚠ The release name is NOT repeated — the fork lane reuses `arc_release`, and
#   the namespace is what separates the two.
arc_fork_namespace: "default"
arc_fork_github_url: "https://github.com/tw-kang/cubrid"
arc_fork_max_runners: 10
# Only ever runs the light-lane workflow under test, one job at a time.
arc_fork_light_max_runners: 2
# Decision 3 (option B): mounted AT the production roots, so the workflow
# needs no fork branch. `_fork` goes with CUBRIDQA-1529.
arc_fork_storage_root: "/home/gha-ci/_fork"
arc_fork_shared_root: "{{ arc_shared_root }}/_fork"
arc_fork_config_path: "{{ arc_config_path }}/fork"

# ⚠ Paired with gha-ci.yml's ARTIFACT_URL_BASE. Changing one alone kills every
#   link in the run summaries.
arc_artifact_server_node_port: 30080

# The node seed DaemonSet. The repository list and the period are role
# defaults.
# ⚠ Needs the three vault_tc_gh_app_* keys in vault.yml before it can run.
arc_repo_seed_enabled: true
