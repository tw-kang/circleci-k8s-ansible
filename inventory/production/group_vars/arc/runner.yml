# ARC (GitHub Actions Runner Controller) runner configuration — CUBRIDQA-1537
---
# ⚠ Every name here MUST start with `arc_`. Group `arc` and group `circleci`
#   both resolve to `kube_control_plane` and `circleci` wins an alphabetical
#   merge, so an unprefixed name is silently replaced by the CircleCI value —
#   no error, wrong runner.

arc_chart_version: "0.14.2"

# ⚠ arc_release is the helm release name, the scale set name AND the runner
#   label (`runs-on: cubrid-arc`). Change it and every job queues forever.
arc_namespace: "gha-ci"
arc_release: "cubrid-arc"
arc_github_url: "https://github.com/CUBRID/cubrid"
arc_min_runners: 0
# Two concurrent runs (100 jobs) + 2 spare. CUBRIDQA-1521 measured the ceiling
# at 116 while production CircleCI runs.
arc_max_runners: 102
arc_storage_root: "/home/gha-ci"
arc_config_path: "/opt/arc/config"

# Same values as the production CircleCI job pod.
# ⚠ limits are mandatory. Without them the pod is Burstable and one runaway
#   shard can eat a whole worker, which is wall clock for every shard on it.
arc_job_resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "8"
    memory: "64Gi"

# ⚠ Ceilings, not reservations. tmpfs has no swap and is charged to the
#   container memory cgroup, so overflow is a node OOM, not an eviction.
#   Measured peaks: VALIDATION-1526-fork.md.
arc_tmpfs_testcases: "32Gi"
arc_tmpfs_build: "16Gi"

# overlay lowerdir. Read-only, already on the node (2.6GB).
arc_tc_seed: "/home/tc-repo/cubrid-testcases-private-ex"

# ⚠ Keep in step with the `on:` triggers in gha-ci.yml — the runner rejects
#   every event outside this list. repository_dispatch is deliberately absent.
arc_hook_mode: "enforce"
arc_allowed_events:
  - "pull_request"
  - "issue_comment"
  - "push"
  - "workflow_dispatch"

# fork lane, behind `--tags arc_fork` (decision 21: no third inventory).
# ⚠ The release name is NOT repeated — the fork lane reuses `arc_release`, and
#   the namespace is what separates the two.
arc_fork_namespace: "default"
arc_fork_github_url: "https://github.com/tw-kang/cubrid"
arc_fork_max_runners: 10
# Decision 3 (option B): mounted AT the production roots, so the workflow
# needs no fork branch. `_fork` goes with CUBRIDQA-1529.
arc_fork_storage_root: "/home/gha-ci/_fork"
arc_fork_config_path: "{{ arc_config_path }}/fork"

# ⚠ Paired with gha-ci.yml's ARTIFACT_URL_BASE. Changing one alone kills every
#   link in the run summaries.
arc_artifact_server_node_port: 30080
