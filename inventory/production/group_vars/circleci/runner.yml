# CircleCI Runner Configuration
---
# Directory paths
circleci_config_path: "/opt/circleci/config"

# Core CircleCI configuration
namespace: "cubrid"
resource_class: "xlarge"
replicas: 1
maxConcurrentTasks: 50
token: "{{ vault_circleci_token }}"
image: "cubridci/cubridci:test_shell"
resources:
  requests:
    cpu: "6"
    memory: "16Gi"
  limits:
    cpu: "6"
    memory: "16Gi"
