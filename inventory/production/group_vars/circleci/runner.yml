# CircleCI Runner Configuration
---
# Core CircleCI configuration
circleci:
  namespace: "cubrid"
  resource_class: "large"
  token: "{{ vault_circleci_token }}"
  replicas: 1
  maxConcurrentTasks: 50

# Resource configuration for job containers
resources:
  job:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "32"
      memory: "32Gi"

# Directory paths
paths:
  circleci_config: "/opt/circleci/config"
