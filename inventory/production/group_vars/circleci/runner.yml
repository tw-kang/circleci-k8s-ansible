# CircleCI Runner Configuration
---
# Directory paths
circleci_config_path: "/opt/circleci/config"

# Core CircleCI configuration
circleci_namespace: "cubrid"
resource_class: "ramdisk"
replicas: 1
maxConcurrentTasks: 50
token: "{{ vault_circleci_token }}"
# Runner token for the cubrid/staging resource class (postStart v2 canary lane).
# Must exist in inventory/production/group_vars/all/vault.yml before deploying;
# deliberately NOT defined in the staging inventory so a deploy from the stale
# staging inventory fails fast instead of overwriting this release.
staging_token: "{{ vault_circleci_staging_token }}"
# Dedicated namespace for the staging canary release — the chart creates
# fixed-name resources (e.g. ServiceAccount logging-collector) that cannot
# coexist with the main release in one namespace (ADR-0007).
staging_namespace: "cubrid-staging"
image: "cubridci/cubridci:test_shell"
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    # 32, not 8, so the node build in download-build can use the idle capacity
    # (CUBRIDQA-1506, temporary). Class-wide, so test_shell pods get it too:
    # harmless, because scheduling goes by requests and CPU is compressible.
    # ninja reads this quota through cgroup v1 and sizes itself from it.
    cpu: "32"
    memory: "64Gi"
