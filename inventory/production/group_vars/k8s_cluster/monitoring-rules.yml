---
# PrometheusRule CRDs consumed by monitoring.yml as
# kube_prometheus_stack_values.additionalPrometheusRulesMap.
#
# Two groups:
#   monitoring_rules_external → data-plane alerts on the external fleet
#                               (CentOS 7 + Rocky 8 hosts)
#   monitoring_rules_meta     → self-monitoring alerts on the alerting
#                               pipeline itself
#
# CPU saturation alerts intentionally omitted from the external group —
# these hosts run QA workloads (perf tests, load generation) that
# legitimately push CPU >90% for extended periods. A blanket high-CPU
# alert generates routine false positives during normal test runs and
# desensitises the channel. Re-introduce on a per-host or per-test_purpose
# basis only if a specific workload is known to never legitimately saturate.

# Data-plane alerts (external CentOS 7 + Rocky 8 fleet).
#
# Severity rationale:
#   ExternalNodeHighMemory  warning — 10m memory >85% gives slack before swap thrash
#   ExternalNodeDiskFull    warning — 10m disk >80% on data partitions;
#                                     /boot is excluded (kernel-update churn is
#                                     normal up to 80%+)
monitoring_rules_external:
  groups:
    - name: external-node.rules
      rules:
        - alert: ExternalNodeHighMemory
          expr: >-
            (1 - (
              node_memory_MemAvailable_bytes{job="external-node-exporter"}
              / node_memory_MemTotal_bytes{job="external-node-exporter"}
            )) * 100 > 85
          for: 10m
          labels:
            severity: warning
            scope: external
          annotations:
            summary: "High memory on {{ '{{ $labels.instance }}' }}"
            description: "Memory > 85% for 10m"

        - alert: ExternalNodeDiskFull
          ## /boot is a small (~1 GiB) partition holding kernel images and
          ## initramfs — it crosses 80% under normal package update churn
          ## (multiple kernel versions retained until `dnf remove-old`).
          ## Operators don't action /boot fullness as a generic disk-full
          ## alert; if /boot ever truly fills it shows up as a kernel
          ## install failure with its own signal. Exclude /boot and any
          ## sub-mounts (/boot/efi on UEFI hosts) to keep this alert
          ## focused on data partitions.
          expr: >-
            (1 - (
              node_filesystem_avail_bytes{job="external-node-exporter",fstype!~"tmpfs|overlay",mountpoint!~"/boot|/boot/.+"}
              / node_filesystem_size_bytes{job="external-node-exporter",fstype!~"tmpfs|overlay",mountpoint!~"/boot|/boot/.+"}
            )) * 100 > 80
          for: 10m
          labels:
            severity: warning
            scope: external
          annotations:
            summary: "Disk > 80% on {{ '{{ $labels.instance }}' }} ({{ '{{ $labels.mountpoint }}' }})"
            description: "Disk > 80% for 10m on {{ '{{ $labels.mountpoint }}' }}"

# Self-monitoring alerts — alarms about the alarming pipeline itself.
# Different operational audience (the on-call who would otherwise miss
# every alert if the pipeline is down).
monitoring_rules_meta:
  groups:
    - name: alertmanager-self.rules
      rules:
        ## With route.repeat_interval=3h, a failing webhook means up to
        ## 3h of alert blindness — this meta-alert is the canary that
        ## surfaces such failures. Detection: increase() on the
        ## failed-notifications counter; for=5m guards against transient
        ## single-batch retry blips.
        - alert: AlertmanagerWebhookFailing
          expr: >-
            increase(
              alertmanager_notifications_failed_total{integration="webhook"}[5m]
            ) > 0
          for: 5m
          labels:
            severity: critical
            scope: meta
          annotations:
            summary: "AlertManager webhook delivery failing"
            description: >-
              AlertManager has failed to deliver
              {{ '{{ $value | printf "%.0f" }}' }} webhook notification(s)
              to the Teams receiver in the last 5 minutes.
              Check Power Automate flow status and egress to *.logic.azure.com.
              Sustained failure means alerts are silent until repeat_interval (3h).
