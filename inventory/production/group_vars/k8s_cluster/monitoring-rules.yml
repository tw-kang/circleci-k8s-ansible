---
# PrometheusRule CRDs consumed by monitoring.yml under
# kube_prometheus_stack_values.additionalPrometheusRulesMap.
#   monitoring_rules_external → data-plane alerts on the external fleet
#   monitoring_rules_meta     → self-monitoring on the alerting pipeline
#   monitoring_rules_cluster  → the three k8s nodes, where the chart's own
#                               defaultRules leave a gap
#
# CPU saturation alerts are intentionally omitted from the external
# group — QA hosts legitimately push CPU >90% under perf/load tests,
# so a blanket high-CPU rule generates routine false positives.
# Re-introduce only on a per-host or per-category basis if you
# know the workload never legitimately saturates.

monitoring_rules_external:
  groups:
    - name: external-node.rules
      rules:
        ## Host-level reachability. Fires when Prometheus has been unable
        ## to scrape node_exporter for 3m (= 6 missed 30s scrapes), past
        ## any single-network-blip duration. critical because a host that
        ## has stopped reporting is a real operational event (vs the
        ## disk-fill warning class) and the AM route gives it 1h repeat.
        - alert: ExternalNodeDown
          expr: up{job="external-node-exporter"} == 0
          for: 3m
          labels:
            severity: critical
            scope: external
          annotations:
            summary: "External node {{ '{{ $labels.instance }}' }} is DOWN"
            description: >-
              Prometheus has been unable to scrape node_exporter on
              {{ '{{ $labels.instance }}' }} for 3 minutes (6 missed scrapes).
              Likely host down, network partition, or node_exporter crash.

        ## /boot crosses 80% under normal kernel-package churn (multiple
        ## kernel versions retained until `dnf remove-old`); operators
        ## don't action /boot as a generic disk-full signal. Exclude it
        ## and any sub-mounts (/boot/efi on UEFI hosts).
        - alert: ExternalNodeDiskFull
          expr: >-
            (1 - (
              node_filesystem_avail_bytes{job="external-node-exporter",fstype!~"tmpfs|overlay",mountpoint!~"/boot|/boot/.+"}
              / node_filesystem_size_bytes{job="external-node-exporter",fstype!~"tmpfs|overlay",mountpoint!~"/boot|/boot/.+"}
            )) * 100 > 90
          for: 10m
          labels:
            severity: warning
            scope: external
          annotations:
            summary: "Disk > 90% on {{ '{{ $labels.instance }}' }} ({{ '{{ $labels.mountpoint }}' }})"
            description: "Disk > 90% for 10m on {{ '{{ $labels.mountpoint }}' }}"

monitoring_rules_cluster:
  groups:
    - name: cluster-node.rules
      rules:
        ## CUBRIDQA-1515 recurrence detector. Without /var/log/journal,
        ## journald keeps the journal in /run — tmpfs, so RAM — and grows it
        ## to 10% of that tmpfs, 27GiB on a worker. roles/node-tuning caps it
        ## at 256M; this catches a node that lost the cap.
        ## 4GiB is what the 1515 journal reached; the workers sit under 47MiB.
        ## ⚠ Deliberately not a node shmem threshold — a busy worker's shmem
        ## peaks at 115GiB of pod tmpfs, which buries a 4GiB journal. Pod
        ## tmpfs cannot enter this expression: node_exporter excludes
        ## /var/lib/kubelet, where emptyDir Memory volumes live.
        - alert: ClusterNodeRunTmpfsFilling
          expr: >-
            node_filesystem_size_bytes{job="node-exporter",mountpoint="/run"}
            - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/run"}
            > 4 * 1024 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
            scope: cluster
          annotations:
            summary: "/run tmpfs > 4GiB on {{ '{{ $labels.instance }}' }}"
            description: >-
              {{ '{{ $labels.instance }}' }} has held more than 4GiB in /run
              for 30 minutes. /run is tmpfs, so this is unswappable RAM the
              node cannot reclaim. The known cause is journald falling back to
              a volatile journal — check `journalctl --disk-usage`, that
              /var/log/journal exists, and that
              /etc/systemd/journald.conf.d/10-cubrid-ci.conf is in place.
              Fix by running playbooks/apply-node-tuning.yml on the node.

monitoring_rules_meta:
  groups:
    - name: alertmanager-self.rules
      rules:
        ## Canary for webhook delivery — if this fires silently, alerts
        ## stay invisible until route.repeat_interval (3h). for=5m
        ## guards against single-batch retry blips.
        ##
        ## Caveat: this alert also travels through the adapter Service,
        ## so a *complete* adapter outage delays delivery of the canary
        ## itself until AlertManager retries the buffered batch after
        ## the outage clears. Treat as a post-incident review signal,
        ## not a real-time pager. Pair with an external deadman service
        ## (Snitch / healthchecks.io) if real-time pipeline-liveness
        ## monitoring is required.
        - alert: AlertmanagerWebhookFailing
          expr: >-
            increase(
              alertmanager_notifications_failed_total{integration="webhook"}[5m]
            ) > 0
          for: 5m
          labels:
            severity: critical
            scope: meta
          annotations:
            summary: "AlertManager webhook delivery failing"
            description: >-
              AlertManager has failed to deliver
              {{ '{{ $value | printf "%.0f" }}' }} webhook notification(s)
              to the Teams receiver in the last 5 minutes.
              Check Power Automate flow status and egress to *.logic.azure.com.
              Sustained failure means alerts are silent until repeat_interval (3h).

# CUBRIDQA-1501 issue 17 — the gha-ci runners. Three things a person has had
# to notice by hand: the FUSE client spinning, a worker running out of pod
# slots, and the kernel OOM-killing on a node whose job tmpfs overflowed.
monitoring_rules_gha_ci:
  groups:
    - name: gha-ci.rules
      rules:
        ## The 2026-09-16, 09-18 and 09-21 stalls. A sick glusterfs client
        ## spins on one core and every job on that worker runs several times
        ## slower, while the node's own metrics stay clean — FUSE waits are S
        ## state. Client CPU is the only leading indicator that held up: the
        ## probe-pod `find` timings were reading a dead mount (pitfall 90).
        ##
        ## 0.9 core over 5m for 6m is the runbook's own test — two consecutive
        ## >= 90% samples — moved off a person's `top` and into the rule.
        ## rate() handles the counter reset a remount causes.
        - alert: GhaCiFuseClientSpinning
          expr: rate(gha_ci_fuse_client_cpu_seconds_total[5m]) >= 0.9
          for: 6m
          labels:
            severity: critical
            scope: gha-ci
          annotations:
            summary: "gha-ci FUSE client spinning on {{ '{{ $labels.instance }}' }}"
            description: >-
              The glusterfs client backing {{ '{{ $labels.mountpoint }}' }} on
              {{ '{{ $labels.instance }}' }} has held at least 90% of one core
              for 6 minutes. Every job on that worker is now several times
              slower and will not recover on its own. Remount it — cordon,
              `umount -l {{ '{{ $labels.mountpoint }}' }}`, then
              `systemctl start 'home-gha\x2dci.mount'`, uncordon. `systemctl
              restart` fails while job pods hold the mount. Do not kill or
              pstack the old client (pitfall 91); abort its fuse connection.

        ## A worker that reaches maxPods stops taking runners, and the lane
        ## piles onto the other worker until a required check times out. The
        ## budget is 200 pods a worker as of 2026-09-21 (issue 68), which the
        ## main lane's 150 runners plus light and build almost exactly fill —
        ## so the headroom this watches is small by design.
        ##
        ## ⚠ Both sides collapse their scrape-target labels before they meet.
        ## A kube-state-metrics rollover leaves the retiring pod's series inside
        ## the 5m lookback beside the new pod's, so for those minutes every
        ## node has two capacity series and every pod is counted twice. Without
        ## the two max-by the rule spends each restart at health=err -- seen on
        ## 2026-09-21, minutes after this very change rolled kube-state-metrics.
        - alert: GhaCiNodePodSlotsLow
          expr: >-
            max by (node) (count by (node, instance) (kube_pod_info{node!=""}))
            / on (node) group_left ()
            max by (node) (kube_node_status_capacity{resource="pods"})
            > 0.9
          for: 10m
          labels:
            severity: warning
            scope: gha-ci
          annotations:
            summary: "{{ '{{ $labels.node }}' }} is at {{ '{{ $value | printf \"%.0f%%\" }}' }} of its pod ceiling"
            description: >-
              {{ '{{ $labels.node }}' }} has held more than 90% of its maxPods
              for 10 minutes. New runners will not schedule there and the lane
              will crowd onto the other worker. Check for job pods that
              outlived their run, and read the lane caps in
              inventory/production/group_vars/arc/runner.yml.

        ## A job pod's two tmpfs volumes (/rw 32Gi, /build-rw 16Gi) are
        ## unswappable and have no reclaim path, so an overflow is a node OOM
        ## rather than an eviction. The kernel counter is the only place that
        ## shows up reliably — the pod is gone before kube-state-metrics has
        ## a terminated-reason to report.
        - alert: GhaCiNodeOomKill
          expr: increase(node_vmstat_oom_kill{job="node-exporter"}[10m]) > 0
          for: 0m
          labels:
            severity: warning
            scope: gha-ci
          annotations:
            summary: "Kernel OOM kill on {{ '{{ $labels.instance }}' }}"
            description: >-
              The kernel OOM-killed
              {{ '{{ $value | printf "%.0f" }}' }} process(es) on
              {{ '{{ $labels.instance }}' }} in the last 10 minutes. On a
              worker the usual cause is a job pod's /rw or /build-rw tmpfs
              filling: tmpfs has no swap, so it is not evicted. The peaks are
              printed by `Publish results for collect` in every run.

        ## Split by lane rather than by job kind: the pod template is a static
        ## file and the hook merges it verbatim, so a job pod can carry the
        ## lane it was made for but not which job it is running. The job kind
        ## comes from the listener's own gha_* metrics instead.
        - alert: GhaCiJobPodPending
          expr: >-
            kube_pod_status_phase{namespace="gha-ci",phase="Pending"} == 1
            and on (namespace, pod)
            kube_pod_labels{label_gha_ci_cubrid_org_lane!=""}
          for: 10m
          labels:
            severity: warning
            scope: gha-ci
          annotations:
            summary: "gha-ci job pod {{ '{{ $labels.pod }}' }} Pending for 10m"
            description: >-
              {{ '{{ $labels.pod }}' }} has been Pending for 10 minutes. The
              hook pins a job pod to its runner's node with spec.nodeName, so
              this is that node refusing it — no pod slot, no memory, or an
              image pull that is not finishing.
