---
# Prometheus sub-chart values, consumed by monitoring.yml as
# kube_prometheus_stack_values.prometheus.
#
# What lives here:
#   - service exposure (NodePort 32001)
#   - prometheusSpec scheduling, retention, storage, resources
#   - additionalScrapeConfigs entry for the external node_exporter fleet
#
# external_scrape_static_configs is populated in-memory by the
# external-scrape-config role (run on localhost in deploy-monitoring-full).
# Running deploy-monitoring.yml standalone without that role will fail
# with "Undefined variable" at the additionalScrapeConfigs reference —
# this is intentional fail-fast behaviour to prevent stale config.
monitoring_prometheus_values:
  service:
    type: NodePort
    nodePort: 32001

  prometheusSpec:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""

    ## Retention + storage + resources centralised in monitoring-resources.yml.
    ## Steady-state observation (2026-04):
    ##   Baseline (k8s nodes):           ~1,068 Mi
    ##   External 150 hosts (always on): ~600 Mi (+150K series × 4KB)
    ##   cubrid ns 50-60 pods ephemeral: ~240 Mi + ~720 Mi dead-series churn
    ##   WAL/compaction overhead (1.5x):  applied
    ## Adjust knobs in monitoring-resources.yml without editing this file.
    retention: "{{ monitoring_retention.prometheus }}"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "{{ monitoring_storage.prometheus }}"
    resources: "{{ monitoring_resources.prometheus }}"

    additionalScrapeConfigs:
      - job_name: external-node-exporter
        scrape_interval: "{{ node_exporter_scrape_interval | default('30s') }}"
        scrape_timeout: "{{ node_exporter_scrape_timeout | default('10s') }}"
        static_configs: "{{ hostvars['localhost']['external_scrape_static_configs'] }}"
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            regex: "([^:]+):.*"
            replacement: "$1"
