---
# kube-prometheus-stack main values. Chart docs:
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Siblings:
#   monitoring-alertmanager.yml → monitoring_alertmanager_values
#   monitoring-rules.yml        → monitoring_rules_external / monitoring_rules_meta
#
# Sizing target: ~270K active series (external hosts 50 + VMs 100 + k8s
# pods 100 + baseline). Prometheus disk = 22 GB raw at 15d retention,
# 250Gi PVC carries ~5x headroom for series growth and WAL churn.
kube_prometheus_stack_enabled: true
kube_prometheus_stack_namespace: monitoring
kube_prometheus_stack_chart_version: "75.6.2"

# Prometheus CPU limit at 4 cores so a heavy PromQL can't throttle the
# pod through compaction. Grafana memory headroom covers the
# "node-exporter-full" dashboard (1860) opening 150+ targets at once.
monitoring_resources:
  grafana:
    requests: {cpu: "500m", memory: "1Gi"}
    limits:   {cpu: "2000m", memory: "3Gi"}
  prometheus:
    requests: {cpu: "1500m", memory: "4Gi"}
    limits:   {cpu: "4000m", memory: "12Gi"}
  alertmanager:
    requests: {cpu: "100m", memory: "256Mi"}
    limits:   {cpu: "1000m", memory: "1Gi"}

# PVC sizes on the local-path StorageClass.
monitoring_storage:
  grafana: 10Gi
  prometheus: 250Gi
  alertmanager: 5Gi

# Prometheus retention only. AlertManager retention stays at chart
# default (alertmanagerSpec.retention=120h).
monitoring_retention:
  prometheus: 15d

monitoring_grafana_values:
  enabled: true
  defaultDashboardsTimezone: Asia/Seoul
  adminUser: admin
  adminPassword: "{{ vault_grafana_admin_password }}"

  persistence:
    enabled: true
    storageClassName: local-path
    size: "{{ monitoring_storage.grafana }}"

  ## chown init container causes permission flips on local-path PVs.
  initChownData:
    enabled: false

  sidecar:
    dashboards:
      enabled: true
      provider:
        allowUiUpdates: true

  service:
    type: NodePort
    nodePort: 32000

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources: "{{ monitoring_resources.grafana }}"

# external_scrape_static_configs is built by deploy-monitoring.yml
# Play A (external-monitoring role, tasks_from: scrape-config).
monitoring_prometheus_values:
  service:
    type: NodePort
    nodePort: 32001

  prometheusSpec:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""

    retention: "{{ monitoring_retention.prometheus }}"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "{{ monitoring_storage.prometheus }}"
    resources: "{{ monitoring_resources.prometheus }}"

    additionalScrapeConfigs:
      - job_name: external-node-exporter
        scrape_interval: "{{ node_exporter_scrape_interval | default('30s') }}"
        scrape_timeout: "{{ node_exporter_scrape_timeout | default('10s') }}"
        ## Empty-list fallback so dry-run renders cleanly when Play A's
        ## set_fact is skipped under --check. Real runs are still guarded
        ## by the Play C pre_task assert that requires the fact to exist.
        static_configs: "{{ hostvars['localhost']['external_scrape_static_configs'] | default([]) }}"
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            regex: "([^:]+):.*"
            replacement: "$1"

kube_prometheus_stack_values:
  grafana: "{{ monitoring_grafana_values }}"
  prometheus: "{{ monitoring_prometheus_values }}"
  alertmanager: "{{ monitoring_alertmanager_values }}"

  kubeStateMetrics:
    enabled: true

  ## kube-state-metrics subchart — control-plane pinning.
  kube-state-metrics:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  ## In-cluster node exporter daemonset. External nodes are covered by
  ## additionalScrapeConfigs above, not by this daemonset.
  nodeExporter:
    enabled: true

  ## node-exporter subchart. CUBRIDQA-1501 issue 14 — a job pod's /rw and
  ## /build-rw are emptyDir medium=Memory, so they sit under /var/lib/kubelet,
  ## which the chart's default mount-points-exclude hides. Nothing else sees
  ## them: gha-ci.yml prints df either side of CTP but never the peak, and
  ## kubelet_volume_stats_* is PVC-only. See docs/monitoring.md.
  prometheus-node-exporter:
    ## Only /var/lib/kubelet leaves the exclusion; fs-types-exclude is the
    ## chart default verbatim, and tmpfs is deliberately absent from it.
    ## ⚠ Re-copy both lines on a chart bump — this replaces the default, so a
    ##   stale copy silently reinstates what the new default would filter.
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    prometheus:
      monitor:
        ## The collector now reports every kubelet mount, so the filtering
        ## moves here, where it costs storage rather than scrape time: two
        ## emptyDir mounts per job pod and ~1,800 job pods a day, at nine
        ## series each, is ~32K new series a day against a 383K head. Keeping
        ## size and avail alone makes it ~7K.
        ## Mark-then-drop because RE2 has no negative lookahead, so rule 2
        ## drops the rest of /var/lib/kubelet whatever plugin made it.
        metricRelabelings:
          - sourceLabels: [mountpoint]
            regex: /var/lib/kubelet/pods/[^/]+/volumes/kubernetes\.io~empty-dir/.+
            targetLabel: __tmp_emptydir
            replacement: "yes"
            action: replace
          - sourceLabels: [mountpoint, __tmp_emptydir]
            separator: ;
            regex: /var/lib/kubelet/.+;
            action: drop
          - sourceLabels: [__name__, __tmp_emptydir]
            separator: ;
            regex: node_filesystem_(files|files_free|free_bytes|readonly|device_error|purgeable_bytes|mount_info);yes
            action: drop

  additionalPrometheusRulesMap:
    external-node-alerts: "{{ monitoring_rules_external }}"
    alertmanager-self-monitoring: "{{ monitoring_rules_meta }}"
