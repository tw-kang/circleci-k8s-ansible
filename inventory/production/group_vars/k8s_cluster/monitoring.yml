---
# kube-prometheus-stack monitoring deployment
# Based on https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
kube_prometheus_stack_enabled: true
kube_prometheus_stack_namespace: monitoring
kube_prometheus_stack_chart_version: "75.6.2"

# kube-prometheus-stack configuration values
# Full configuration reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#configuration
kube_prometheus_stack_values:
  # Grafana configuration (service, resources, and storage)
  grafana:
    enabled: true
    ## Timezone for the default dashboards
    defaultDashboardsTimezone: kst
    adminUser: admin
    adminPassword: "{{ vault_grafana_admin_password }}"

    ## To make Grafana persistent (Using Statefulset)
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi

    ## Disable init container that changes ownership (causes permission issues)
    initChownData:
      enabled: false

    sidecar:
      dashboards:
        enabled: true
        provider:
          allowUiUpdates: true

    ## Passed to grafana subchart and used by servicemonitor below
    service:
      type: NodePort
      nodePort: 32000

    ## Define which Nodes the Pods are scheduled on.
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    ## If specified, the pod's tolerations.
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # Prometheus configuration (service, resources, and storage)
  prometheus:
    ## Configuration for Prometheus service
    service:
      ## Service type
      type: NodePort
      ## Port to expose on each node
      ## Only used if service.type is 'NodePort'
      nodePort: 32001

    ## Settings affecting prometheusSpec
    ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#prometheusspec
    prometheusSpec:
      ## Tolerations for use with node taints
      ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      ## Define which Nodes the Pods are scheduled on.
      ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      ## How long to retain metrics
      retention: 15d

      ## Prometheus StorageSpec for persistent data
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/storage.md
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 200Gi

  # Alertmanager configuration (service, resources, and storage)
  alertmanager:
    ## Configuration for Alertmanager service
    service:
      ## Service type
      type: NodePort
      ## Port to expose on each node
      ## Only used if service.type is 'NodePort'
      nodePort: 32002

    ## Settings affecting alertmanagerSpec
    ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#alertmanagerspec
    alertmanagerSpec:
      ## Define which Nodes the Pods are scheduled on.
      ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      ## If specified, the pod's tolerations.
      ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      ## Storage is the definition of how storage will be used by the Alertmanager instances.
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/storage.md
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  ## Component scraping kube state metrics
  kubeStateMetrics:
    enabled: true

  ## Configuration for kube-state-metrics subchart
  kube-state-metrics:
    ## Define which Nodes the Pods are scheduled on.
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    ## If specified, the pod's tolerations.
    ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  ## Deploy node exporter as a daemonset to all nodes
  nodeExporter:
    enabled: true
