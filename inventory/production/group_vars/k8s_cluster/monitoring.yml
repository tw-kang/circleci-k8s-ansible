---
# kube-prometheus-stack monitoring deployment
# Based on https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
kube_prometheus_stack_enabled: true
kube_prometheus_stack_namespace: monitoring
kube_prometheus_stack_chart_version: "75.6.2"

# kube-prometheus-stack configuration values
# Full configuration reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#configuration
kube_prometheus_stack_values:
  # Grafana configuration (service, resources, and storage)
  grafana:
    enabled: true
    ## Timezone for the default dashboards
    defaultDashboardsTimezone: kst
    adminUser: admin
    adminPassword: "{{ vault_grafana_admin_password }}"

    ## To make Grafana persistent (Using Statefulset)
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi

    ## Disable init container that changes ownership (causes permission issues)
    initChownData:
      enabled: false

    sidecar:
      dashboards:
        enabled: true
        provider:
          allowUiUpdates: true

    ## Passed to grafana subchart and used by servicemonitor below
    service:
      type: NodePort
      nodePort: 32000

    ## Define which Nodes the Pods are scheduled on.
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    ## If specified, the pod's tolerations.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    ## Resource limits (observed 2026-04: 519Mi RAM, 5m CPU on master-01)
    resources:
      requests:
        cpu: "200m"
        memory: "600Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

    ## Node Exporter Full dashboard (Grafana ID 1860) in dedicated folder.
    ## Existing dashboards in the default sidecar folder are NOT affected.
    dashboards:
      external:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: Prometheus

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'external-nodes'
            orgId: 1
            folder: 'External Nodes'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/external

  # Prometheus configuration (service, resources, and storage)
  prometheus:
    ## Configuration for Prometheus service
    service:
      type: NodePort
      nodePort: 32001

    ## Settings affecting prometheusSpec
    prometheusSpec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      ## How long to retain metrics
      retention: 15d

      ## Prometheus StorageSpec for persistent data
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 200Gi

      ## Resource limits — sized for all metric sources on master-01 (2026-04):
      ##   Baseline (k8s nodes):           ~1,068 Mi observed
      ##   External 150 hosts (always on): ~600 Mi (+150K series × 4KB)
      ##   cubrid ns 50-60 pods ephemeral: ~240 Mi active + ~720 Mi dead-series churn
      ##   WAL/compaction overhead (1.5x):  applied above
      ##   → Steady-state estimate: ~3.9 Gi; request=3Gi, limit=10Gi (2.5x safety)
      ##   CPU: compaction spikes on high-churn cubrid pods → limit=4000m
      resources:
        requests:
          cpu: "1000m"
          memory: "3Gi"
        limits:
          cpu: "4000m"
          memory: "10Gi"

      ## External node scrape configuration.
      ## external_scrape_static_configs is populated in-memory by deploy-monitoring-full.yml Pre-task A.
      ## Running deploy-monitoring.yml standalone without the wrapper will cause an Undefined variable
      ## error here — this is intentional (fail-fast to prevent stale config).
      additionalScrapeConfigs:
        - job_name: external-node-exporter
          scrape_interval: "{{ node_exporter_scrape_interval | default('30s') }}"
          scrape_timeout: "{{ node_exporter_scrape_timeout | default('10s') }}"
          static_configs: "{{ hostvars['localhost']['external_scrape_static_configs'] }}"
          relabel_configs:
            - source_labels: [__address__]
              target_label: instance
              regex: "([^:]+):.*"
              replacement: "$1"

  # Alertmanager configuration (service, resources, and storage)
  alertmanager:
    ## Configuration for Alertmanager service
    service:
      type: NodePort
      nodePort: 32002

    ## Settings affecting alertmanagerSpec
    alertmanagerSpec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      ## Storage for Alertmanager
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

      ## Resource limits (observed 2026-04: 87Mi RAM, 1m CPU on master-01)
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    ## AlertManager configuration: single-receiver Teams webhook routing.
    ## All alerts (internal k8s + external nodes + Watchdog) flow into one
    ## Power Automate Workflow which posts an Adaptive Card to one Teams channel.
    ## No SMTP, no severity fanout, no dual delivery — see deep-interview spec R2/R4.
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: teams-default
        group_by: [alertname, instance]
        group_wait: 30s
        group_interval: 5m
        ## Top-level repeat_interval matches the critical-severity sub-route
        ## (1h) — anything that does not match an explicit sub-route is
        ## treated as critical-equivalent to avoid silent drops.
        repeat_interval: 1h
        ## Severity-aware routing — only operator-actionable alerts reach
        ## the Teams channel. First matching sub-route wins.
        ##
        ## Reminder cadence after firing:
        ##   - critical : 1h  (immediate operator attention required)
        ##   - warning  : 3h  (degraded but not down)
        ##   - info / none / Watchdog / InfoInhibitor : never (suppressed)
        ##
        ## Watchdog is AlertManager's deadman heartbeat (always firing by
        ## design) — surfacing it on Teams provides no signal; pair it with
        ## an external deadman service (Dead Man's Snitch / healthchecks.io)
        ## if you need pipeline-liveness monitoring. InfoInhibitor is the
        ## chart-shipped meta-alert whose only purpose is to drive the
        ## inhibit_rules below; it should never reach a human.
        routes:
          - matchers:
              - alertname = "Watchdog"
            receiver: "null"
          - matchers:
              - alertname = "InfoInhibitor"
            receiver: "null"
          - matchers:
              - severity = "info"
            receiver: "null"
          - matchers:
              - severity = "none"
            receiver: "null"
          - matchers:
              - severity = "warning"
            receiver: teams-default
            repeat_interval: 3h
          - matchers:
              - severity = "critical"
            receiver: teams-default
            repeat_interval: 1h
      receivers:
        ## Sink receiver for inhibitor / suppression alerts. Required even
        ## as a placeholder because operator config validation fails with
        ## `undefined receiver "null"` if any route references it.
        - name: "null"
        - name: teams-default
          webhook_configs:
            ## AlertManager posts to the in-cluster adapter (separate role
            ## `alertmanager-teams-adapter`), which converts the native
            ## payload to the Adaptive Card "attachments" envelope expected
            ## by Power Automate's TeamsWebhook trigger. The bearer-secret
            ## Workflow URL stays inside the adapter's Secret rather than
            ## flowing through the Helm-managed AlertManager config Secret,
            ## so kubectl get secret on the alertmanager-generated Secret
            ## no longer leaks the sig= token to anyone with read access.
            - url: "http://alertmanager-teams-adapter.monitoring.svc.cluster.local:8080/"
              send_resolved: true
      ## Mirror the chart-default InfoInhibitor → severity=info inhibit pair so
      ## info-level chatter is double-suppressed (route diverts InfoInhibitor
      ## to null, AND its presence inhibits other info alerts in the same
      ## namespace from firing as Teams cards in the first place).
      inhibit_rules:
        - source_matchers:
            - alertname = "InfoInhibitor"
          target_matchers:
            - severity = "info"
          equal:
            - namespace

  ## Component scraping kube state metrics
  kubeStateMetrics:
    enabled: true

  ## Configuration for kube-state-metrics subchart
  kube-state-metrics:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  ## Deploy node exporter as a daemonset to all nodes
  nodeExporter:
    enabled: true

  ## PrometheusRule CRDs for external node alerts (CPU/MEM/DISK thresholds).
  ## Nested inside kube_prometheus_stack_values so the Helm task receives them.
  additionalPrometheusRulesMap:
    external-node-alerts:
      groups:
        - name: external-node.rules
          rules:
            - alert: ExternalNodeHighCPU
              expr: >-
                100 - (avg by(instance) (
                  rate(node_cpu_seconds_total{mode="idle",job="external-node-exporter"}[5m])
                ) * 100) > 90
              for: 5m
              labels:
                severity: critical
                scope: external
              annotations:
                summary: "High CPU on {{ '{{ $labels.instance }}' }}"
                description: "CPU > 90% for 5m (current: {{ '{{ $value | printf \"%.2f\" }}' }}%)"

            - alert: ExternalNodeHighMemory
              expr: >-
                (1 - (
                  node_memory_MemAvailable_bytes{job="external-node-exporter"}
                  / node_memory_MemTotal_bytes{job="external-node-exporter"}
                )) * 100 > 85
              for: 10m
              labels:
                severity: warning
                scope: external
              annotations:
                summary: "High memory on {{ '{{ $labels.instance }}' }}"
                description: "Memory > 85% for 10m"

            - alert: ExternalNodeDiskFull
              expr: >-
                (1 - (
                  node_filesystem_avail_bytes{job="external-node-exporter",fstype!~"tmpfs|overlay"}
                  / node_filesystem_size_bytes{job="external-node-exporter",fstype!~"tmpfs|overlay"}
                )) * 100 > 80
              for: 10m
              labels:
                severity: warning
                scope: external
              annotations:
                summary: "Disk > 80% on {{ '{{ $labels.instance }}' }} ({{ '{{ $labels.mountpoint }}' }})"
                description: "Disk > 80% for 10m on {{ '{{ $labels.mountpoint }}' }}"

    ## Self-monitoring rules for AlertManager's own delivery health.
    ## With route.repeat_interval=3h, a failing webhook means up to 3h of alert
    ## blindness — this meta-alert is the canary that surfaces such failures.
    ## Detection: increase() on the failed-notifications counter; for=5m guards
    ## against transient single-batch retry blips.
    alertmanager-self-monitoring:
      groups:
        - name: alertmanager-self.rules
          rules:
            - alert: AlertmanagerWebhookFailing
              expr: >-
                increase(
                  alertmanager_notifications_failed_total{integration="webhook"}[5m]
                ) > 0
              for: 5m
              labels:
                severity: critical
                scope: meta
              annotations:
                summary: "AlertManager webhook delivery failing"
                description: >-
                  AlertManager has failed to deliver
                  {{ '{{ $value | printf "%.0f" }}' }} webhook notification(s)
                  to the Teams receiver in the last 5 minutes.
                  Check Power Automate flow status and egress to *.logic.azure.com.
                  Sustained failure means alerts are silent until repeat_interval (3h).
