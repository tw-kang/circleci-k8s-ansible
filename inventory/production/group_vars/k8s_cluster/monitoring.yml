---
# kube-prometheus-stack main values. Chart docs:
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Siblings:
#   monitoring-alertmanager.yml → monitoring_alertmanager_values
#   monitoring-rules.yml        → monitoring_rules_external / monitoring_rules_meta
#                                 / monitoring_rules_cluster
#
# Sizing (measured 2026-09-21): 717K active series, 25.3 GiB of TSDB at
# 15d retention, so ~1.69 GiB/day. 90d is ~152 GiB.
kube_prometheus_stack_enabled: true
kube_prometheus_stack_namespace: monitoring
kube_prometheus_stack_chart_version: "75.6.2"

# Prometheus CPU limit at 4 cores so a heavy PromQL can't throttle the
# pod through compaction. Grafana memory headroom covers the
# "node-exporter-full" dashboard (1860) opening 150+ targets at once.
monitoring_resources:
  grafana:
    requests: {cpu: "500m", memory: "1Gi"}
    limits:   {cpu: "2000m", memory: "3Gi"}
  prometheus:
    requests: {cpu: "1500m", memory: "4Gi"}
    limits:   {cpu: "4000m", memory: "12Gi"}
  alertmanager:
    requests: {cpu: "100m", memory: "256Mi"}
    limits:   {cpu: "1000m", memory: "1Gi"}

# PVC sizes on the local-path StorageClass.
monitoring_storage:
  grafana: 10Gi
  prometheus: 250Gi
  alertmanager: 5Gi

# Prometheus retention only. AlertManager retention stays at chart
# default (alertmanagerSpec.retention=120h).
monitoring_retention:
  prometheus: 90d

## Where roles/node-tuning writes .prom files and where the node_exporter
## daemonset reads them. One home for both — the role's play and
## deploy-monitoring.yml both run against k8s_cluster hosts.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile

monitoring_grafana_values:
  enabled: true
  defaultDashboardsTimezone: Asia/Seoul
  adminUser: admin
  adminPassword: "{{ vault_grafana_admin_password }}"

  persistence:
    enabled: true
    storageClassName: local-path
    size: "{{ monitoring_storage.grafana }}"

  ## chown init container causes permission flips on local-path PVs.
  initChownData:
    enabled: false

  sidecar:
    dashboards:
      enabled: true
      provider:
        allowUiUpdates: true

  service:
    type: NodePort
    nodePort: 32000

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources: "{{ monitoring_resources.grafana }}"

# external_scrape_static_configs is built by deploy-monitoring.yml
# Play A (external-monitoring role, tasks_from: scrape-config).
monitoring_prometheus_values:
  service:
    type: NodePort
    nodePort: 32001

  prometheusSpec:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""

    retention: "{{ monitoring_retention.prometheus }}"
    ## Runaway guard, not the working limit. Above the 200Gi PVC label on
    ## purpose: local-path enforces no quota, master-01 /home is the ceiling.
    retentionSize: 300GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "{{ monitoring_storage.prometheus }}"
    resources: "{{ monitoring_resources.prometheus }}"

    additionalScrapeConfigs:
      - job_name: external-node-exporter
        scrape_interval: "{{ node_exporter_scrape_interval | default('30s') }}"
        scrape_timeout: "{{ node_exporter_scrape_timeout | default('10s') }}"
        ## Empty-list fallback so dry-run renders cleanly when Play A's
        ## set_fact is skipped under --check. Real runs are still guarded
        ## by the Play C pre_task assert that requires the fact to exist.
        static_configs: "{{ hostvars['localhost']['external_scrape_static_configs'] | default([]) }}"
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            regex: "([^:]+):.*"
            replacement: "$1"

kube_prometheus_stack_values:
  grafana: "{{ monitoring_grafana_values }}"
  prometheus: "{{ monitoring_prometheus_values }}"
  alertmanager: "{{ monitoring_alertmanager_values }}"

  kubeStateMetrics:
    enabled: true

  ## kube-state-metrics subchart — control-plane pinning.
  kube-state-metrics:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  ## In-cluster node exporter daemonset. External nodes are covered by
  ## additionalScrapeConfigs above, not by this daemonset.
  nodeExporter:
    enabled: true

  ## node-exporter subchart. The textfile collector is compiled in and already
  ## running, but with no directory it reads nothing — so the gha-ci FUSE
  ## client CPU that roles/node-tuning writes needs this one argument to
  ## become a metric (CUBRIDQA-1501 issue 17). The path is reached through the
  ## `root` hostPath the chart already mounts read-only at /host/root, so the
  ## daemonset needs no extra volume.
  ##
  ## ⚠ `extraArgs` REPLACES the subchart default list rather than extending
  ## it. The two filesystem excludes below are that default, repeated
  ## verbatim; re-read `helm show values` for the chart version in
  ## `kube_prometheus_stack_chart_version` before editing this list.
  prometheus-node-exporter:
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - "--collector.textfile.directory=/host/root{{ node_exporter_textfile_dir }}"

  additionalPrometheusRulesMap:
    external-node-alerts: "{{ monitoring_rules_external }}"
    alertmanager-self-monitoring: "{{ monitoring_rules_meta }}"
    cluster-node-alerts: "{{ monitoring_rules_cluster }}"
    gha-ci-alerts: "{{ monitoring_rules_gha_ci }}"
