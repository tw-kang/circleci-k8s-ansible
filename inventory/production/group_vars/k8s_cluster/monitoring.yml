---
# kube-prometheus-stack monitoring deployment — top-level orchestrator.
# Based on https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# This file is intentionally short — it composes per-component values
# defined in sibling group_vars files so each section reads as one
# focused unit:
#
#   monitoring-grafana.yml       → monitoring_grafana_values
#   monitoring-prometheus.yml    → monitoring_prometheus_values
#   monitoring-alertmanager.yml  → monitoring_alertmanager_values
#   monitoring-rules-external.yml→ monitoring_rules_external
#   monitoring-rules-meta.yml    → monitoring_rules_meta
#   monitoring-resources.yml     → monitoring_{resources,storage,retention}
#
# NodePort assignments (kept inline in the per-component files as int
# literals so the chart receives the right type without Jinja
# stringification):
#   grafana      → 32000  (monitoring-grafana.yml)
#   prometheus   → 32001  (monitoring-prometheus.yml)
#   alertmanager → 32002  (monitoring-alertmanager.yml)
#
# Full chart configuration reference:
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#configuration
kube_prometheus_stack_enabled: true
kube_prometheus_stack_namespace: monitoring
kube_prometheus_stack_chart_version: "75.6.2"

kube_prometheus_stack_values:
  grafana: "{{ monitoring_grafana_values }}"
  prometheus: "{{ monitoring_prometheus_values }}"
  alertmanager: "{{ monitoring_alertmanager_values }}"

  ## Component scraping kube state metrics — small enough to inline.
  kubeStateMetrics:
    enabled: true

  ## kube-state-metrics subchart — pin to control-plane node only.
  kube-state-metrics:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  ## Deploy node exporter as a daemonset to every k8s node.
  ## (External nodes outside the cluster are scraped via
  ## additionalScrapeConfigs in monitoring-prometheus.yml.)
  nodeExporter:
    enabled: true

  ## PrometheusRule CRDs. Two distinct groups: data-plane alerts on the
  ## external fleet, and self-monitoring alerts on the alerting pipeline.
  additionalPrometheusRulesMap:
    external-node-alerts: "{{ monitoring_rules_external }}"
    alertmanager-self-monitoring: "{{ monitoring_rules_meta }}"
