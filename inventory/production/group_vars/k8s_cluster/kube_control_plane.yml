# Master node (32 vCPU, 64GiB RAM, 4T SSD)

node_labels:
  node-role.kubernetes.io/control-plane: ""
  node-role.kubernetes.io/worker: null

# Reserve for k8s components
kube_memory_reserved: 4096Mi
kube_cpu_reserved: 1000m
kube_ephemeral_storage_reserved: 50Gi

# Reserve for system processes
system_memory_reserved: 4096Mi
system_cpu_reserved: 1000m
system_ephemeral_storage_reserved: 50Gi

