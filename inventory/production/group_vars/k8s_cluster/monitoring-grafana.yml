---
# Grafana sub-chart values, consumed by monitoring.yml as
# kube_prometheus_stack_values.grafana.
#
# What lives here:
#   - service exposure (NodePort 32000)
#   - persistent volume claim
#   - dashboard provider for the External Nodes folder
#   - Node Exporter Full dashboard import (gnetId 1860)
#
# Operational sizing (resources, persistence size) is centralised in
# monitoring-resources.yml — adjust there, not here.
monitoring_grafana_values:
  enabled: true
  ## Timezone for the default dashboards
  defaultDashboardsTimezone: kst
  adminUser: admin
  adminPassword: "{{ vault_grafana_admin_password }}"

  ## Persistent volume; PVC size centralised in monitoring-resources.yml
  persistence:
    enabled: true
    storageClassName: local-path
    size: "{{ monitoring_storage.grafana }}"

  ## Disable init container that changes ownership (causes permission issues)
  initChownData:
    enabled: false

  sidecar:
    dashboards:
      enabled: true
      provider:
        allowUiUpdates: true

  ## Passed to grafana subchart and used by servicemonitor below
  service:
    type: NodePort
    nodePort: 32000

  ## Schedule on a control-plane node only.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  ## Resource sizing centralised in monitoring-resources.yml
  ## (observed 2026-04: 519Mi RAM, 5m CPU on master-01).
  resources: "{{ monitoring_resources.grafana }}"

  ## Node Exporter Full dashboard (Grafana ID 1860) in dedicated folder.
  ## Existing dashboards in the default sidecar folder are NOT affected.
  dashboards:
    external:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'external-nodes'
          orgId: 1
          folder: 'External Nodes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/external
