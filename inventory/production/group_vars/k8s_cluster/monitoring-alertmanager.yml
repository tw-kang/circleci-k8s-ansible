---
# AlertManager values consumed by monitoring.yml as
# kube_prometheus_stack_values.alertmanager.
#
# Webhook URL is held in an external Kubernetes Secret
# (`alertmanager-config`) created by deploy-monitoring.yml's `Render
# alertmanager-config Secret` task. The chart's
# `alertmanagerSpec.configSecret` reference replaces the in-line `config`
# block — the bearer-secret Workflow URL never reaches the helm release
# values dict (`helm get values` stays clean of secrets, addressing the
# PoC round-3 Secret-hygiene finding).
#
# Routing/inhibit edits still happen in this file via `alertmanager_config_yaml`
# below; that dict is rendered into the Secret by the playbook with no_log.
# git diff on this file therefore still reviews routing changes — only the
# bearer URL itself is moved out of helm values.

alertmanager_config_secret_name: alertmanager-config

monitoring_alertmanager_values:
  service:
    type: NodePort
    nodePort: 32002

  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "{{ monitoring_storage.alertmanager }}"
    resources: "{{ monitoring_resources.alertmanager }}"

    ## External Secret reference. Chart skips its own generated config
    ## Secret when configSecret is set; AM mounts /etc/alertmanager/config
    ## from this Secret. Created by playbook before helm upgrade.
    configSecret: "{{ alertmanager_config_secret_name }}"

## AlertManager configuration rendered into the alertmanager-config Secret
## by `Render alertmanager-config Secret`. Sensitive — contains
## vault_teams_webhook_url. Route/inhibit edits reviewed via git diff here.
##
## Severity + scope + time-aware Teams routing. First matching sub-route
## wins (no `continue: true`). Reminder cadence on the K8s/meta path is
## critical 1h / warning 3h / info|null|Watchdog never. The
## `scope=external` + `type=service` sub-tree adds a weekday 08-18 KST
## active-time gate; see ADR-0002 for the trade-off (after-hours
## auto-resolving incidents on type=service hosts are intentionally not
## delivered to Teams).
##
## Top-level repeat_interval matches critical so anything escaping the
## sub-routes is treated as critical-equivalent (no silent drops).
##
## Watchdog is AlertManager's always-firing deadman heartbeat — pair it
## with an external deadman service (Snitch / healthchecks.io) for
## pipeline liveness; surfacing it on Teams adds noise without signal.
## InfoInhibitor is the chart-shipped meta-alert that only drives the
## inhibit_rules below.
alertmanager_config_yaml:
  global:
    resolve_timeout: 5m

  ## Time-based gate for the service-host sub-route. AlertManager
  ## suppresses (does NOT queue) notifications outside the window: alerts
  ## that fire AND auto-resolve fully outside 08-18 KST weekdays will
  ## never reach Teams. See docs/adr/0002-service-workinghours-route.md.
  ## `location` requires AlertManager >= 0.24, satisfied by chart 75.6.2.
  time_intervals:
    - name: korea-workinghours
      time_intervals:
        - times:
            - start_time: "08:00"
              end_time: "18:00"
          weekdays: ["monday:friday"]
          location: "Asia/Seoul"

  route:
    receiver: teams-default
    group_by: [alertname, instance]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      ## Noise suppression — unchanged from prior config.
      - matchers: [alertname = "Watchdog"]
        receiver: "null"
      - matchers: [alertname = "InfoInhibitor"]
        receiver: "null"
      - matchers: [severity = "info"]
        receiver: "null"
      - matchers: [severity = "none"]
        receiver: "null"

      ## External fleet — service-only office-hour policy (ADR-0002).
      ## `scope=external` is set by every rule in monitoring-rules.yml;
      ## `type` is injected per-target by external_scrape_static_configs
      ## with default "unassigned", so the label is always present and
      ## matchers evaluate definitively.
      ##
      ## Block-first: non-service external hosts (type=infra | test* |
      ## unassigned) drop to the null receiver — Teams stays silent.
      ## Firing still surfaces in Prometheus and the AlertManager UI.
      - matchers: ['scope = "external"', 'type != "service"']
        receiver: "null"

      ## Allow-second: service hosts route to Teams but ONLY during
      ## weekday 08-18 KST. Both severities honour the window — see
      ## ADR-0002 for the explicit acceptance of critical-loss on
      ## after-hours self-healing incidents.
      - matchers: ['scope = "external"', 'type = "service"']
        receiver: teams-default
        active_time_intervals: [korea-workinghours]
        routes:
          - matchers: [severity = "warning"]
            repeat_interval: 3h
          - matchers: [severity = "critical"]
            repeat_interval: 1h

      ## Default path — K8s cluster default rules (no scope label) and
      ## scope=meta canary (AlertmanagerWebhookFailing). Delivered 24/7
      ## with the original critical 1h / warning 3h cadence.
      - matchers: [severity = "warning"]
        receiver: teams-default
        repeat_interval: 3h
      - matchers: [severity = "critical"]
        receiver: teams-default
        repeat_interval: 1h
  receivers:
    ## Required placeholder — operator config validation fails if any
    ## route references an undefined "null" receiver.
    - name: "null"
    - name: teams-default
      webhook_configs:
        ## Direct POST to Power Automate Workflow trigger. Flow handles
        ## envelope wrapping + AdaptiveCard composition + msteams.entities
        ## mention rendering server-side. See round 6 PoC results in
        ## memory `project_msteams_adapter_decision.md`.
        - url: "{{ vault_teams_webhook_url }}"
          send_resolved: true
  ## Mirror the chart-default InfoInhibitor → severity=info inhibit so
  ## info-level chatter is suppressed at the source.
  inhibit_rules:
    - source_matchers: [alertname = "InfoInhibitor"]
      target_matchers: [severity = "info"]
      equal: [namespace]
