---
# AlertManager values consumed by monitoring.yml as
# kube_prometheus_stack_values.alertmanager.
#
# All actionable alerts go through the in-cluster
# alertmanager-teams-adapter Service. The adapter translates the native
# AlertManager payload into the Adaptive Card envelope the Power
# Automate Workflow trigger expects, and holds the bearer-secret
# Workflow URL in its own Secret (off the chart values).
monitoring_alertmanager_values:
  service:
    type: NodePort
    nodePort: 32002

  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "{{ monitoring_storage.alertmanager }}"
    resources: "{{ monitoring_resources.alertmanager }}"

  ## Severity-aware Teams routing. First matching sub-route wins.
  ## Reminder cadence: critical 1h, warning 3h, info/null/Watchdog never.
  ## Top-level repeat_interval matches critical so anything escaping the
  ## sub-routes is treated as critical-equivalent (no silent drops).
  ##
  ## Watchdog is AlertManager's always-firing deadman heartbeat — pair it
  ## with an external deadman service (Snitch / healthchecks.io) for
  ## pipeline liveness; surfacing it on Teams adds noise without signal.
  ## InfoInhibitor is the chart-shipped meta-alert that only drives the
  ## inhibit_rules below.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: teams-default
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
        - matchers: [alertname = "InfoInhibitor"]
          receiver: "null"
        - matchers: [severity = "info"]
          receiver: "null"
        - matchers: [severity = "none"]
          receiver: "null"
        - matchers: [severity = "warning"]
          receiver: teams-default
          repeat_interval: 3h
        - matchers: [severity = "critical"]
          receiver: teams-default
          repeat_interval: 1h
    receivers:
      ## Required placeholder — operator config validation fails if any
      ## route references an undefined "null" receiver.
      - name: "null"
      - name: teams-default
        webhook_configs:
          ## In-cluster adapter Service. See
          ## roles/external-monitoring/tasks/adapter.yml for translation.
          - url: "http://alertmanager-teams-adapter.monitoring.svc.cluster.local:8080/"
            send_resolved: true
    ## Mirror the chart-default InfoInhibitor → severity=info inhibit so
    ## info-level chatter is suppressed at the source.
    inhibit_rules:
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]
