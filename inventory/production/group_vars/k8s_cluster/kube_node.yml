# Worker node resource reservations for production environment
# Individual node configurations are managed in host_vars/
# Note: All resource reservation values are defined per-host in host_vars/
# to accommodate different hardware specifications across worker nodes

# Worker node (192 vCPU, 512GiB RAM, 7.68T SSD)
# Reserve 2.5% for k8s components 
kube_memory_reserved: 12288Mi     # ~12GB (2.5% of 512GB)
kube_cpu_reserved: 4800m          # 4.8 vCPU (2.5% of 192 vCPU)
kube_ephemeral_storage_reserved: 192Gi  # Sufficient for k8s logs, tmp files (2.5% of 7.68T)
# kube_pid_reserved: "2000"        # Higher PID limit for k8s processes

# Reserve 2.5% for system processes
system_memory_reserved: 12288Mi   # ~12GB (2.5% of 512GB)
system_cpu_reserved: 4800m        # 4.8 vCPU (2.5% of 192 vCPU)
system_ephemeral_storage_reserved: 192Gi  # System logs, cache, tmp (2.5% of 7.68T)
# system_pid_reserved: "1000"      # System process PID reservation

# Summary for worker node (192 vCPU, 512GiB RAM, 7.68T SSD):
# - Reserved for k8s components: 4.8 vCPU, 12GiB RAM, 192GiB storage
# - Reserved for system:         4.8 vCPU, 12GiB RAM, 192GiB storage
# - Available for workloads:    182.4 vCPU, 488GiB RAM, 7.296TiB storage