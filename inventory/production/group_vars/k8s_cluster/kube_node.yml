# Worker node resource reservations for production environment
# Individual node configurations are managed in host_vars/
# Note: All resource reservation values are defined per-host in host_vars/
# to accommodate different hardware specifications across worker nodes

# Worker node (192 vCPU, 512GiB RAM, 7.68T SSD)
# Reserve for k8s components 
kube_memory_reserved: 17408Mi
kube_cpu_reserved: 2000m
kube_ephemeral_storage_reserved: 100Gi

# Reserve for system processes
system_memory_reserved: 6144Mi
system_cpu_reserved: 1000m
system_ephemeral_storage_reserved: 100Gi

# Summary for worker node (192 vCPU, 512GiB RAM, 7.68T SSD):
# - Reserved for k8s components: 2 vCPU, 16GiB RAM, 100GiB storage
# - Reserved for system:         1 vCPU, 6GiB RAM, 100GiB storage
# - Available for workloads:    189 vCPU, 496GiB RAM, 7.488TiB storage