# External physical machines and VMs monitored by production Prometheus.
# This inventory is separate from hosts.ini (Kubernetes cluster nodes).
#
# Usage:
#   ansible-playbook -i inventory/production/hosts.ini \
#                    -i inventory/production/external-nodes.ini \
#                    playbooks/deploy-external-monitoring.yml
#
# Add hosts in the format:
#   <hostname> ansible_host=<IP> ansible_user=root
#
# CentOS 6 is NOT supported (glibc 2.12 incompatible with node_exporter >= 1.5).

# ── Physical machines (CentOS 7) ─────────────────────────────────────────────
[external_centos7]
rnd06 ansible_host=192.168.1.4 ansible_user=root
# example-phy-02 ansible_host=10.0.0.12 ansible_user=root
# ... populate with actual 50 physical machine entries

# ── VMs (Rocky Linux 8) ──────────────────────────────────────────────────────
[external_rocky8]
rnd06_dev ansible_host=192.168.1.5 ansible_user=root
# example-vm-02 ansible_host=10.0.1.12 ansible_user=root
# ... populate with actual 100 VM entries

# ── Combined group ────────────────────────────────────────────────────────────
[external_nodes:children]
external_centos7
external_rocky8

[external_nodes:vars]
# Let Ansible discover a usable interpreter per host. CentOS 7 ships with
# /usr/bin/python (2.7) by default and may not have python3 installed; Rocky 8
# has /usr/bin/python3. Hard-coding /usr/bin/python3 across the whole group
# breaks CentOS 7 hosts that haven't had python3 installed manually.
ansible_python_interpreter=auto_silent
