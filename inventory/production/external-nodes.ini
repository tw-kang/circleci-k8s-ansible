# External physical machines and VMs monitored by production Prometheus.
# This inventory is separate from hosts.ini (Kubernetes cluster nodes).
#
# Usage:
#   ansible-playbook -i inventory/production/hosts.ini \
#                    -i inventory/production/external-nodes.ini \
#                    playbooks/deploy-external-monitoring.yml
#
# Add hosts in the format:
#   <hostname> ansible_host=<IP> ansible_user=root \
#       owner_email=<UPN>@cubrid.com test_purpose=<short-tag>
#
# Per-host metadata that flows through to Prometheus labels and the
# Teams adapter:
#   owner_email  → AAD UPN/email used for Teams @mention. External
#                  guests cannot be mentioned via Power Automate
#                  Workflows; the alert still surfaces, the @ token
#                  just produces no notification. Hosts without this
#                  field render plain cards with no @mention.
#   test_purpose → free-form tag describing what the host is used
#                  for; comma-join for multiple roles
#                  (e.g. test_purpose=qa-perf,backup-verification).
#                  Optional; missing → "unassigned".
#
# CentOS 6 is NOT supported (glibc 2.12 incompatible with node_exporter >= 1.5).

# ── Physical machines (CentOS 7) ─────────────────────────────────────────────
[external_centos7]
rnd06 ansible_host=192.168.1.4 ansible_user=root owner_email=twkang@cubrid.com test_purpose=qa-general
# example-phy-02 ansible_host=10.0.0.12 ansible_user=root owner_email=...@cubrid.com test_purpose=...
# ... populate with actual 50 physical machine entries

# ── VMs (Rocky Linux 8) ──────────────────────────────────────────────────────
[external_rocky8]
rnd06_dev ansible_host=192.168.1.5 ansible_user=root owner_email=twkang@cubrid.com test_purpose=qa-development
# example-vm-02 ansible_host=10.0.1.12 ansible_user=root owner_email=...@cubrid.com test_purpose=...
# ... populate with actual 100 VM entries

# ── Combined group ────────────────────────────────────────────────────────────
[external_nodes:children]
external_centos7
external_rocky8

# ansible-core 2.19's auto_silent is more strict about python3 and won't
# fall back to /usr/bin/python on CentOS 7 hosts without python3 installed.
# Pin per-group so 2.16 and 2.19 controllers both work:
#   CentOS 7 → /usr/bin/python (2.7) — node_exporter role uses only core
#              modules that work on 2.7. Use ansible-core ≤ 2.16 to deploy
#              this group; 2.17+ dropped py2 managed.
#   Rocky 8  → /usr/bin/python3 (3.6 baseline; install python3.11 if you
#              need ansible-core 2.18+ on the controller).

[external_centos7:vars]
ansible_python_interpreter=/usr/bin/python

[external_rocky8:vars]
ansible_python_interpreter=/usr/bin/python3
