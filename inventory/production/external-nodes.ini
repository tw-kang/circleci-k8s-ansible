# External physical machines and VMs monitored by production Prometheus.
# This inventory is separate from hosts.ini (Kubernetes cluster nodes).
#
# Structure
#   external_host  → bare-metal servers
#   external_vm    → virtual machines
#   external_nodes → both, consumed by the external-monitoring role
#
# Tier groups are not credential boundaries — every host expects the
# controller's SSH public key in root@authorized_keys (publickey-only,
# no password fallback). They exist so monitoring (the `tier` Prometheus
# label, dashboards, alert routing) can distinguish bare-metal from VMs.
#
# Per-host attributes
#   distribution=<centos7|rocky8>  → Prometheus label
#   ansible_python_interpreter     → pinned per-OS so the role works on
#                                    both ansible-core 2.16 and 2.19+
#                                    controllers
#   test_purpose=<short-tag>       → free-form tag (Teams card metadata)
#   owner_email=<UPN>              → Teams @mention target; currently the
#                                    same operator across the fleet but
#                                    declared per-row because ownership
#                                    will diverge.
#
# CentOS 6 is NOT supported (glibc 2.12 incompatible with node_exporter >= 1.5).

# ── Physical hosts ───────────────────────────────────────────────────
[external_host]
qa07  ansible_host=192.168.1.37 distribution=centos7 ansible_python_interpreter=/usr/bin/python test_purpose=qa-physical owner_email=twkang@cubrid.com
qa06  ansible_host=192.168.1.36 distribution=centos7 ansible_python_interpreter=/usr/bin/python test_purpose=qa-physical owner_email=twkang@cubrid.com
rnd06 ansible_host=192.168.1.4  distribution=centos7 ansible_python_interpreter=/usr/bin/python test_purpose=qa-general  owner_email=twkang@cubrid.com

# ── Virtual machines ─────────────────────────────────────────────────
# proxy01 / emerg (192.168.1.210, standby pair) and org02 (192.168.1.202)
# are intentionally excluded — proxy01/emerg until the active vs standby
# IP split is clarified, org02 until its credential model is confirmed.
[external_vm]
rnd06_dev ansible_host=192.168.1.5   distribution=centos7 ansible_python_interpreter=/usr/bin/python  test_purpose=qa-development owner_email=twkang@cubrid.com
qa03      ansible_host=192.168.1.91  distribution=centos7 ansible_python_interpreter=/usr/bin/python  test_purpose=ci-msgqueue    owner_email=twkang@cubrid.com
build01   ansible_host=192.168.1.61  distribution=centos7 ansible_python_interpreter=/usr/bin/python  test_purpose=build          owner_email=twkang@cubrid.com
qa01      ansible_host=192.168.1.86  distribution=centos7 ansible_python_interpreter=/usr/bin/python  test_purpose=qahome-master  owner_email=twkang@cubrid.com
qa02      ansible_host=192.168.1.90  distribution=centos7 ansible_python_interpreter=/usr/bin/python  test_purpose=performance    owner_email=twkang@cubrid.com
func48    ansible_host=192.168.1.123 distribution=rocky8  ansible_python_interpreter=/usr/bin/python3 test_purpose=shell-ext      owner_email=twkang@cubrid.com
func49    ansible_host=192.168.1.124 distribution=rocky8  ansible_python_interpreter=/usr/bin/python3 test_purpose=shell-ext      owner_email=twkang@cubrid.com
func50    ansible_host=192.168.1.125 distribution=rocky8  ansible_python_interpreter=/usr/bin/python3 test_purpose=shell-ext      owner_email=twkang@cubrid.com
func51    ansible_host=192.168.1.126 distribution=rocky8  ansible_python_interpreter=/usr/bin/python3 test_purpose=shell-ext      owner_email=twkang@cubrid.com

# ── Combined group ───────────────────────────────────────────────────
[external_nodes:children]
external_host
external_vm

# Shared ansible_user across both tiers — publickey-only, no
# password vars (rejected as too risky to keep in vault).
[external_nodes:vars]
ansible_user=root
