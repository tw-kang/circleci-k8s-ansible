# External physical machines and VMs monitored by production Prometheus.
# This inventory is separate from hosts.ini (Kubernetes cluster nodes).
#
# Structure
#   external_host  → bare-metal servers
#   external_vm    → virtual machines
#   external_nodes → both, consumed by the external-monitoring role
#
# Tier groups are not credential boundaries — every host expects the
# controller's SSH public key in root@authorized_keys (publickey-only,
# no password fallback). They exist so monitoring (the `tier` Prometheus
# label, dashboards, alert routing) can distinguish bare-metal from VMs.
#
# Per-host attributes
#   distribution=<centos7|rocky8>  → Prometheus label
#   ansible_python_interpreter     → pinned per-OS so the role works on
#                                    both ansible-core 2.16 and 2.19+
#                                    controllers
#   type=<test|service|infra>      → top-level role
#       test     — runs QA workloads (func*, perf*, qa-test machines)
#       service  — provides an end-user service (proxy, web, jira, nas,
#                  cubrid-foundation, org)
#       infra    — supports test/service (build host, VM host, QA-home,
#                  CI message queue, R&D lab, builder-tester)
#   category=<sub-tag>             → workload-specific tag inside `type`.
#                                    Both labels are exported to Prometheus
#                                    and surfaced on the Teams alert card.
#   owner_email_primary=<UPN>      → 정 owner (always present); Teams Flow
#                                    renders this as the first @mention.
#   owner_email_secondary=<UPN>    → 부 owner (optional); rendered as a
#                                    second @mention when set. Omit on
#                                    single-owner hosts (Prometheus drops
#                                    empty label values, so the Flow sees
#                                    "no secondary" and renders just one).
#
# Hosts omitted from this inventory (per source-table markers)
#   - 제외: switches, FortiGate, Windows (mail/Hyper_manager,
#     qa_host01/qa17, winbuild, winfunc01/02), CentOS 6 (rnd07,
#     rndpv123), dev1/2/3, cluster1~4. (Windows is also
#     platform-incompatible with node_exporter; CentOS 6's glibc 2.12
#     is below node_exporter >= 1.5 minimum.)
#   - internal: k8s-master-01/02 (R2FW137), k8s-worker-01/02 (R2FW158).
#     Already scraped by in-cluster kube-prometheus-stack.
#
# Edge cases that ARE included below
#   - proxy01 / emerg share internal IP 192.168.1.210 (active/standby).
#     Both rows kept; only the live node will scrape successfully.
#   - rnd06_tech (192.168.1.7) and org03 (192.168.1.203) are powered
#     down at inventory time; Prometheus will mark them DOWN until
#     restored.
#   - qa26_func91 (192.168.2.151) duplicates qa25's func91 in the
#     source table. Listed with a disambiguated hostname pending
#     resolution of the source-table conflict.
#   - tech_test (192.168.8.2) is the placeholder hostname for the
#     unnamed "기술본부 테스트 장비" row.

