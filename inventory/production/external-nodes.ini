# ── Combined group ───────────────────────────────────────────────────
[external_nodes:children]
external_host
external_vm

# ── Tier-specific credentials (vault-encrypted) ──────────────────────
[external_host:vars]
ansible_user=root
ansible_ssh_pass="{{ vault_host_root_password }}"
ansible_become_pass="{{ vault_host_root_password }}"

[external_vm:vars]
ansible_user=root
ansible_ssh_pass="{{ vault_vm_root_password }}"
ansible_become_pass="{{ vault_vm_root_password }}"
