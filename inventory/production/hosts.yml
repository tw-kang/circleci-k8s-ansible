all:
  children:
    k8s_cluster:
      children:
        k8s_masters:
          hosts:
            k8s-master-01:
              ansible_host: 192.168.2.8  # Master node IP
              ansible_user: root
              node_role: master
        k8s_workers:
          hosts:
            k8s-worker-01:
              ansible_host: 192.168.1.48  # Added by setup-cluster.sh
              ansible_user: root
              node_role: worker
            # Example of adding worker nodes:
            k8s-worker-02:
              ansible_host: 192.168.1.49   # Worker node IP
              ansible_user: root
              node_role: worker