all:
  vars:
    # Master node IP for cluster configuration
    k8s_master_ip: "198.19.249.65"
    
  children:
    k8s_cluster:
      children:
        k8s_masters:
          hosts:
            k8s-master-01:
              ansible_host: 198.19.249.65  # 실제 마스터 노드 IP
              ansible_user: root
              ansible_python_interpreter: /usr/bin/python3
              node_role: master
        k8s_workers:
          hosts:
            # 워커 노드 추가 예시:
            # k8s-worker-01:
            #   ansible_host: 192.168.1.100
            #   ansible_user: root
            #   ansible_python_interpreter: /usr/bin/python3
            #   node_role: worker
            # 추가 워커 노드들을 위한 예약 공간
            # k8s-worker-02:
            #   ansible_host: 198.19.249.xxx
            #   ansible_user: root
            #   ansible_python_interpreter: /usr/bin/python3
            #   node_role: worker
      vars:
        # Rocky Linux 8 specific configuration
        ansible_python_interpreter: /usr/bin/python3
        
        # SSH Configuration
        ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=publickey'
        ansible_ssh_retries: 3
        ansible_connect_timeout: 30
        
        # Architecture-specific overrides (ARM64 환경용)
        # group_vars/all.yml의 kubernetes 설정을 완전히 오버라이드하되 모든 속성 포함
        kubernetes:
          version: "1.28.15"
          cni_plugin: "flannel"  # ARM64 환경에서는 Flannel 사용 (group_vars/all.yml의 calico 오버라이드)
          pod_network_cidr: "10.244.0.0/16"
          service_network_cidr: "10.96.0.0/12"
          cluster_name: "circleci-k8s-cluster"
        
        # Architecture-specific overrides (ARM64 환경에서만 필요한 경우)
        # ARM64 환경에서는 Flannel CNI를 강제로 사용
        kubernetes_cni_override: "flannel"  # ARM64에서만 사용
        
        # Kubernetes master configuration (IP 변수화)
        k8s_master:
          api_server:
            advertise_address: "{{ k8s_master_ip }}"
            bind_port: 6443
        
        # CircleCI configuration
        circleci_runner_enabled: true
