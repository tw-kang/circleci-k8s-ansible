all:
  children:
    k8s_cluster:
      children:
        k8s_masters:
          hosts:
            k8s-master-01:
              ansible_host: 198.19.249.181  # 실제 마스터 노드 IP
              ansible_user: root
              ansible_python_interpreter: /usr/bin/python3
              node_role: master
        k8s_workers:
          hosts:
            k8s-worker-01:
              ansible_host: 198.19.249.230  # 실제 워커 노드 IP
              ansible_user: root
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
            # 추가 워커 노드들을 위한 예약 공간
            # k8s-worker-02:
            #   ansible_host: 198.19.249.xxx
            #   ansible_user: root
            #   ansible_python_interpreter: /usr/bin/python3
            #   node_role: worker
      vars:
        # Rocky Linux 8 specific configuration
        ansible_python_interpreter: /usr/bin/python3
        
        # Kubernetes cluster configuration
        k8s_version: "1.28.15"
        k8s_cni: "flannel"  # ARM64 환경에서는 Flannel 사용
        k8s_pod_subnet: "10.244.0.0/16"
        k8s_service_subnet: "10.96.0.0/12"
        
        # Container runtime configuration (ARM64)
        container_runtime_version: "1.7.27"
        
        # CircleCI configuration
        circleci_runner_enabled: true 