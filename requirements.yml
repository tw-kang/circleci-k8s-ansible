---
# Ansible Collections Requirements
# Install with: ansible-galaxy install -r requirements.yml

collections:
  # Kubernetes collection for managing k8s resources
  - name: kubernetes.core
    version: ">=2.4.0"
  
  # Community general collection for various modules
  - name: community.general
    version: ">=6.0.0"
  
  # Ansible posix collection for system management
  - name: ansible.posix
    version: ">=1.5.0"

# Ansible Roles from Galaxy (if needed)
roles: []

# Python requirements (to be installed with pip)
# pip install -r python-requirements.txt 